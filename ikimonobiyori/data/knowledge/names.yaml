    # 許可の外だったので、Wikimedia Commons の File:Collinsonia_japonica_s1.jpg(CC0、Alpsdake。花の咲いた株)。データ置き場の写真のキャッシュ
    plant: {inat_taxon_name: Keiskea japonica, note: 植物シモバシラの花(8〜10月の記録), status: fetched, fetched_on: "2026-11-10"}
