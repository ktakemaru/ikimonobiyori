# 段階64 第3部: 日付を聞いていない「いつ・どこ」の質問(「藤が有名な場所と時期を教えて」「ニッコウキスゲはいつどこへ行けばいい?」)の答え。
# ikimonobiyori/season_place.py が読む。通信しない。名所と例年の時期は、名所カタログ(data/catalog/*.yaml)・ガイドのカタログ
# (data/guide/catalog.yaml)・読んだ事実の記録(ask record の kind と typical)からだけ作る。今の日付で候補を絞らない。
schema: ikimonobiyori-season-place/1
provisional: true

# 「時期と場所」の質問の言い方(どれかに当たり、下の日付の語がないとき)
patterns: ["場所と時期", "時期と場所", "見頃と場所", "場所と見頃", "見ごろと場所", "場所と見ごろ", "いつ.{0,8}どこ", "どこ.{0,8}いつ", "有名な", "スポット", "群生地",
           "名所", "見られる場所", "見られるところ", "見られる所", "楽しめる場所", "楽しめるところ", "見に行ける", "紹介して", "場所を教えて", "どこで見られ", "どこに行けば",
           "どこへ行けば", "見頃と", "の時期",
           # 段階78 第2部 2: 種の「地域と時期」「見たい」も、名所の一覧(「名所」と同じ)
           "地域と時期", "時期と地域", "見られる地域", "を見たい[。!！?？]?$"]
# 日付・今の様子を聞く語(これがあれば、これまでの計画の型)
date_words: ["今の時期", "今週", "週末", "今日", "明日", "明後日", "来週", "今月", "来月", "今見", "今の様子", "今年", "最新", '\d{1,2}月\d{1,2}日', '\d{1,2}/\d{1,2}']

# 種・見どころの語(質問の語 → 名所の種の語)。words は質問で使われる言い方(ひらがな・カタカナ・漢字・別名)、
# match は名所カタログ・ガイドのカタログ・記録の種(kind・flower_kinds・kinds)に含まれていれば当たりとする語。
# includes は、その種に含める別の種(桜 → 河津桜・冬桜・寒桜)。ほかの種の、より長い語に当たる種(蝋梅 → ロウバイ)は含めない。
# 名前は答えに出す呼び名。ここにない種も、カタログの種の語がそのまま質問にあれば当たる(推測で別の種に結びつけない)
species:
  - {name: 藤, words: [藤, ふじ, フジ, 白藤, 大藤], match: [藤, フジ]}
  - {name: ニッコウキスゲ, words: [ニッコウキスゲ, 日光キスゲ, にっこうきすげ, ゼンテイカ, 禅庭花, キスゲ], match: [ニッコウキスゲ, キスゲ, ゼンテイカ]}
  - {name: スズラン, words: [スズラン, すずらん, 鈴蘭], match: [スズラン, すずらん, 鈴蘭]}
  - {name: アジサイ, words: [アジサイ, あじさい, 紫陽花], match: [アジサイ, あじさい, 紫陽花]}
  - {name: ヒガンバナ, words: [ヒガンバナ, 彼岸花, ひがんばな, 曼珠沙華, マンジュシャゲ], match: [ヒガンバナ, 彼岸花, 曼珠沙華]}
  - {name: 菜の花, words: [菜の花, なのはな, ナノハナ], match: [菜の花, ナノハナ, なのはな]}
  - {name: ひまわり, words: [ひまわり, ヒマワリ, 向日葵], match: [ひまわり, ヒマワリ, 向日葵]}
  - {name: 梅, words: [梅, うめ, ウメ, 梅林], match: [梅, ウメ]}
  - {name: 水仙, words: [水仙, スイセン, すいせん], match: [水仙, スイセン]}
  - {name: ロウバイ, words: [ロウバイ, 蝋梅, 蠟梅, 臘梅, ろうばい], match: [ロウバイ, 蝋梅, 蠟梅, 臘梅]}   # 臘梅: 段階80 の追記5(「長瀞宝登山臘梅園」)
  - {name: 河津桜, words: [河津桜, かわづ桜, カワヅザクラ], match: [河津桜, カワヅザクラ]}
  - {name: 冬桜, words: [冬桜, フユザクラ, 十月桜], match: [冬桜, フユザクラ, 十月桜]}
  - {name: 寒桜, words: [寒桜, カンザクラ, 寒緋桜, 寒桜], match: [寒桜, カンザクラ, 寒緋桜]}
  - {name: 桜, words: [桜, さくら, サクラ, ソメイヨシノ, 花見, お花見], match: [桜, サクラ, ソメイヨシノ], includes: [河津桜, 冬桜, 寒桜]}
  - {name: 芝桜, words: [芝桜, シバザクラ, しばざくら], match: [芝桜, シバザクラ]}
  - {name: ネモフィラ, words: [ネモフィラ], match: [ネモフィラ]}
  - {name: つつじ, words: [つつじ, ツツジ, 躑躅], match: [つつじ, ツツジ]}
  - {name: バラ, words: [バラ, ばら, 薔薇, ローズ], match: [バラ, ばら, 薔薇]}
  - {name: 花菖蒲, words: [花菖蒲, 菖蒲, ハナショウブ, あやめ, アヤメ], match: [花菖蒲, 菖蒲, ハナショウブ, アヤメ]}
  - {name: 蓮, words: [蓮, ハス, はす], match: [蓮, ハス]}
  - {name: コスモス, words: [コスモス, 秋桜], match: [コスモス]}
  - {name: カタクリ, words: [カタクリ, かたくり, 片栗], match: [カタクリ, かたくり]}
  # 段階79 第4部の追記: 質問の「福寿草」と、カードの「フクジュソウ」が結びつかなかった(資料の語りの材料が 0)
  - {name: 福寿草, words: [福寿草, フクジュソウ, ふくじゅそう], match: [福寿草, フクジュソウ]}
  - {name: セツブンソウ, words: [セツブンソウ, 節分草, せつぶんそう], match: [セツブンソウ, 節分草]}
  - {name: 菊, words: [菊, きく, キク, 菊花], match: [菊]}
  - {name: カワセミ, words: [カワセミ, 翡翠, かわせみ], match: [カワセミ]}
  - {name: ハクチョウ, words: [白鳥, ハクチョウ, はくちょう], match: [ハクチョウ, 白鳥]}
  - {name: ホタル, words: [ホタル, 蛍, ほたる], match: [ホタル, ゲンジボタル, ヘイケボタル, 蛍]}
  # 段階69 第5部: ススキ・草紅葉(秋)。「草原」だけの語は「草原の花」などの別の質問に当たるので、ススキの語と組になった形だけにした(Claude Code の判断)
  - {name: ススキ, words: [ススキ, すすき, 芒, ススキ草原, すすき草原, すすきの草原, ススキの草原], match: [ススキ, すすき, 芒]}
  - {name: 草紅葉, words: [草紅葉, くさもみじ, 草もみじ], match: [草紅葉, 草もみじ]}
  # 段階82 第3部 2: 種や花ではないテーマ(季節のない名所。例年の時期の代わりに「通年」)。まずは苔(テーマの一覧は data/ask/themes.yaml)
  - {name: 苔, words: [苔, コケ, こけ, 苔庭, 苔の庭], match: [苔, コケ]}

# 範囲: 出発地からの直線距離(名所の座標、なければ市区町村の代表点)。距離が分からない名所は、次の都県のものだけ入れる
# (都県の全域が横浜・東京から 250km 前後に収まる都県。Claude Code が都県の端の市町村の座標で概算: 長野県の栄村・南木曽町は横浜から約190km、
#  静岡県の湖西市は約210km。福島県の北端(新地町)は約270km、新潟県・北海道は範囲の外が多いので、座標で確かめられたものだけ)。provisional
unknown_distance_prefectures: [東京都, 神奈川県, 埼玉県, 千葉県, 茨城県, 栃木県, 群馬県, 山梨県, 長野県, 静岡県]
max_items: 8
# 段階67 第3部 8: 時期が分かる名所(max_items まで)のあとに出す、時期が分からない名所の件数
max_unknown_items: 5

text:
  lead: "{name}は、例年{start}〜{end}が目安です。"
  lead_one: "{name}は、例年{start}が目安です。"
  lead_birds: "{name}が見られる記録のある場所です。時期は場所ごとに書きました。"
  origin_line: "距離は{origin}からの直線距離です。"
  # 段階72 第6部 1: 出典が古い年の記載(記録の source_year)の例年の時期
  old_year_season: "{year}年の記載では、{season}"
  # 段階72 第6部 2: 1 年じゅうの窓(1/1〜12/31)
  season_peak: "{season}(数が多いのは{peak})"   # 段階81 第1部 2: 見られる期間と、数が多い時期を分けて書く
  peak_only: "数が多いのは{peak}(見られる期間の始まりは記載なし)"
  year_round: "通年（咲く花は季節で変わる）"
  species_heading: "{name}"
  off_season: "今は時期の外で、次は{month}月ごろです。"
  in_season: "今は例年の時期にあたります。今年の様子は、お出かけの前に公式ページで確かめてください。"
  none: "{name}の名所は、確かめられた記録がまだありません。"
  out_of_range: "{origin}から250km前後の範囲では見つかりませんでした。"
  region_none: "{region}では、{name}の名所の確かめられた記録がまだありません。"
  head: "**{name}**({where}){km}"
  km: " 約{km}km"
  typical: "・例年の時期: {text}({publisher})"
  typical_nopub: "・例年の時期: {text}(公式)"
  # 段階67 第1部 4: 発行元は名前(ドメインは出さない)。名前が分からなければ「紹介サイト。公式ではありません」
  # 段階69 第6部 2: 発行元の名前の前に区切りを入れる(「紹介サイト鎌倉市観光協会」にしない)
  typical_secondary: "・例年の時期: {text}(紹介サイト「{publisher}」。公式ではありません)"
  typical_secondary_nopub: "・例年の時期: {text}(紹介サイト。公式ではありません)"
  typical_unknown: "・例年の時期は分かりません"
  # 段階67 第3部 8: 公式ページに「毎年」と書かれた行事の期間は行事の行として(例年の見頃ではない。今年・来年の日付として書かない)
  annual_event: "・{name}は{text}({publisher})"
  # 鳥は「例年の見頃」でなく、見られる時期(段階58 の定型)
  bird_label: {例年の時期: 見られる時期}
  kinds: "・見どころ: {kinds}"
  care: "・行く前に: {care}"
  table_head: ["| 場所 | 例年の時期 | 距離 |", "|---|---|---|"]
  table_row: "| {name}({where}) | {season} | {km} |"
  confidence: "例年の時期は年によって前後します。今年の咲き具合や開花の時期は、お出かけの前に公式ページで確かめてください。"
  confidence_birds: "この時期に見られる鳥の目安で、今年の飛来・観察の記録ではありません。お出かけの前に公式ページで確かめてください。"
  # 段階69 第4部 2: ホタル・虫は「咲き具合」でなく発生や飛ぶ時期
  confidence_insects: "例年の時期は年によって前後します。今年の発生や飛ぶ時期は、お出かけの前に公式ページで確かめてください。"
  # 段階69 第5部: ススキ・草紅葉は「咲き具合」でなく穂の様子・色づき
  confidence_grass: "例年の時期は年によって前後します。今年の穂の様子や色づきは、お出かけの前に公式ページで確かめてください。"
  secondary_note: "紹介サイトの情報を含みます(公式ではありません)。"
  sources_heading: 出典
  thirds: {上旬: [1, 10], 中旬: [11, 20], 下旬: [21, 31]}
  table_words: [表, 一覧で, 比べ]
# 鳥・ホタルなど(「見頃」「咲き具合」と書かない種)
bird_species: [カワセミ, ハクチョウ]
# 段階69 第4部 2: ホタル・虫(「咲き具合」「開花」と書かない種)
insect_species: [ホタル]
# 段階69 第5部: ススキ・草紅葉(「咲き具合」「開花」と書かない種)
grass_species: [ススキ, 草紅葉]

# 段階64 第4部: 季節で絞った知識の質問(「冬から春にかけて見られる桜について教えて」)。最初に出た季節の語の種を先にする。
# 種は上の species の name(カードの場所の語と同じ)。Claude Code が、名所カタログ・ガイドのカタログの例年の時期の始まりから分けた。provisional
season_species:
  冬: [冬桜, 寒桜, 河津桜, 梅, 水仙, ロウバイ, 菜の花, ハクチョウ]
  春: [桜, 芝桜, ネモフィラ, 藤, つつじ, バラ, カタクリ]
  夏: [ニッコウキスゲ, スズラン, アジサイ, 花菖蒲, 蓮, ひまわり, ホタル]
  秋: [ヒガンバナ, コスモス, 菊, 冬桜, ススキ, 草紅葉]
# 季節の月(始まりの月から)。冬は 11 月から(冬桜が 11 月に咲く)
season_months: {冬: [11, 12, 1, 2], 春: [3, 4, 5], 夏: [6, 7, 8], 秋: [9, 10, 11]}
# 知識の答えの最後に付ける「いつ・どこで」の短い一覧(段階59 の型: いつ・どこ は最後に短く)
knowledge_tail:
  heading: いつ・どこで
  max_items: 5
  line: "- {name}({where}){km}: {season}({kind})"
  line_unknown: "- {name}({where}){km}: 例年の時期は分かりません({kind})"
# 段階64 第4部 4: 町の名前で聞く場所の質問(「神奈川県の松田で有名なところ」)。名所カタログ・ガイドのカタログの市区町村で引く
town:
  patterns: ["で有名な", "の有名な", "の見どころ", "の名所", "でおすすめの場所", "で見られるもの", "の見るところ", "で見るところ"]
  lead: "{town}で、名所の記録がある場所です。"
  none: "{town}の名所は、確かめられた記録がまだありません。"
  head: "**{name}**({where}){km}"
  line_kind: "・見どころ: {kinds}"
  line_season: "・例年の時期: {season}({kind})"
  max_items: 8
  # 市区町村の語の末尾(質問の「松田」を「松田町」に結びつける。2 字以上の語だけ)
  suffixes: [市, 町, 村, 区]
# 段階64 第4部 3: 答えの型(時期と場所・町の名前・知識)ごとの写真つきページ(ikimonobiyori/answer_page.py)。答えの本文と同じ内容だけ。
# 写真は種の代表写真(guide_photos のキャッシュにあるものだけ。通信しない)。手書きの HTML・図で代用しない
page:
  file: "answer-{kind}-{date}.html"
  routes: [season_place, town, knowledge, chat]
  title: {season_place: "{species}の名所と例年の時期", town: "{town}の名所", knowledge: "{species}について", chat: "{species}について"}
  title_fallback: "{question}"
  photo_heading: 写真
  photo_note: "写真は種の代表写真で、その場所で撮られたものではありません。"
  no_photo_names: "写真が取れなかった種: {names}"
  # 段階81 の追記(本人の判断 2026-11-12): 載せる種は 12 まで。上限(種の数・埋め込む写真の大きさ)で載せなかった種は、写真が取れなかった種と分けて 1 行で示す
  max_species: 12
  over_limit_names: "上限のため写真を載せなかった種: {names}"
  # 写真の説明(種の名前は見出し。撮影者・ライセンス・元のページ)。状態(開花など)は出さない(本人の判断 2026-11-12)
  photo_link: 写真のページ(iNaturalist)
  photo_link_commons: ファイルのページ(Wikimedia Commons)
  # 総称の種(種が一つに決まらない語)には代表の種・品種の写真を載せ、説明に何の写真かを必ず書く(本人の判断 2026-11-12)。
  # 代表の写真も、ライセンス・同定の決まりは今までどおり(guide_photos のキャッシュにあるものだけ)
  representative_caption: "写真は{label}"
  representatives:
    ツツジ: {name: ヤマツツジ, label: ヤマツツジ, reason: "日本の山野にもっとも普通な野生のツツジ。名所の多くの躑躅とは品種が違うことがある"}
    シャクナゲ: {name: アズマシャクナゲ, label: アズマシャクナゲ, reason: "関東・東北の山に自生するシャクナゲ"}
    バラ: {name: ノイバラ, label: ノイバラ(日本の野生のバラ), reason: "バラ園の園芸品種は種が決まらないので、日本の野生のバラの代表"}
    スイレン: {name: ヒツジグサ, label: ヒツジグサ(日本の在来のスイレン), reason: "日本に自生する唯一のスイレン属"}
    ヤエザクラ: {name: カンザン, label: 関山(八重桜の代表的な品種), reason: "八重桜の名所に多い里桜の品種"}
  footer: "写真提供: iNaturalist / Wikimedia Commons。"
  section_words: [いつ・どこで, 出典, 関連して, 行く前に確認すること]
  last_file: ask/last_answer.json
  valid_hours: 24
# 段階65 第2部: 平年の目安の語(「時期」「いつ」)があっても、場所を聞く語があれば「いつ・どこ」の答えにする(「梅の名所と時期を教えて」)
# 段階81 第2部: 新しい形(ガイド)の答えの写真つきページ(guide_answer_page.py)。材料は直前の ask verify の最終の文と資料だけ
guide_page:
  file: "guide-answer-{brief}-{date}.html"
  stop_headings: [出典, "[場所]"]          # この見出しより後ろ(出典など)では種の名前を探さない
  min_word_chars: 2                        # 文の中で探す種の名前の最短の字数(1 字の語は地名などに当たる)
  default_theme: 花
  subject_themes: {birds: 野鳥, flowers: 花, autumn_leaves: 紅葉}
  # 答えの文の書き方(漢字・ひらがな)→ 写真の対応表の和名。写真の対応表にない書き方だけ
  aliases: {河津桜: カワヅザクラ, 冬桜: フユザクラ, 十月桜: ジュウガツザクラ, 寒桜: カンザクラ, 寒緋桜: カンヒザクラ, 染井吉野: ソメイヨシノ, 山桜: ヤマザクラ, 八重桜: ヤエザクラ,
            梅: ウメ, 菜の花: ナノハナ, 水仙: スイセン, 蝋梅: ロウバイ, 臘梅: ロウバイ, 椿: ツバキ, 山茶花: サザンカ, 福寿草: フクジュソウ, 節分草: セツブンソウ,
            曼珠沙華: ヒガンバナ, ひまわり: ヒマワリ, イロハカエデ: イロハモミジ, 百日草: ヒャクニチソウ, 氷の花: シモバシラ(氷の花), チングルマの綿毛: チングルマ(綿毛), 片栗: カタクリ, 水芭蕉: ミズバショウ, 石蕗: ツワブキ, 芝桜: シバザクラ, 紫陽花: アジサイ, 藤: フジ, 彼岸花: ヒガンバナ, 秋桜: コスモス, 向日葵: ヒマワリ,
            花菖蒲: ハナショウブ, 薔薇: バラ, 蓮: ハス, 銀杏: イチョウ, 欅: ケヤキ, 唐松: カラマツ, 落葉松: カラマツ, 橅: ブナ, 満天星: ドウダンツツジ}
  # 文に種の名前がなく、名所の樹種も分からないとき(紅葉の答え)に載せる代表の種。花・野鳥は名前のない種を足さない
  subject_fallback: {autumn_leaves: [イロハモミジ, イチョウ]}
  alias_themes: {氷の花: 野草, チングルマの綿毛: 野草, 銀杏: 紅葉, 欅: 紅葉, 唐松: 紅葉, 落葉松: 紅葉, 橅: 紅葉, 満天星: 紅葉}
  # 段階81 の続き 5(本人の指示 2026-11-12): ページの題は資料から決める(質問の文そのままにしない。AI に書かせない)。
  # 部品: 場所(質問の文に出る候補の名所・名所の辞書の名前。なければ文頭の「○○で・の・には」の地名らしい語)・出発地(質問で言ったときだけ)・
  # 日付の語・テーマ(質問の文の語。なければ対象が 1 つのときの対象の語)・見どころの語。形は質問の型(資料の intent・route)で選ぶ
  title:
    date_words: [年末年始, 明後日, 今週末, 来週末, 今日, 明日, 週末, 連休, 今週, 来週, 今]   # 長い語から見る(「今週末」を「今」にしない)
    topic_words: [見どころ, おすすめ, 見頃, 見ごろ, 名所, 楽しみ方, 情報]
    default_topic: おすすめ
    # 質問の文に出るテーマの語(1 字の語も見る。このほか aliases の書き方と写真の対応表の和名(2 字以上)も見る)
    theme_words: [紅葉, 黄葉, 野鳥, 冬鳥, 渡り鳥, 白鳥, 猛禽類, 猛禽, カモ, 花, 桜, 梅, 菜の花, 水仙, ホタル, アジサイ, ススキ, 野草, 高山植物, 氷の花, 地形]
    # 場所もテーマの語もなく、対象が 1 つのとき
    subject_words: {birds: 野鳥, flowers: 花, autumn_leaves: 紅葉}
    # 文頭の地名らしい語(漢字・カタカナ 2〜8 字)と、その後ろの助詞。日付の語・テーマの語なら場所にしない
    lead_place_re: '^([一-龥々ァ-ヶー]{2,8}?)(?:には|で|の|に)'
    # 出発地(資料の origin_source がこの値のときだけ「○○から」を題に付ける)
    origin_sources: [question]
    origin_fmt: "{origin}から"
    # 「見られる」の質問は「<場所>で見られる<テーマ>」「今見られる<テーマ>」
    seen_words: [見られる, 見られ]
    seen_fmt: "見られる{theme}"
    # 質問の型ごとの形(intent か route)。{place}・{theme}・{themes}(質問に出たテーマの語を「と」でつないだもの)
    by_kind:
      difference: "{themes}の違い"
      knowledge: "{place_no}{theme}"            # 「霞ヶ浦の野鳥」(場所がなければテーマだけ)
      event: "{place_sp}{themes_dot}{event}"            # 「神奈川 野鳥・地形の観察会」
      season_place: "{place_sp}{theme}の名所と時期"
      place_time: "{place_sp}{theme}の名所と時期"
      normal: "{place_sp}{theme}の名所と時期"
    event_words: [観察会, イベント, まつり, 祭り, 行事]   # 行事の質問で、質問に出た語(なければ最後の語)
    max_chars: 24                          # これより長い題になったら質問の文(長い題は内容を表さない)
  # 段階81 の続き 1(本人の指示 2026-11-12): ページを頼まれたときの最後の文は、この決まった案内とページのリンクだけ
  # (答えの全文はページの中にあるので会話に出さない)。受け入れるのは、合格した最終の文からページを作ったときだけ
  reply:
    text: "「{title}」の写真つきページです。答えの内容と写真を、このページにまとめています。\n{url}"
    url_re: '^https://claude\.ai/(code/)?artifact/[A-Za-z0-9_-]+$'
    # 段階82 第4部 4.5: 利用者が写真を指摘したあと(外す → 取り直す → ページを作り直す)の最後の文。ask photo-reply が出す
    photo_fixed: "「{title}」のページの写真を直しました。{changes}\n{url}"
    photo_replaced: "{name}の写真を外し、別の写真に替えました。"
    photo_removed: "{name}の写真を外しました(ふさわしい写真が見つからなかったので、写真なしにしています)。"
    photo_kept: "{name}の写真は、見直したうえでそのままにしています。"
    last_file: logs/last_guide_page.json
    no_page: "直前に作った写真つきのページがありません(先に ask verify に合格した答えから ask page でページを作る)"
    bad_url: "--url は https://claude.ai/artifact/… の形のリンクだけです(省くとページのファイルの場所)"
over_normal_words: [名所, 場所, どこ, ところ, 地域]   # 段階78 第2部 2: 「地域と時期」
# 段階69 第3部: 質問の場所(市区町村・エリア)で名所を絞る。市区町村は「○○市で」「○○町の」の形(2 字以上)。エリアは data/ask/areas.yaml
place_filter:
  city_re: '([ぁ-んァ-ヶー一-龥]{2,6}?(?:市|町|村|区))(?:で|の|に|には|周辺|あたり|近く)'
  # その場所に名所の記録がないときの 1 文(調べても見つからないときも同じ文。「お答えできません」「調べることもできます」と書かない)
  none: "{place}の{name}は、公式の情報では確かめられませんでした。"
  others_heading: "ほかの場所の{name}の名所"
  max_other_items: 3
  # 調べる対象(ask answer の標準エラー「調べる:」。利用者向けの答えには出さない)の検索語
  search: "{place} {name} 公式"
  search_noplace: "{name} 名所 時期 公式"

# 段階69 第2部 3: 種と日付の質問(「今週末、カワセミを見たい」)。その種の名所から、その日に時期が合うものを先に、合わないものは「時期の外」と 1 行で。
# 野鳥は、公園の観察記録・施設の発信に、その種の名があれば日付つきで出す。種の語のほかに、これらの語(テーマの総称)が質問にあれば計画の型
dated:
  generic_words: [紅葉, 黄葉, 花, 野鳥, 鳥, 冬鳥, 渡り鳥, おすすめ, お出かけ]
  # 例年の時期の前後とみなす日数(docs の E「例年の時期は前後 7 日以内も候補」と同じ)
  near_days: 7
  # 観察の記録・施設の発信の古さの上限(日。承認済みの施設の発信と同じ 14 日)
  record_max_age_days: 14
  record_max_lines: 5
  title: "**{days}の{name}**"
  date_line: "対象の日は{days}です。"
  lead_in: "{name}は、{days}は例年の時期にあたる名所があります。今年の様子は、お出かけの前に公式ページで確かめてください。"
  lead_birds: "{name}が見られる記録のある場所です。時期は場所ごとに書きました。"
  lead_off: "{name}は、{days}は例年の時期の外です。次は{month}月ごろです。"
  off_line: "・時期の外: {items}"
  off_item: "{name}(例年{season})"
  records_heading: "## {name}の今年の観察の記録"
  record_line: "・{name}: {month}/{day}時点の観察の記録に{species}の名があります({publisher}。公式の発信)"
# 段階70 第1部: 秋のお出かけの答え(計画の型。「今週末に紅葉やススキ、そのほか秋を満喫」)に足す、ススキ・草紅葉の名所の節。
# 今年の穂の様子・色づきの記録はないので「今回のおすすめ」に入れず、この節に例年の時期の事実だけ(その日に時期が合う名所と、時期の外の 1 行)
# 質問にススキ・草紅葉の語がなくても、この語(秋のお出かけの言い方)があれば節を出す。対象の日が season の月(season_months)のときだけ。
# 質問に名前の出ていない種は、その日に例年の時期が合う名所があるときだけ書く(時期の外の 1 行は、名前の出た種だけ)
grass_tail:
  heading: "{names}の名所"
  autumn_words: [秋を満喫, 秋を楽しめ, 秋を楽しみ, 秋を感じ, 秋らしい, 秋のお出かけ, 秋の行楽]
  season: 秋
