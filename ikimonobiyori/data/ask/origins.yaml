# 段階57 第8部: 質問から取り出す出発地の座標の表(ikimonobiyori/origins.py)。座標は Wikidata の P625 を 2026-11-07 に読んだ値だけ(CC0)。推測で足さない。
# 市区町村の代表点は data/guide/places.yaml(Wikidata)にあるものも使う。表にない出発地は Wikidata で確かめて ask origin --add で手元のキャッシュに足す。
schema: ikimono-origins/1
default: 横浜
stop_words: [ここ, そこ, どこ, 今, いま, 今日, 明日, 来週, 今週, 今週末, 来週末, 週末, 朝, 昼, 夜, 午後, 午前, 自宅, 家, 近所, 近く, 早朝, 月, 日]
# 新しい出発地で、座標のない名所が同じ都道府県のとき使う距離の見積もり(data/ask/plan.yaml の estimate_km_by_prefecture と同じ値)
lines:
  named: "{origin}からの距離で選びました。"
  default: "{origin}からの距離で選びました。"
  # 段階74(本人の指示 2026-11-10): 「遠くても」の質問(answer_plan.scope_of が wide)では、距離で選ばず範囲全体から選ぶ
  wide: "範囲全体から選びました。"
  follow_up: "先ほどの{origin}のままです。"
  unknown: "{name}の位置を特定できませんでした。{origin}からの距離で選びます。"
