# 段階82 第1部(本人の判断 2026-11-12「すべてOK」): 質問の種の名前は、ひらがな・カタカナ・漢字のどれで書かれても同じ種として扱う。
# 認識した種の名前(カタカナ)に書き換えてから、資料・題・答えを作る(ikimonobiyori/species_alias.py)。
#
# 種の名前(カタカナ)の出どころ: 名所カタログ・ガイドのカタログの種の語、写真の対応表(野鳥)、野草の花期の表、
# 写真つきページの書き方の表(season_place.yaml の guide_page.aliases)の値、season_place.yaml の species の語。
# - カタカナの名前のひらがな表記は機械的に受け入れる(3 字以上だけ。2 字の語は地名や別の語の一部に当たりやすいので作らない)。
# - season_place.yaml の species の語(あじさい・ふじ・うめ など)にすでにある書き方は、その表のまま(書き換えない)。
schema: ikimono-species-alias/1
min_generated_hiragana_chars: 3          # 機械的に作るひらがなの書き方の最短の字数(2 字の「かも」「しめ」「しぎ」は別の語の一部に当たる)
# 機械的に作らないひらがな(紅葉の質問の「もみじ」をイロハモミジにしない など)
no_generate: [もみじ, いろはもみじ, かえで, こけ, つぐみ]
# 漢字の書き方 → 種の名前(カタカナ)。一般に使われる書き方で、確かなものだけ(Claude Code の判断 2026-11-12。迷うものは足さない:
# 「薄」は「薄い」、「皐月」は月の名前、「牡丹」はボタンが別の語、「鷹」「鷺」「鶴」は種ではなく仲間の総称なので足さない)。
# 種の名前が上の出どころにないものは使わない(コードが落とす)。
kanji:
  山茶花: サザンカ
  椿: ツバキ
  銀杏: イチョウ
  楓: カエデ
  石蕗: ツワブキ
  水芭蕉: ミズバショウ
  金木犀: キンモクセイ
  百日紅: サルスベリ
  沈丁花: ジンチョウゲ
  辛夷: コブシ
  木蓮: モクレン
  桔梗: キキョウ
  竜胆: リンドウ
  萩: ハギ
  女郎花: オミナエシ
  撫子: ナデシコ
  藤袴: フジバカマ
  菫: スミレ
  蒲公英: タンポポ
  芍薬: シャクヤク
  鶏頭: ケイトウ
  秋明菊: シュウメイギク
  満天星: ドウダンツツジ
  欅: ケヤキ
  唐松: カラマツ
  落葉松: カラマツ
  橅: ブナ
  梟: フクロウ
  鶯: ウグイス
  鴛鴦: オシドリ
  隼: ハヤブサ
  鶚: ミサゴ
  鵟: ノスリ
  小白鳥: コハクチョウ
  大白鳥: オオハクチョウ
  大鷹: オオタカ
  百合鴎: ユリカモメ
  雲雀: ヒバリ
  燕: ツバメ
  駒草: コマクサ
  稚児車: チングルマ
  箒草: コキア
  箒木: コキア
# 短い語(2 字のひらがな)の取り違えを防ぐ(既存の表の ふじ・うめ・はす・きく・ばら にも当てる)。
# 前後の字がひらがなで、助詞・句読点でないときは種の名前にしない(「ふじさん」「はすすき」)。次の形も種の名前にしない。
short_guard:
  max_chars: 2
  # カタカナの語で、すぐ後ろにカタカナが続くときは別の種の名前の一部(「コケモモ」「コケリンドウ」)。種の名前にしない
  katakana_prefix_words: [コケ]
  ok_neighbors: "のとやがはをもにでへかよねなけ、。,.!?！？ 　「」『』()（）・"
  exclude_re:
    - "ふじ(さん|みの|やま|の山|見|宮|吉田|川口湖|五湖)"
    - "(を|に|が|て|も)きく"
    - "きく(と|と、|ところ|けど|けれど|ので|なら)"
    - "うめ(だ|田)"
