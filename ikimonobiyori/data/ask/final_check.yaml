# 作業メモの見出し(この行から次の空行までを消す)
block_heads:
  - 作業メモ
  - 答えの外
  - (内部メモ)

# 提案・質問の語(この語を含む文を消す。offers.yaml の案内で、条件を満たしてコードが出したものだけは残す)
offer_words:
  - こともできます
  - どちらでも進められます
  - 進められます
  - やりますか
  - しましょうか
  - ご希望なら
  - ご希望があれば
  - よろしければ
  - お知らせください
  - 教えてください
