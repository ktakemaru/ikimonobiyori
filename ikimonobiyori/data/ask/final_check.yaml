# 段階69 第1部: 最終メッセージの検査(ikimonobiyori/final_check.py。`ask final-check`)。通信しない。
# エージェントが利用者に送る最終メッセージ全体(ask answer の出力と、前後に添えた文)から、送ってはいけない文をコードが消す。
# 消した文はデータ置き場の logs/answers.jsonl に残す(答えには出さない)。消したあと本文が空なら、ask answer の出力をそのまま返す。
schema: ikimono-final-check/1

