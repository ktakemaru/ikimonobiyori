# 質問に答える手順(段階37。ikimonobiyori/ask.py)と、自然な文章の答えの検査器(ikimonobiyori/ask_verify.py)の語と値。
# biyori-hub の concierge_skill/config.yaml の answer_check(段階H8〜H10)から生き物の部分を移した(指示書 docs/stage37-H11-instructions.md 2-1)。
# 値・語はここに置き、コードに持たない(CLAUDE.md 規則 1)。評価表は docs/ask-rubric.md。
schema: ikimono-ask-policy/1

# 対象を指定しない質問(「11/3のおすすめをおしえて」)で横断する、実装済みの対象(observations の対象)
default_subjects: [autumn_leaves, flowers, birds]
# 答えの冒頭で示す対象の範囲の呼び名(facts の scope_line)
scope_line: "{labels}のおすすめです(横浜などの出発地から行ける範囲)。"
default_origin: 横浜
# 地域の指定がない質問は、都道府県に縛らず登録済みの全範囲（出発地から片道250km前後。利用者の決定 2026-11-04）
default_region: 全範囲

# 書き込み先(IKIMONOBIYORI_DATA_DIR の下)。--out-dir を省いた prepare は、この下に日時のフォルダを作る
work_dir: ask

# 野鳥の iNaturalist の集計の取り直し(observations の inat_refresh。1 回の質問につき policy の上限まで)の宣言済みホスト。
# 実通信は計測フック(BIYORI_REQ_LOG)と BIYORI_ALLOW_LIVE=1 の下だけ(CLAUDE.md 規則 6)。このリポジトリ単独では取り直さない
inat_host: api.inaturalist.org

# 答えの最後の 1〜3 行(この回の記録で実際に新しい記録が増えたページの数と発行元だけから作る。段階H9)
fetch_lines:
  new: "{md} に {pubs} の {pages}ページを読み直し、新しい記録が {n}件増えました。"
  nothing_after_new: "{pubs} も読みに行きましたが、新しい情報は取れませんでした。"
  nothing: "{md} に {pubs} を読みに行きましたが、新しい情報は取れませんでした。"
  fresh: "記録が新しいため、今回は読み直していません。"
  none: "今回は新しく読み直していません。"
  failed: "読めなかったページ(ご自身で開いてください): "

answer_check:
  # 評価表 R10: 一つも出てはいけない言い方(答えを止める・利用者に実行や確認を頼む・作業の経過)
  forbidden_phrases: [材料がない, 材料がありません, 材料もありません, 情報がない, 情報がありません, おすすめを出せません, 使える期限を過ぎ,
                      更新は私からは始めません, 始めません, "! を付け", "!を付け", 実行してください, 承認してください, 集めた事実だけを並べます,
                      実行しますか, 読みますか, 確認しますか, よろしいですか,
                      # 段階H9(穴2): 作業の経過を答えに出さない
                      検査が通った, 検査に通った, 検査を通った, 検査を通し, 答えを出します, 答えをお出しします, その答えを出, 書き直しました,
                      # 段階H9(穴3): 古い記録を取りに行かずに答えたことの言い訳
                      調べ直さず, 読み直さず,
                      # 段階37(指示書 2-3): 単体の試用で出た作業の経過の文
                      あとは答えを書くだけ, 答えを書くだけ, 答えを書きます, 答えを書いて, 取りに行っていません, 取りに行きません, 記録しました, 記録します,
                      記録してから, 実行しました, 実行していません, 動かしました]
  # 段階37(指示書 2-3): 開発・作業の言葉(正規表現。「フォトコンテスト」「ドレスコード」のような語の一部は数えない)
  dev_terms: ["(?<!コン)テスト", "(?<![ドレスバー])コード", 作業メモ, 記録済み, スキル, コマンド, 検査, 実装, ゴールデン, 作業の経過, "(?<![A-Za-z])Python(?![A-Za-z])",
              # 段階39 B-2: コマンド名・設定の名前・作業の報告の言い方(全経路で答えに出さない)
              "guide find", record-candidate, policy.yaml, "ask verify", "ask record", "(?<![A-Za-z])ask(?![A-Za-z])", テーマの表, 提案として報告, コードは変更, final.txt, 作業フォルダ,
              # 括弧つきの作業の事情（「(コードは変更していないので、テストは実行していません。)」など）
              "[（(][^）)]*(変更していない|変更していません|実行していない|実行していません|テストは|検査は|検査を)[^）)]*[）)]"]
  # 内部用語(英字の語は前後が英字でないときだけ)
  internal_terms: [snapshot, スナップショット, status_log, proposal, band, max_age_h, pending, 台帳, observations, source_class, secondary,
                   fetch_notes, provisional, 作業フォルダ, materials, facts, verify, prepare, calls.json, plan.json, records.json, jsonl, IKIMONOBIYORI]
  # 段階39 B-1: facts を持たない経路の検査(generic_check)。検査・記録の事情を利用者に見せない。聞き返しだけの答えを落とす
  generic:
    process_phrases: [読みに行きました, 新しい情報は取れ, 検査に合格, 合格しました, テストは, 新しい記録が, 件増えました, 検査器, 通りませんでした, 通らなかった, 検査を実行, 記録を実行, 記録していません, 実行していません, 実行しました, 通らない文, 作業メモ]
    typos: [出どろ, 出ところ, 出どこら]                      # 出力の項目名の誤字(「出どころ」の抜け・書き間違い)
    candidate_markers: ['^\s*[①-⑩]', '^\s*\d+\.\s', '^\s*- \S']      # 候補の行(①②、1. 、- 名所)
    min_candidates: 3
    unanswerable_ok: [お答えできません]                    # 検索しても独立した出どころが 1 件も見つからないときだけ(理由と探した言葉を書く)
    ask_words: [ください, でしょうか, ですか, 教えて]
  # 状態の語(文中の名所の記録の状態にあること)
  state_words: [青葉, 色づき始め, 見頃過ぎ, 落葉, 見頃前, 満開, 分咲き, そろそろ見ごろ]
  # 「見頃です」のような、今の状態として見頃と言う書き方(記録が見頃の名所がないと落とす)
  peak_claims: ["(いま|今|現在)(が|は)?見頃(です|だ|。)", "見頃(です|でした|を迎え|になって|となって)", "見ごろ(です|でした|を迎え)"]
  now_peak_claim: "(いま|今|現在)(が|は)?見頃(です|だ|。)"
  # 段階63a 第3部: 「観察の記録がある」と「今そこで見られる」は別の主張。今の様子として「見られる」「来ている」と言う文は、
  # その文の名所に新しい(fresh)現況の記録があるときだけ(過去の記録・この時期の傾向だけでは言わない)
  now_visible_re: "(今|いま|現在|今日)(は|も|でも)?[^。]{0,16}(見られます|見られる|見ることができ|来ています|飛来しています|観察できます)"
  # 「3件」「4ページ」のような数え方は、この数以下なら通す
  small_count_max: 30
  counters: [件, ページ, か所, カ所, 箇所, つ, 回, 枚, 種]
  years_ok: [2025, 2026]
  min_place_len: 2
  # 段階54 第2部: 名所の短い呼び名にしない一般的な語（これだけでは同じ名所とみなさない）
  generic_name_words: [菊花展, 菊まつり, 菊祭, 菊, もみじまつり, 紅葉まつり, 紅葉祭, 紅葉, 黄葉, まつり, 祭, 祭り, フェスティバル, 公園, 庭園, 神社, 寺, 展, 花展, ライトアップ, 渓谷, 湖, 滝, 山, 秋, 花]
  # 評価表 R2・R11
  min_candidates: 3
  max_chars: 1500
  # 評価表 R4: 候補の段(①②…)に、この語のどれかがあること(例年の見頃。なければ昨年の記録)
  typical_words: [例年, 昨年]
  # 段階H10(利用者の決定 2026-11-01。評価表 R4 の読み方 (b))
  typical_unknown_phrases: [例年の時期は分かりません, 例年の見頃は分かりません, 例年の時期は分からない, 例年の見頃は分からない]
  typical_alt_words: [今年の行事, 今年は, 昨年, 去年, 前の年]
  # 段階H9(穴1): 「読み直しました」の言い方。この回の record で新しい記録が 0 件なら落とす。文は lines.fetch の決まった文だけ
  reread_words: [読み直しました, 読み直し、, 読み直しています, 調べ直しました, 新しく読みました]
  # 段階H9(穴2): 野鳥の候補の段には「例年の見頃」を書かず、「この時期」(この時期に見られる鳥)を書く
  birds_forbidden: [例年の見頃]
  birds_typical_words: [この時期]
  # 段階H9(穴2): 対象の日が休みの名所を書いたら、休みを言い切る文(施設名と「休み」を含む文)が要る
  closed_words: [休み, 休園, 休館]
  # 段階38(指示書 3-4): 同じ言い方を答えの中で繰り返さない(「公式ではない」は補足に1回まとめる。各行では出典名だけ)
  max_repeats: {公式ではない: 1}
  # 段階51(利用者の指示 2026-11-06。2026-11-06 の試用で見つかった答えの崩れ 5 点)。facts の lines.answer_rules が flag と同じときだけ当てる
  # （ask facts が付ける。手で作った古い形の facts には当てない）。作業の報告を答えに出さない・冒頭とおすすめの食い違い・iNaturalist の傾向の書き方・
  # 出典リストの漏れ・見込みの言い切り・公式の文の丸ごとの転載
  stage51:
    flag: stage51
    work_report_phrases: [読みに行きました, 読みに行きましたが, 読み直し, 新しい記録が, 件増えました, 新しい情報は取れ, 取れませんでした, 記録が新しいため, 今回は新しく読み直していません]
    lead_heading: 今回のおすすめ
    lead_pick_re: '^\s*(\d+[.．]|[①-⑩])'
    lead_kind_words: [庭園, 菊, バラ, コスモス, 野鳥, 冬鳥, 紅葉, 渓谷, 滝, 湖, 湿原, 高原]
    inat_word: iNaturalist
    inat_label: 公式ではありません
    inat_trend: 一年の平均
    inat_scope_words: [神奈川県, 県全体, 東京都, 半径]
    assertive_phrases: [見ごろに入る時期です, 見頃に入る時期です, 見ごろに入ります, 見頃に入ります, 見ごろを迎えます, 見頃を迎えます, 見ごろになります, 見頃になります, 必ず見られ, 間違いなく]
    quote_re: '「([^」]+)」'
    date_range_re: '\d{1,2}/\d{1,2}\s*[～〜~]\s*\d{1,2}/\d{1,2}\s*時点'
    reference_word: 参考
    festival_period_words: [主催者が設定した期間, まつり期間中, 開始, まつり]
    festival_state_words: [時点]
    festival_no_state: 色づき状況は確認できていません
    pick_hedge_phrases: [可能性があります, かもしれません, 見込みです]
    lead_assertive_phrases: [の週末です, 楽しめる週末, 真っ盛り, 見ごろです, 見頃です, 満喫できます, 間違いなく]
    lead_hedge_words: [可能性, そうです, かもしれません, 向かう, 見込み, 期待, できていない, できていません]
    practical_fallback: アクセスや混雑は出かける前に公式ページで確認してください
    stale_display:
      publishers: {value: [箱根町観光協会], source: "過去の確認(古い表示が残ることがある。指示書 段階52 第3部)", provisional: false}
      min_gap_days: {value: 3, source: "指示書 段階52 第3部(取得日と状態の日付が3日以上離れる)", provisional: false}
    max_quote_chars: {value: 20, source: "利用者の指示(2026-11-06): 公式の文を丸ごと転載せず、状態の見出し(「◎ 真っ盛り」など)は原文のまま、それ以外は短くまとめる。20 字は仮置き", provisional: true}
  # 段階57 第13部: 好み・優先・選択を尋ねる文(答えの末尾にも途中にも入れない)。「確認してください」のような案内は質問ではない
  ask_sentence_re: '(好み|優先|どちら|どれが|ご希望|教えてください|教えて下さい).*(ください|下さい|か[。?？]?$|[?？])|(ですか|ますか|でしょうか)[。?？]?\s*$|[?？]\s*$'
  # 段階57 第10部: 電話番号の形。取得した事実にある番号だけ書ける。出典の見出しは日本語
  extra_blocked_words: [日本気象協会]
  # 段階58 第10部: 記事の文を引用符で写さない。長い引用は 1 か所まで
  long_quote_min: {value: 15, source: "指示書 段階58 第10部 7。引用は 1 つの出典につき 1 か所、15 語未満", provisional: true}
  max_long_quotes: {value: 1, source: "同上", provisional: true}
  # 段階58 第10部: 対象と食い違う定型の語
  subject_wrong_words: {birds: [咲き具合, 色づき], flowers: [飛来], autumn_leaves: [飛来]}
  # 段階58 第4部: SNS の投稿は事実の根拠にも出典にも使わない(過去の投稿も含む)
  sns_hosts: [x.com, twitter.com, facebook.com, instagram.com, youtube.com, youtu.be, tiktok.com, threads.net]
  phone_re: '0\d{1,4}-\d{1,4}-\d{3,4}'
  english_sources_re: '^\s*[#*\s]*Sources?\s*[:：]?\s*$'
  # 段階57 第9部: 取得・記録・ツールの制約の説明(作業の事情)を答えに書かない。「ご希望なら調べます」型も出さない
  process_excuse_phrases: [今回は新しく取りに行っていません, 新しく取りに行っていません, この会話で読んだ情報だけ, 今日この会話で, としか扱えません, しか扱えません, ツールが, ご希望なら調べ, ご希望があれば調べ, 調べましょうか, 調べることもできます, お調べします,
                           # 段階58 第4部
                           簡易な読み取り, 出力を一字一句, 決まりなのに, コードの文面なので, リポジトリには手を入れていません, 出し直します,
                           このプロジェクトの方針で, 方針で使っていません, 検索結果にあった, 検索結果だけで, 外して検索, ファイルは変更せず, 触れていません, 使っていません,
                           # 段階64 第2部 1・2(本人の会話の試用 2026-11-08): 末尾・途中の提案と、作業の事情
                           よければ、そうします, よければそうします, 読んでよければ, 一覧にし直せます, 記録することもできます, 探して記録, 探して、記録, 調べ直します, 調べ直せます,
                           記録しました, 検索で集め, 検索の結果をもとに, 検索結果をもとに, 検索の要約, 一般的な案内を返し, ask answer, 仮(検索, 仮（検索]
  # 段階57 第4部: 語にしていない状態の記号(語が続かないもの)を答えに出さない
  bare_symbol_re: '[✕×△〇◯○◎▼](?![ 　]?[ぁ-んァ-ヶ一-龠])'
  # 段階38(指示書 3-4): 利用者への返事の全文(答えの本文の外に付け足した文も)の検査。作業・開発の説明を落とす
  reply_terms: [検査に合格, 合格しました, 合格です, テストは, 新しい記録が, 件増えました, 今回の作業, 作業で実行, 実行したこと, リポジトリ, 追跡ファイル, 保存先, 単体テスト, "(?<![A-Za-z])git(?![A-Za-z])", 変更していない, 変更していません, 書き込み先, 手順を]
  # 段階62 第1部(会話の試用 2026-11-08。「台帳ってなに?」と聞き返された): 内部用語・作業の事情の語(正規表現)。
  # 答えの本文と、出典以外の文で、出たら不合格(internal_word)。URL と、見出し「出典」の行より後ろは数えない。
  # 範囲の限界は利用者の語で書く(scope_limit_lines)。英字の語は前後が英字でないときだけ(大文字小文字を区別しない)。
  internal_words:
    - 台帳
    - 承認済み
    - 承認待ち
    - 検査
    - 不合格
    - "(?<!不)合格"
    - 行事用
    - 骨組み
    - "(答えの|回答の|おすすめの)計画"
    - "計画(どおり|のとおり|に沿って|を作り|を作っ|を更新|に入っ|に入れ|にない|にあり|から外)"
    - "記録(を読|から作|済み|に入っ|に入れ|にあり|にあった|にない)"
    - コマンド
    - スキル
    - リポジトリ
    - データ置き場
    - "(?<![A-Za-z])(ask|plan|verify|skeleton|knowledge|catalog)(?![A-Za-z])"
    - "(この|内部の|今回の)決まり"
    - "決まり(で|により|なので|に従って|のため|上)"
    - "(答え|回答|文章)は[^。]*を通して(い|お|あ)"
    # 段階64 第2部 2: 作業の事情の語
    - カタログ
    - "記録(に|には)[^。]*(ない|ありません|ありませんでした|見つかりません)"
  # 段階64 第2部 4: 古い一覧の形の語。ガイドのページ・guide find の表示では使う語なので、ask answer の答えでだけ、その文を消す(answer_gates)
  answer_old_list_words: [定評, 出どころの区分, 参照数]
  # 段階62 第1部 2: 範囲の限界の文(利用者の語)。「台帳に入っていない」「承認済みの台帳」と書かない
  scope_limit_lines:
    events_other: ほかの施設の観察会は、確認できていません。
    events_none: 確認できている公式ページの範囲では、{when}の観察会・行事は見つかりませんでした。
    place_not_covered: "{name}の今の様子は、確認できている公式ページの範囲にありません。"

# 段階38(利用者の決定 2026-11-01。指示書 2-1): 単体で iNaturalist を取りに行くときの小さな上限(ikimonobiyori/netbudget.py)。
# 1 回の実行の上限は observations の inat_refresh.max_requests_per_question(集計)と guide の photos.max_requests_per_run(写真)。
# 同じホストへの間隔は observations の fetch_limits.same_host_interval_s 以上。記録は IKIMONOBIYORI_DATA_DIR の下の netlog/requests.jsonl
net:
  page_photos_commons_max_species: {value: 3, source: "仮置き(Commons は間隔が長いので、1 回の質問で探す種を少なくする)", provisional: true}

# 段階57 第11部: 公式の機械可読データの取り込み(ikimonobiyori/official_csv.py)
official_csv:
  yamanashi:
    prefecture: 山梨県
    publisher: やまなし観光推進機構(山梨県公式観光情報)
    label: "山梨県観光サイト{md}更新"
    spot_map: {御岳昇仙峡: kouyou-0011, もみじ回廊: kouyou-0012}      # 名所カタログに同じ場所があるスポット

# 段階57 第2部: 直前の答え(計画)から作る、紅葉・花・野鳥・総合の写真つきページ(ikimonobiyori/plan_page.py)
plan_page:
  file: "plan-{date}.html"
  max_embed_bytes: {value: 2000000, source: "指示書 段階57 3-2。ページ全体は 2MB の目安。超える新しい写真は載せず名前だけの行に回す", provisional: true}
  max_species_per_spot: {value: 4, source: "仮置き(段階57)。1 地点に載せる種の数", provisional: true}
  # カタログの一般的な呼び名 → 写真の表の和名(代表の種)。表にない呼び名は写真なし
  photo_aliases: {モミジ: イロハモミジ, 秋バラ: バラ, 菊: キク, 冬桜: フユザクラ, 十月桜: ジュウガツザクラ, ドウダンツツジ: ドウダンツツジ}
  skip_names: [カエデ, 紅葉, 黄葉, 草紅葉]
  csp: "default-src 'none'; img-src data:; style-src 'unsafe-inline'"
  reply_line: "写真つきのページ: {path}"
  text:
    title: "{dates} {labels}のおすすめ"
    title_region: "{dates} {region}の{labels}のおすすめ"            # 段階62 第2部: 題名に地域・日付・テーマ(ページが複数でも区別できる)
    conclusion: "{dates}のおすすめは、{names}です。"
    picks_heading: 今回のおすすめ
    subject_labels: {autumn_leaves: 紅葉, flowers: 花, birds: 野鳥}
    origin: "出発地: {origin}"
    photo_note: "写真は種の代表写真で、その場所で撮られたものではありません。"
    current: "今の状況: {state}({md}時点、{publisher})"
    current_nodate: "今の状況: {state}({publisher})"
    no_current: 今年の状況は確認できていません。
    practical: "実用情報: {text}"
    sources: "出典:"
    no_photo_names: "写真が取れなかった種: {names}"
    names_sep: "・"
    footer: "写真提供: iNaturalist / Wikimedia Commons。"

# 段階38(指示書 3-3): 公園ごとに見られる鳥の写真つきページ(ikimonobiyori/park_page.py)。置き場所は IKIMONOBIYORI_DATA_DIR の下の guide/pages/
park_page:
  file: "birds-parks-{date}.html"
  max_embed_bytes: {value: 2000000, source: "ユーザー指示(段階39 A-6)。ページに埋め込む写真の合計（base64 後）の目安。超える新しい写真は載せず名前だけの行に回す（縮小・再圧縮はしない）", provisional: true}
  conclusion_max: {value: 3, source: "仮置き(段階39 A-7)。結論の 1 文に並べる公園の数", provisional: true}
  old_record_years: {value: 10, source: "ユーザー指示(段階39 A-7)。この年数以上前の記録は根拠に使わない", provisional: false}
  rare_max_count: {value: 2, source: "仮置き(段階39 A-7)。公園の範囲の記録の件数がこれ未満で、かつ rare_max_lift 未満の鳥は『記録が少ない鳥』としておすすめの鳥に入れない（2026-11-03 の実測: 公園ごとの件数は 1〜5）", provisional: true}
  rare_max_lift: {value: 1.2, source: "仮置き(段階39 A-7)。observations の park_birds.seasonality.lift_min と同じ値。この時期らしい鳥（これ以上）は件数が少なくても『まれ』にしない", provisional: true}
  answer_parse:                                          # 段階39 A-7: 答えの文章から結論・順位・避ける場所・確かさの補足を取り出す
    rank_re: '^[①-⑩]\s*(.+)$'
    avoid_title: 避けたほうがよい場所
    confidence_title: 確かさの補足
    section_heads: [おすすめ]
  aliases: {リュウキュウサンショウクイ: サンショウクイ}      # 亜種・別名は種に丸める（段階39 A-7。指示書 F7: 神奈川では想定しにくい亜種名）
  max_parks: {value: 5, source: "表示の件数の設計値(答えのおすすめ3件以上を含む)", provisional: false}
  csp: "default-src 'none'; img-src data:; style-src 'unsafe-inline'"
  # 利用者への返事に添えるページの場所の 1 行(verify --reply はこの 1 行だけを検査から外す)
  reply_line: "写真つきのページ: {path}"
  text:
    title: "{dates} 公園で見られる鳥"
    origin: "出発地: {origin}"
    photo_note: "写真は種の代表写真で、その公園で撮られたものではありません。"
    recent: "最近の記録: 「{text}」({publisher}、{md})"
    recent_nodate: "最近の記録: 「{text}」({publisher})"
    older: "以前の記録: 「{text}」({publisher}、{year}年{md})"
    hours: "開園: {text}"
    park_link: "公園のページ: "
    no_photo: 写真なし
    conclusion: "{dates}のおすすめは、{names}です。"
    conclusion_sep: "・"
    nophoto_names: "写真が取れなかった鳥: {names}"
    rare_names: "この時期の記録が少ない鳥: {names}"
    names_sep: "、"
    avoid_heading: 避けたほうがよい場所
    avoid_old: "{name}: 最新の記録が{year}年と古く、今の様子は分かりません。"
    credit: "写真: {author}・{license}"
    photo_link: 写真のページ(iNaturalist)
    photo_link_commons: ファイルのページ(Wikimedia Commons)
    source: "{kind}・{when}・{publisher}"
    source_nodate: "{kind}・{publisher}"
    care_heading: 観察のマナー
    confidence_heading: 確かさの補足
    footer: "写真提供: iNaturalist / Wikimedia Commons。鳥の記録: 公園の観察の記録と iNaturalist の過去の記録。"

# 段階62 第1部 5: 利用者向けの情報源の一覧(ikimonobiyori/source_list.py。`ask sources`)。答えに使っているものだけを数える。
# 「台帳にはどのくらいの登録があるの?」はこれで答える。確認中の件数は、利用者が「承認」について聞いたときだけ(--review)。内部用語を書かない。
source_list:
  kinds: [centers, autumn_leaves, flowers, birds, wintering_birds, events, knowledge, normals]
  max_names: {value: 3, source: "表示の設計値(代表的な名称を3つまで。残りは「ほか○件」)", provisional: true}
  heading: イキモノビヨリが答えに使っている情報源です。
  labels:
    centers: 施設の発信(ビジターセンターなど)
    autumn_leaves: 今の様子を読む公式ページ(紅葉)
    flowers: 今の様子を読む公式ページ(花)
    birds: 今の様子を読む公式ページ(野鳥)
    wintering_birds: 今の様子を読む公式ページ(冬鳥)
    events: 行事・観察会の公式ページ
    knowledge: ネイチャーガイドの知識(出典つきの短いまとめ)
    normals: 気象庁の平年の目安(標本木などの観測)
  units: {default: 件, centers: か所, events: か所, knowledge: 枚}
  line_named: "- {label}: {n}{unit}({names}{more})"
  line_count: "- {label}: {n}{unit}"
  line_normals: "- {label}: {n}項目({stations}地点)"
  more: "など"
  names_sep: 、
  note: どれも、公開されている公式ページや資料から、日付と出どころが分かる事実だけを使っています。
  review_heading: 使ってよいか確認している情報源(まだ答えには使っていません)
  review_line: "- {label}: {n}{unit}"
  review_note: 確認が済むまでは、答えに出しません。
  # 段階62 第1部 4: 利用者が「台帳ってなに?」「承認って?」と聞いたときの説明(利用者の語。内部の用語を繰り返さない)。`ask sources --explain <語>`
  explain:
    台帳: イキモノビヨリが使ってよいと決めた公式ページや施設の一覧のことです。ページごとに、発行元・使ってよい範囲・確かめた日を控えています。
    承認: その一覧に入れて答えに使ってよいか、利用規約や発行元を確かめたうえで、利用者ご本人が決めることです。確かめている途中のものは、答えに出しません。
