# 段階65 第4部: 「見どころ」の型(日付のない、場所の質問)。ikimonobiyori/highlights.py が読む。
# 「<場所>の見どころ」「<場所>ってどんなところ」「<場所>で何が見られる」。日付の語があれば、これまでの計画の型。
schema: ikimono-highlights/1
patterns: ["見どころ", "見所", "みどころ", "ってどんなところ", "はどんなところ", "ってどんな所", "で何が見られる", "で何を見られる", "では何が見られる", "で見られるもの"]
# 日付・計画の語があれば計画の型(段階65 第4部 1)
date_words: ["今日", "明日", "あした", "今週", "来週", "週末", "土曜", "日曜", "連休", "今度の", "月\\d+日", "\\d+/\\d+", "\\d+月\\d+日", "今月", "来月", "おすすめ"]
# 山(data/sites.yaml の地点)の名前で聞かれたとき、地点の座標から名所を集める半径(km)。
# 理由: 山麓の名所(筑波山神社など)は山頂から数 km にある。隣の町の名所(石割山から富士吉田の名所など)まで広げないための目安(provisional。段階66 で 10 → 5)
site_radius_km: 5
# 知識カード(ガイドの目)の最大の枚数(指示書 第4部 2: 最大5枚。分類の偏りなく)
max_cards: 5
# 季節ごとの見どころの、季節あたりの名所の最大数
max_spots_per_season: 6
# 今の季節に関係する現況の最大行数(指示書 第4部 2: 1〜2行。主役にしない)と、使う現況の古さの上限(日。承認済みの施設の発信と同じ 14 日)
max_current_lines: 2
current_max_age_days: 14
seasons:
  - {name: 春, months: [3, 4, 5]}
  - {name: 夏, months: [6, 7, 8]}
  - {name: 秋, months: [9, 10, 11]}
  - {name: 冬, months: [12, 1, 2]}
# 冒頭に使うカードの分類の優先(自然の特徴を表すもの)
lead_categories: [季節の仕組み, 地形・地質・火山, 見頃の流れ, 種の解説, 痕跡・暮らし, 名前・歴史・文化, 夜・天気・自然現象]   # 段階66: 行き方・歩き方は冒頭(自然の特徴)にしない
# 段階66: 名所の名前だけで当たったカードのうち、出さない分類(場所が種の名前のカード)
spot_only_skip_categories: [種の解説]
# 段階67 第4部 1: 月の書かれたカード(「荒山は5月中旬のツツジ」)から季節の節の行を作る。対象の分類と、花・紅葉の名前にしない語
card_season_categories: [見頃の流れ, シーズンの目安, 季節の仕組み]
card_season_not_names: [カール, ロープウェイ, ビジターセンター, センター, コース, ルート, ゴンドラ, リフト, ケーブル, ケーブルカー, バス, トイレ, キャンプ, スキー, ハイキング, ピーク, シーズン, ホテル, バスターミナル, ターミナル, バス停, ヒュッテ, ロッジ, テント, トンネル, ゲート, ルーペ, ポケット, ガイド, ツアー, イベント]
card_season_extra_names: [紅葉, 黄葉, 草紅葉]
card_season_max_per_season: 4
# 段階67 第4部 2: 「施設」の分類のカードは施設の欄、「行き方・歩き方」は「行く前に・歩き方」の欄
facility_categories: [施設]
walk_categories: [行き方・歩き方]
# 段階67 第4部 3: 冒頭の自然の特徴は、その山・エリア全体のカード(カードの場所が質問の場所かエリアの名前)を先に
kind_labels: {autumn_leaves: 紅葉, birds: 野鳥}
# 段階69 第2部 2: 場所の質問で、ほかの場所と一緒に書かれた都県の名前(「神奈川 大山」の神奈川)は、場所にしない(絞り込みの語)
drop_region_names_with_other_places: true
# 段階69 第2部 2: 「その日の見込み」で、例年の時期の前後とみなす日数(例年の時期の前後 7 日。docs の E「例年の時期は前後 7 日以内も候補」と同じ)
outlook_near_days: 7
# (段階69 第2部の mountain_suffixes は、エリア + 日付も見どころの型にしたため使わなくなった。地域全体だけの質問は計画の型)
# 「その日の見込み」の最大行数
outlook_max_lines: 6
text:
  title: "**{place}の見どころ**"
  lead: "{place}の自然: {facts}。"
  lead_none: "{place}について、確かめられたことをまとめました。"
  season_heading: "## 季節ごとの見どころ"
  season_sub: "### {season}"
  season_line: "・{name}: {kind}(例年 {window}){note}"
  secondary_note: "。紹介サイトの記載で、公式ではありません"
  event_line: "・{name}: {event} {start}〜{end}({year}年)"
  eye_heading: "## ガイドの目"
  before_heading: "## 行く前に確認すること"
  walk_heading: "## 行く前に・歩き方"
  card_season_line: "・{where}{names}(例年{when}、{source})"
  card_season_where: "{where}: "
  # 段階72 第2部 5: 同じ名前の別のもの(names.yaml の homonyms)のカードの季節の行
  sense_season_line: "・{name}({when}、{source})"
  facility_heading: "## 施設"
  facility_line: "・{name}"
  now_heading: "## 今の時期"
  now_line: "・{name}: {state}({month}/{day}時点、{publisher})"
  sources_heading: "出典"
  none: "{place}の見どころは、確かめられた記録がまだありません。"
  # 段階69 第2部 2: 日付のある場所の質問(「今週末、高尾山の見どころ」)。見どころのあとに「その日の見込み」
  title_dated: "**{place}の見どころと{days}の見込み**"
  outlook_heading: "## {days}の見込み"
  outlook_window_in: "・{name}: {kind}は例年{window}で、{days}は例年の時期に入ります"
  outlook_window_near: "・{name}: {kind}は例年{window}で、{days}は例年の時期の前後です"
  outlook_event: "・{name}: {event}の期間中です({start}〜{end})"
  outlook_none: "・{days}の今年の様子は、確認できている公式ページの範囲ではまだ分かりません。"
  outlook_note: "見込みは例年の時期と今年の記録からの目安で、言い切れません。お出かけの前に公式ページで確かめてください。"
