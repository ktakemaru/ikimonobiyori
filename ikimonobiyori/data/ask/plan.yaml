# 段階56: 答えの「計画」(ask plan。ikimonobiyori/answer_plan.py)の方針。点数の重み・区分・語はここに置く(CLAUDE.md 規則 1)。
# 値はすべて暫定(provisional: true)。出典のある値ではなく、2026-11-07 の試用(来週末の紅葉)で選び方が人の判断に依存していたため、
# 選び方を再現できる式にするための初期値。変えるときは docs/stage56-report.md の点数の式を更新する。
schema: ikimonobiyori-answer-plan/1
provisional: true

# 対象日に対する見込みの区分(最も重い要素)。facts の relation(例年の窓と現況から observations.py が出す)と現況の段から決める
outlook:
  # 区分 → 点数。順位の並べ替えには rank を使う(大きいほど見込みが高い)
  points: {in_peak: 40, toward: 34, late: 22, early: 8, unknown: 12, past: 0}
  rank: {in_peak: 4, toward: 3, late: 2, unknown: 1, early: 0, past: -1}
  labels: {in_peak: 見頃中の見込み, toward: 見頃に向かう見込み, late: 終盤の見込み, early: 見頃はまだ先の見込み, unknown: 見込みは不明, past: 見頃を過ぎている見込み}
  # 言い切りにならない定型(検査の now_peak_claim に触れない)。unknown は見込みを書かない
  phrases:
    in_peak: 見頃が続いている可能性があります
    toward: 見頃に向かう可能性があります
    late: 終盤の可能性があります
    early: 見頃はまだ先の可能性があります
    past: 見頃を過ぎている可能性が高いです
    unknown: null
  # 見込みの区分と食い違う言い回し(その名所を書いた文に、これらの語があれば不合格。段階56 第4部: 見頃の終了日を過ぎた名所に「終盤の可能性」と書かない)
  conflicts:
    past: [終盤の可能性, 見頃が続, 見頃に向かう, 見ごろに向かう, 見頃を迎え, 楽しめる可能性]
    early: [終盤の可能性, 見頃が続, 見頃を過ぎ]
    late: [見頃に向かう, 見ごろに向かう, 見頃を過ぎている可能性が高い]
  # 現況がなく、例年の窓だけが根拠のとき(「続いている」と言わない)
  phrases_typical_only:
    in_peak: 例年の見頃の時期にあたります
    toward: 例年の見頃が近づく時期です
    late: 例年の見頃の終わりに近い時期です
  # 例年の見頃の終わりまでこの日数以内なら「終盤」
  late_days: 7
  # 例年の窓がなく、現況の「見頃」だけが根拠のとき、その日付から対象日までこの日数を超えたら見込みは「不明」(古い現況で先の週を言わない)
  state_only_max_gap_days: 14
  # 例年の見頃の始まりまでこの日数以内なら「向かう」、それより先は「まだ先」
  toward_days: 14

# 現況の新しさ(現況の日付から今日までの日数)
freshness:
  by_age_days: [[3, 15], [7, 10], [14, 5]]
  older: 2
  undated: 3
  no_current: 0

# 距離の点数 = weight × max(0, 1 − 距離 / ref_km)。狙いによって重みを変える
distance:
  near: {weight: 20, ref_km: 80}
  drive: {weight: 10, ref_km: 150}
  trek: {weight: 10, ref_km: 150}
  night: {weight: 12, ref_km: 100}
  far: {weight: 4, ref_km: 250}
  other: {weight: 0, ref_km: 250}
  # 座標がない名所の距離の見積もり(都道府県の単位。見積もりであることを plan に残す)。ない都道府県は距離の点を付けず、距離の狙いに入れない
  estimate_km_by_prefecture: {神奈川県: 40, 東京都: 40}
  # 段階57 第8部: 上の見積もりは横浜・東京から。ほかの出発地では、同じ都道府県の名所だけ same_prefecture_km を見積もりに使う
  estimate_origins: [横浜, 東京]
  same_prefecture_km: 40

bonus:
  festival_active: 6       # 対象日がまつり・行事の期間内(現況の代わりにはしない)
  lightup_active: 6        # 対象日がライトアップの期間内
  practical: 2             # 読めた公式の実用情報がある
  source_official: 3       # 現況の出どころが公式
  source_secondary: 2      # 現況の出どころが紹介サイトなど(公式でないことを理由に落とさない)

# 狙い(節)。priority の順に最初に当てはまるものを、その名所の狙いにする
aims:
  order: [near, drive, trek, far, night]       # 節を並べる順
  labels: {near: 近場で手軽に, drive: ドライブ・足を延ばして, trek: 歩いて楽しむ, far: 絶景・遠出, night: 夜・ライトアップ}
  near_max_km: 50
  far_min_km: 100
  # 歩く・山歩き: 標高(座標つきの名所)か名前
  trek_min_elevation_m: 600
  trek_name_re: "(山|岳|峠|尾根)(\\(.*\\))?$|^丹沢|山頂"
  # 夜・ライトアップ: 対象日にライトアップがあり、現況の見込みが次のとき(現況が取れている名所は、その名所の狙いの節に入れる)
  night_outlooks: [unknown, early]
  section_max: 3
  min_sections_for_headings: 2
  # 日帰りの上限(これより遠い名所は計画に入れない)
  day_trip_max_km: 180

# 段階57 第12部: 同じ見込みの区分の中での根拠の強さ。今年の現況がある(日付が新しいほど上)→ 現況が古い → 例年の窓だけ(現況なし)の順。区分そのものの優先は変えない
evidence:
  fresh_max_age_days: 14
  # 現況のない候補を今回のおすすめに入れるとき、その候補に書く文(検査器が確かめる)
  no_current_note: 今年の状況は確認できていません
  # 現況がなく例年の窓だけが根拠の候補は、並びの区分をこの順位までにする(高尾山のように、現況のある「見頃に向かう」候補より前に出さない)
  typical_only_rank_cap: 3
  note_ok_words: [確認できていません]

# 段階58 第3部: 今年の情報(現況・行事)がない候補は大きく減点し、今回のおすすめの対象から外す(別枠に 1 行ずつ)
this_year:
  penalty: 30
  max_lines: 3
  line: "{name}: {typical}(今年の情報は確認できていません)"
  line_no_typical: "{name}: 今年の情報は確認できていません"

selection:
  picks: 3
  # 利用できるなら、今回のおすすめのうちこの件数は今年の現況がある候補にする
  min_with_current: 2
  # 今回のおすすめは、まずこの狙いの各1位から(あれば)選び、足りなければほかの節の1位、節の2位以降の順
  pick_aims: [near, trek, far]
  # 節に入れる点数の下限。下回る名所は「現況なし」「現況が古い」で外す
  min_score: 25

# 不採用の理由コード(内部用。答えには出さない)
reasons:
  past_expected: 過ぎている見込み
  too_far: 距離が遠い(狙いに合わない)
  no_current: 現況なし
  stale_current: 現況が古い
  same_aim_has_better: 同じ狙いに上位がある
  same_area: 重複(同じ地域)
  duplicate_spot: 重複(同じ名所)
  pending_source_only: 承認待ちの情報源のみ
  out_of_range: 範囲外
  closed_that_day: 対象日が休み
  no_aim: 狙いが決まらない(距離が分からない)
  refine_excluded: 追質問の条件に合わない
  no_this_year: 今年の情報がない

# 段階57 第4部: 野鳥で、公式の観察の記録がない公園の扱い(大きく減点し、選ぶときは明記する)
birds_no_current:
  penalty: 15
  note: 公式の最近の観察記録は確認できていません

# 段階57 第5部: 追質問(「もっと近場で」「山歩きで」など)で計画を選び直す語 → 残す狙い。同日の記録と計画だけで選び直す(通信しない)
refine:
  words:
    近場: {aims: [near]}
    近く: {aims: [near]}
    手軽: {aims: [near]}
    山歩き: {aims: [trek]}
    歩き: {aims: [trek]}
    遠出: {aims: [far, drive]}
    絶景: {aims: [far]}
    ドライブ: {aims: [drive]}
    ライトアップ: {lightup: true}
    夜: {lightup: true}
  # 近場で該当がないときは、距離の分かる候補を近い順にこの件数だけ残す
  nearest_fallback: 3

# 段階58 第9部: 答えの骨組み(ikimonobiyori/skeleton.py)の決まり文
skeleton:
  picks_heading: 今回のおすすめ
  confidence_heading: 確かさの補足
  before_heading: 行く前に確認すること
  no_this_year_heading: 今年の情報が確認できていない候補
  sources_heading: 出典
  lead_ok: 見頃が続いている可能性がある場所を選びました。
  lead_toward: 見頃に向かう可能性がある場所を選びました。
  lead_mixed: 現況が確認できている場所と、できていない場所があります。
  lead_none: この条件で今年の情報が確認できた候補はありません。
  area_none: "{name}は、今年の情報が確認できていません。"
  lead_no_current: 今年の状況は確認できていません。例年の時期とまつりの日程から選びました。
  dates: "対象の日は{days}です。"
  dates_default: "日付の指定がなかったので、{days}で探しました。"
  current: "今の状況は{state}({md}時点、{publisher})"
  current_nodate: "今の状況は{state}({publisher})"
  secondary: "紹介サイトでは{state}とされています({md}時点、{publisher}。公式ではありません)"
  secondary_nodate: "紹介サイトでは{state}とされています({publisher}。公式ではありません)"
  reference: "{md}時点の参考: {state}({publisher})"
  no_current: 今年の状況は確認できていません
  no_current_fest: 色づき状況は確認できていません
  typical_unknown: 例年の時期は分かりません
  birds: "この時期に見られる鳥は{names}です"
  birds_unknown: この時期に見られる鳥の記録は見つかっていません
  max_birds: 5
  not_official: 公式ではありません
  inat_scope: 公園そのものでなく周辺の半径の範囲の傾向です
  few: "この地域で今年の情報が確認できた候補は{n}件です。"
  secondary_note: 紹介サイトの情報は公式の発表ではありません。

# 段階58 第5部: 会話の比較表(ikimonobiyori/compare.py)。履歴はデータ置き場
compare:
  file: ask/plan_history.json
  max_plans: 5
  valid_hours: 24
  min_plans: 2
  headers: [場所, 今の状況と日付, 例年の見頃, 対象日の見込み]
  no_current: 確認できていません
  no_typical: 例年の時期は分かりません
  sources_heading: 出典

# 段階58 第2部: 公式ページの読み方(ikimonobiyori/official_pages.py)
official_pages:
  suffixes: [.lg.jp, .go.jp, .pref.kanagawa.jp, .metro.tokyo.lg.jp]
  host_words: [kankou, kanko, -kanko, tourism, visitor, park, koen, park.or.jp]
  excluded_hosts: [koyo.walkerplus.com, walkerplus.com, rurubu.jp, jorudan.co.jp, iko-yo.net, enjoytokyo.jp]
  follow_words: [お知らせ, 紅葉情報, 紅葉, イベント, 開園, 開館, 休園, 休館, 新着, 最新]
  notice_words: [開園日, 開館日, 変更, 閉鎖, 通行止め, 規制, 休園, 休館, 工事]
  max_pages: 6
  notice_line: "{name}: {text}({md}時点の公式のお知らせ)"
  not_tried_phrases: [中身は読めていません, 公式ページを確認できていません]
  not_read_phrase: 公式ページを確認できていません

# 段階58 第1部: エリアの質問。各エリアのおすすめの件数(指示書 第9部: 各エリア 1〜2 件)
areas:
  picks_per_area: 2

# 段階57 第10部: 場所を指定した質問(ikimonobiyori/place_answer.py)
place:
  tail_re: '(の(紅葉|もみじ|黄葉|花|桜|野鳥|鳥|見頃|見ごろ|状況|様子).*|(は|って)(どう|どんな|いつ|いかが|教えて).*)$'
  head_re: '^(今週末|来週末|明日|今日|今)[、の]?'
  split_re: '[やと、・,]'
  stop_words: [紅葉, 花, 野鳥, 鳥, おすすめ]
  min_partial_chars: 3
  max_pages: 8
  public_suffixes: [.lg.jp, .go.jp, .pref.kanagawa.jp, .metro.tokyo.lg.jp, .yamanashi-kankou.jp, .or.jp]
  forecast_reprint_words: [全国予測, 紅葉予想, 紅葉予測, 見頃予想, foliage forecast, autumn leaves forecast, 日本気象協会, Japan Weather Association, tenki.jp]
  search_query: "{name} 紅葉 {year} 公式"
  lines:
    official: "{name}(正式名称は{name}です)"
    current: "今年の現況: {state}({md}時点、{publisher})"
    current_nodate: "今年の現況: {state}({publisher})"
    no_current: 今年の現況は確認できていません。
    practical: "実用情報: {text}"
    distance: "{origin}から約{km}km"

# 段階57 第9部: 期間別の節の見出し(この形の行で節を始める)
period_heading: "{days}のおすすめ"

# 段階57 第9部: 答えの前の事前取得(ask refresh --plan)。計画の上位候補のうち、現況が対象日よりこの日数以上古いもの・現況がないものを読む
refresh:
  stale_days: 3
  max_pages: 8

# 段階57 第3部: 複数の対象の答えの節の見出し(この語だけの行を対象の節の始まりとして検査する)
segment_headings: {autumn_leaves: 紅葉, flowers: 花, birds: 野鳥}

# 段階57 第2部: 直前の答えの計画の保存(ask page・追質問が引き継ぐ。IKIMONOBIYORI_DATA_DIR の下)
last_plan:
  file: ask/last_plan.json
  valid_hours: 24

# 同じ名所の別の書き方をまとめる(頭の地域名を取る)
duplicate:
  strip_prefixes: [箱根, 丹沢, 奥日光]
