# 段階56: 答えの「計画」(ask plan。ikimonobiyori/answer_plan.py)の方針。点数の重み・区分・語はここに置く(CLAUDE.md 規則 1)。
# 値はすべて暫定(provisional: true)。出典のある値ではなく、2026-11-07 の試用(来週末の紅葉)で選び方が人の判断に依存していたため、
# 選び方を再現できる式にするための初期値。変えるときは docs/stage56-report.md の点数の式を更新する。
schema: ikimonobiyori-answer-plan/1
provisional: true

# 対象日に対する見込みの区分(最も重い要素)。facts の relation(例年の窓と現況から observations.py が出す)と現況の段から決める
outlook:
  # 区分 → 点数。順位の並べ替えには rank を使う(大きいほど見込みが高い)
  points: {in_peak: 40, toward: 34, late: 22, early: 8, unknown: 12, past: 0}
  rank: {in_peak: 4, toward: 3, late: 2, unknown: 1, early: 0, past: -1}
  labels: {in_peak: 見頃中の見込み, toward: 見頃に向かう見込み, late: 終盤の見込み, early: 見頃はまだ先の見込み, unknown: 見込みは不明, past: 見頃を過ぎている見込み}
  # 言い切りにならない定型(検査の now_peak_claim に触れない)。unknown は見込みを書かない
  # 段階62 第4部: 例年の時期を過ぎていても、公式の新しい現況(対象日の after_window_max_gap_days 日以内。新しさの区分「新しい」の3日と同じ)が次の状態なら、「過ぎている見込み」にしない
  # (山梨県の CSV で 11/6「色づき始め」の道の駅富士吉田周辺が、例年の時期 10月上旬〜下旬を過ぎたため外れていた)
  after_window_current: {色づき始め: toward, 見頃前: toward, 見頃: late}
  after_window_max_gap_days: 3
  phrases:
    in_peak: 見頃が続いている可能性があります
    toward: 見頃に向かう可能性があります
    late: 終盤の可能性があります
    early: 見頃はまだ先の可能性があります
    past: 見頃を過ぎている可能性が高いです
    unknown: null
  # 見込みの区分と食い違う言い回し(その名所を書いた文に、これらの語があれば不合格。段階56 第4部: 見頃の終了日を過ぎた名所に「終盤の可能性」と書かない)
  conflicts:
    past: [終盤の可能性, 見頃が続, 見頃に向かう, 見ごろに向かう, 見頃を迎え, 楽しめる可能性]
    early: [終盤の可能性, 見頃が続, 見頃を過ぎ]
    late: [見頃に向かう, 見ごろに向かう, 見頃を過ぎている可能性が高い]
  # 現況がなく、例年の窓だけが根拠のとき(「続いている」と言わない)
  phrases_typical_only:
    in_peak: 例年の見頃の時期にあたります
    toward: 例年の見頃が近づく時期です
    late: 例年の見頃の終わりに近い時期です
  # 例年の見頃の終わりまでこの日数以内なら「終盤」
  late_days: 7
  # 例年の窓がなく、現況の「見頃」だけが根拠のとき、その日付から対象日までこの日数を超えたら見込みは「不明」(古い現況で先の週を言わない)
  state_only_max_gap_days: 14
  # 例年の見頃の始まりまでこの日数以内なら「向かう」、それより先は「まだ先」
  toward_days: 14

# 現況の新しさ(現況の日付から今日までの日数)
freshness:
  by_age_days: [[3, 15], [7, 10], [14, 5]]
  older: 2
  undated: 3
  no_current: 0

# 距離の点数 = weight × max(0, 1 − 距離 / ref_km)。狙いによって重みを変える
distance:
  near: {weight: 20, ref_km: 80}
  drive: {weight: 10, ref_km: 150}
  trek: {weight: 10, ref_km: 150}
  night: {weight: 12, ref_km: 100}
  far: {weight: 4, ref_km: 250}
  other: {weight: 0, ref_km: 250}
  # 座標がない名所の距離の見積もり(都道府県の単位。見積もりであることを plan に残す)。ない都道府県は距離の点を付けず、距離の狙いに入れない
  estimate_km_by_prefecture: {神奈川県: 40, 東京都: 40}
  # 段階57 第8部: 上の見積もりは横浜・東京から。ほかの出発地では、同じ都道府県の名所だけ same_prefecture_km を見積もりに使う
  estimate_origins: [横浜, 東京]
  same_prefecture_km: 40

bonus:
  festival_active: 6       # 対象日がまつり・行事の期間内(現況の代わりにはしない)
  lightup_active: 6        # 対象日がライトアップの期間内
  practical: 2             # 読めた公式の実用情報がある
  source_official: 3       # 現況の出どころが公式
  source_secondary: 2      # 現況の出どころが紹介サイトなど(公式でないことを理由に落とさない)

# 狙い(節)。priority の順に最初に当てはまるものを、その名所の狙いにする
aims:
  order: [near, drive, trek, far, night]       # 節を並べる順
  labels: {near: 近場で手軽に, drive: ドライブ・足を延ばして, trek: 歩いて楽しむ, far: 絶景・遠出, night: 夜・ライトアップ}
  near_max_km: 50
  # 段階60 第3部: 近場の節の並び。distance は、見込みの区分が同じなら出発地に近い順(現況の有無・点数より距離を優先)
  near_sort: distance
  # 段階64 第1部(段階63 第7部 A+B。本人の判断 2026-11-08): 近場の節では、見込みの区分が同じなら、今年の現況がある候補を先にする(その中で近い順)。
  # 現況のない候補(例年の窓だけ)が、現況のある近場(長瀞など)を節から押し出さないため
  near_current_first: true
  far_min_km: 100
  # 歩く・山歩き: 標高(座標つきの名所)か名前
  trek_min_elevation_m: 600
  trek_name_re: "(山|岳|峠|尾根)(\\(.*\\))?$|^丹沢|山頂"
  # 段階62 第3部: 地点の種類(登山・山岳 / 公園・庭園・湖畔・施設)。登山・山岳の地点は「近場で手軽に」に入れず「歩いて楽しむ」にする。
  # 公園・庭園・湖畔・施設の地点は、標高だけで「歩いて楽しむ」にしない(河口湖のような湖畔は標高が高くても手軽)。
  # 種類は、名所の spot_kind(カタログ・名所の一覧で確認できたもの)か、登山地点(data/sites.yaml の kind: mountain の 76 地点)の名前との一致で決める
  spot_kinds: {mountain: 登山・山岳, park: 公園・庭園・湖畔・施設}
  name_strip_re: "[(（][^)）]*[)）]"
  # 夜・ライトアップ: 対象日にライトアップがあり、現況の見込みが次のとき(現況が取れている名所は、その名所の狙いの節に入れる)
  night_outlooks: [unknown, early]
  section_max: 3
  min_sections_for_headings: 2
  # 日帰りの上限(これより遠い名所は計画に入れない)
  day_trip_max_km: 180

# 段階57 第12部: 同じ見込みの区分の中での根拠の強さ。今年の現況がある(日付が新しいほど上)→ 現況が古い → 例年の窓だけ(現況なし)の順。区分そのものの優先は変えない
evidence:
  fresh_max_age_days: 14
  # 段階62 第3部: 対象日の old_record_days 日以上前の現況は、今回のおすすめの上位に置かない。置くときは「○日前の記録です」と書き、見込みは弱い言い方にする
  old_record_days: 3
  old_record_note: "{n}日前の記録です"
  old_record_phrases: {in_peak: 終盤の可能性があります, toward: 見頃に入っている可能性があります, late: 終盤の可能性があります}
  # 現況のない候補を今回のおすすめに入れるとき、その候補に書く文(検査器が確かめる)
  no_current_note: 今年の状況は確認できていません
  # 現況がなく例年の窓だけが根拠の候補は、並びの区分をこの順位までにする(高尾山のように、現況のある「見頃に向かう」候補より前に出さない)
  typical_only_rank_cap: 3
  note_ok_words: [確認できていません, 紹介サイトでは]

# 段階58 第3部: 今年の情報(現況・行事)がない候補は大きく減点し、今回のおすすめの対象から外す(別枠に 1 行ずつ)
this_year:
  penalty: 30
  max_lines: 3
  line: "{name}: {typical}(今年の情報は確認できていません)"
  line_no_typical: "{name}: 今年の情報は確認できていません"

selection:
  picks: 3
  # 利用できるなら、今回のおすすめのうちこの件数は今年の現況がある候補にする
  min_with_current: 2
  # 今回のおすすめは、まずこの狙いの各1位から(あれば)選び、足りなければほかの節の1位、節の2位以降の順
  # 段階64 第1部(段階63 第7部 A。本人の判断 2026-11-08): 「ドライブ・足を延ばして」も各1位から選ぶ
  pick_aims: [near, drive, trek, far]
  # 段階60 第3部: 近場の節に候補があるとき、今回のおすすめに入れる出発地から near_max_km 以内の候補の件数
  # 段階64 第1部(段階63 第7部 B): 入れるのは今年の現況がある近場の候補だけ(現況のない近場で、現況のある候補を押し出さない)
  min_near: 1
  min_near_requires_current: true
  # 段階64 第1部: 「遠出」以外の狙いで、出発地からこの距離より遠い候補は、今年の現況がなければ今回のおすすめに入れない(遠い候補で埋めない。節の中には残る)。
  # 理由: 大宮からの質問で、現況のない小田原(83km)が花の1位になった(本人の試用 2026-11-08)。80km は「ドライブ」の帯(50〜100km)の中ほど。provisional
  fill_max_km: 80
  # 段階67 第3部 7: 野鳥は、今年の公式の記録(現況)がない候補を、出発地から near_max_km(50km)より遠いところで今回のおすすめに入れない
  # (大宮から横浜自然観察の森 67km より、近い候補を優先する。provisional。遠出の節は対象外)
  birds_fill_max_km: 50
  # 段階64 第1部: 近場(near_max_km 以内)で今年の情報(現況・行事)がある候補は、点数がこの値以上なら節に入れる(min_score より低くてよい)。
  # 理由: 出発地が横浜以外のとき、近場の公園(北本自然観察公園など)は公式の観察の記録が少なく、減点で節から外れていた。provisional
  near_this_year_min_score: 10
  # 節に入れる点数の下限。下回る名所は「現況なし」「現況が古い」で外す
  min_score: 25

# 不採用の理由コード(内部用。答えには出さない)
reasons:
  past_expected: 過ぎている見込み
  too_far: 距離が遠い(狙いに合わない)
  no_current: 現況なし
  stale_current: 現況が古い
  same_aim_has_better: 同じ狙いに上位がある
  same_area: 重複(同じ地域)
  duplicate_spot: 重複(同じ名所)
  pending_source_only: 承認待ちの情報源のみ
  out_of_range: 範囲外
  closed_that_day: 対象日が休み
  no_aim: 狙いが決まらない(距離が分からない)
  refine_excluded: 追質問の条件に合わない
  no_this_year: 今年の情報がない

# 段階57 第4部: 野鳥で、公式の観察の記録がない公園の扱い(大きく減点し、選ぶときは明記する)
birds_no_current:
  penalty: 15
  note: 公式の最近の観察記録は確認できていません

# 段階57 第5部: 追質問(「もっと近場で」「山歩きで」など)で計画を選び直す語 → 残す狙い。同日の記録と計画だけで選び直す(通信しない)
refine:
  words:
    近場: {aims: [near]}
    近く: {aims: [near]}
    手軽: {aims: [near]}
    山歩き: {aims: [trek]}
    歩き: {aims: [trek]}
    遠出: {aims: [far, drive]}
    絶景: {aims: [far]}
    ドライブ: {aims: [drive]}
    ライトアップ: {lightup: true}
    夜: {lightup: true}
  # 近場で該当がないときは、距離の分かる候補を近い順にこの件数だけ残す
  nearest_fallback: 3

# 段階58 第9部: 答えの骨組み(ikimonobiyori/skeleton.py)の決まり文
skeleton:
  picks_heading: 今回のおすすめ
  # 段階69 第4部 3: 段階を語で読めない公式の日付つきの記載は原文と日付で書く。ただし、この語を含む記載(状態が書かれていない)は書かない
  unknown_skip_words: [記載なし, 記載がない, 情報なし, 状況の記載, 開花状況の記載, 状態の記載, 状態不明]
  confidence_heading: 確かさの補足
  before_heading: 行く前に確認すること
  # 段階65 第6部 2: 地域を指定した質問で、公式の現況が見頃過ぎ・終わりの名所(facts の avoid)を別の欄に事実だけ書く(最大 avoid_max_lines 行)
  avoid_heading: 避けたほうがよい場所
  avoid_line: "・{name}: {state}({md}時点、{publisher})"
  avoid_max_lines: 5
  no_this_year_heading: 今年の情報が確認できていない候補
  sources_heading: 出典
  lead_ok: 見頃が続いている可能性がある場所を選びました。
  lead_toward: 見頃に向かう可能性がある場所を選びました。
  lead_mixed: 現況が確認できている場所と、できていない場所があります。
  lead_none: この条件で今年の情報が確認できた候補はありません。
  area_none: "{name}は、今年の情報が確認できていません。"
  lead_no_current: 今年の状況は確認できていません。例年の時期とまつりの日程から選びました。
  dates: "対象の日は{days}です。"
  dates_default: "日付の指定がなかったので、{days}で探しました。"
  current: "今の状況は{state}({md}時点、{publisher})"
  current_nodate: "今の状況は{state}({publisher})"
  secondary: "紹介サイトでは{state}とされています({md}時点、{publisher}。公式ではありません)"
  secondary_nodate: "紹介サイトでは{state}とされています({publisher}。公式ではありません)"
  reference: "{md}時点の参考: {state}({publisher})"
  no_current: 今年の状況は確認できていません
  no_current_fest: 色づき状況は確認できていません
  typical_unknown: 例年の時期は分かりません
  birds: "この時期に見られる鳥は{names}です"
  birds_unknown: この時期に見られる鳥の記録は見つかっていません
  max_birds: 5
  not_official: 公式ではありません
  inat_scope: 公園そのものでなく周辺の半径の範囲の傾向です
  few: "この地域で今年の情報が確認できた候補は{n}件です。"
  # 段階62 第2部: 複数の都県の指定(「東京か神奈川で」)の、地域ごとの行。候補がない地域も 1 行書く
  region_part: "{name}の候補は、{names}です。"
  region_part_few: "{name}で今年の情報が確認できた候補は{n}件です。"
  region_names_sep: 、
  secondary_note: 紹介サイトの情報は公式の発表ではありません。
  # 段階63(第4部 1)・63a 第9部: まつり・行事の期間を確かめた日(取得日)。7 日以内は読み直さずに出す。それより古いときも、取得日を書いて出す
  festival_checked: "まつり・行事の期間は、{md}に主催者の公式ページで確かめたものです。"
  festival_checked_old: "まつり・行事の期間は、{md}に確かめたもの({days}日前)です。最新の日程は主催者の公式ページで確かめてください。"
  festival_checked_max_days: 7
  # 段階60 第8部: 承認済み施設の発信(facts の visitor_centers)を、どの名所の答えに添えるか(施設 id → 地域の語)。名所の名前・市区町村・地域に語が含まれれば添える
  visitor_center_places:
    hakone-vc: [箱根]
    takao-vc: [高尾山, 八王子市]
    mitake-vc: [御岳山, 御岳渓谷]
    hadano-vc: [秦野, 丹沢, 大山]
    nishitanzawa-vc: [西丹沢, 山北町]
    yokohama-shizen-kansatsu: [横浜自然観察の森]
    kitamoto-shizen-gakushu: [北本]
    sayama-ikimono-fureai: [狭山丘陵]
    nikko-yumoto-vc: [奥日光, 湯ノ湖, 戦場ヶ原, 小田代原]
    nikko-shizen-hakubutsukan: [奥日光, 中禅寺湖, 戦場ヶ原]
    nasu-heisei-no-mori: [那須]
    yatsuhigata-nature-center: [谷津干潟]

# 段階58 第10部: 複数テーマの組み合わせ(ikimonobiyori/combo.py)
combo:
  max_km: 20
  max_pairs: 5
  none_line: "同じ場所、または近く(約{km}km以内)では確認できていません。"
  same_line: "{name}: 同じ場所で楽しめます。"
  near_line: "{a}と{b}: 約{km}km。"
  # 段階69 第2部 4: 「AとBが見られる場所」の質問の答え(ask answer の組み合わせの経路)。質問の語 → 対象(複数の対象をまとめる語もある)
  topic_words:
    紅葉: [autumn_leaves]
    黄葉: [autumn_leaves]
    冬の渡り鳥: [birds, wintering_birds]
    渡り鳥: [birds, wintering_birds]
    冬鳥: [birds, wintering_birds]
    白鳥: [wintering_birds]
    野鳥: [birds]
    花: [flowers]
  # 組み合わせの質問の言い方(場所を聞く語)と、2 つのテーマをつなぐ語
  patterns: [場所, ところ, 所, どこ, スポット, 名所]
  joins: [と, や, も]
  title: "**{a}と{b}を楽しめる場所**"
  title_dated: "**{days}に{a}と{b}を楽しめる場所**"
  lead: "同じ場所、または近く(約{km}km以内)で両方を楽しめる組み合わせです。距離は直線の目安です。"
  window_line: "  {name}の{kind}は例年{window}({publisher})"
  separate_lead: "同じ場所や近くでは確認できていません。それぞれの名所です。"
  separate_head: "{label}"
  separate_line: "・{name}{km}"
  separate_max: 3
  confidence: "例年の時期は年によって前後します。今年の色づきや飛来・観察の記録は、お出かけの前に公式ページで確かめてください。"

# 段階58 第9部: 日付の既定。計画段階の語で日付の指定がなければ、今週末と来週末の両方。出力の dates に使う
dates_default:
  plan_words: [探しています, 探してる, 行きたい, 計画, 考えています]
  date_words: [今日, 明日, 明後日, 今週末, 来週末, 今週, 来週, 週末]
  # 段階61 第6部: 1 文字の「月」「日」「/」は日光・休日・月曜などにも当たり、日付のない「探しています」型の質問で期間が出なかった。
  # 日付の書き方は正規表現で見る(数字つきの月・日・M/D・曜日・旬)
  date_patterns: ['\d{1,2}\s*月', '\d{1,2}\s*日', '\d{1,2}\s*/\s*\d{1,2}', '[月火水木金土日]曜', '(上|中|下)旬', '\d{4}-\d{1,2}-\d{1,2}']
first_check_file: ask/first_check.jsonl

# 段階58 第7部: 見頃を狙う週(例年の見頃の窓のまん中に近い週末)。確認できた例年の見頃だけから計算する
target_week:
  line: "見頃を狙うなら{s}〜{e}の週末が目安です(例年の見頃({publisher}{label})から。今年の現況は分かりません)"   # publisher は「名前、」か空(段階67)
  class_official: 公式
  class_secondary: 公式ではありません

# 段階58 第5部: 会話の比較表(ikimonobiyori/compare.py)。履歴はデータ置き場
compare:
  file: ask/plan_history.json
  max_plans: 5
  valid_hours: 24
  min_plans: 2
  headers: [場所, 今の状況と日付, 例年の見頃, 対象日の見込み]
  no_current: 確認できていません
  no_typical: 例年の時期は分かりません
  sources_heading: 出典

# 段階58 第2部: 公式ページの読み方(ikimonobiyori/official_pages.py)
official_pages:
  suffixes: [.lg.jp, .go.jp, .pref.kanagawa.jp, .metro.tokyo.lg.jp]
  host_words: [kankou, kanko, -kanko, tourism, visitor, park, koen, park.or.jp]
  excluded_hosts: [koyo.walkerplus.com, walkerplus.com, rurubu.jp, jorudan.co.jp, iko-yo.net, enjoytokyo.jp]
  follow_words: [お知らせ, 紅葉情報, 紅葉, イベント, 開園, 開館, 休園, 休館, 新着, 最新]
  notice_words: [開園日, 開館日, 変更, 閉鎖, 通行止め, 規制, 休園, 休館, 工事]
  max_pages: 6
  notice_line: "{name}: {text}({md}時点の公式のお知らせ)"
  not_tried_phrases: [中身は読めていません, 公式ページを確認できていません]
  not_read_phrase: 公式ページを確認できていません

# 段階58 第1部: エリアの質問。各エリアのおすすめの件数(指示書 第9部: 各エリア 1〜2 件)
areas:
  picks_per_area: 2

# 段階57 第10部: 場所を指定した質問(ikimonobiyori/place_answer.py)
place:
  tail_re: '(の(紅葉|もみじ|黄葉|花|桜|野鳥|鳥|見頃|見ごろ|状況|様子).*|(は|って)(どう|どんな|いつ|いかが|教えて).*)$'
  head_re: '^(今週末|来週末|明日|今日|今)[、の]?'
  split_re: '[やと、・,]'
  stop_words: [紅葉, 花, 野鳥, 鳥, おすすめ]
  min_partial_chars: 3
  max_pages: 8
  public_suffixes: [.lg.jp, .go.jp, .pref.kanagawa.jp, .metro.tokyo.lg.jp, .yamanashi-kankou.jp, .or.jp]
  forecast_reprint_words: [全国予測, 紅葉予想, 紅葉予測, 見頃予想, foliage forecast, autumn leaves forecast, 日本気象協会, Japan Weather Association, tenki.jp]
  search_query: "{name} 紅葉 {year} 公式"
  lines:
    official: "{name}(正式名称は{name}です)"
    current: "今年の現況: {state}({md}時点、{publisher})"
    current_nodate: "今年の現況: {state}({publisher})"
    no_current: 今年の現況は確認できていません。
    practical: "実用情報: {text}"
    distance: "{origin}から約{km}km"

# 段階57 第9部: 期間別の節の見出し(この形の行で節を始める)
period_heading: "{days}のおすすめ"

# 段階57 第9部・段階63b 第2部: 答えの前の事前取得(ask refresh --plan・ask answer)。
# 今回のおすすめの候補のうち、現況の記録を最後に読んでから有効期間(page_cache.ttl_hours)を過ぎたもの・現況の記録がないものの、
# 有効期間の中で読んでいないページを読む(ページに書かれた日付では決めない。紹介サイトのページと、読むページのない候補は対象にしない)。
# 段階63b(本人の指示 2026-11-08): 1 回の質問で読むページは 8 → 3。超えた分は、記録を日付つきで使う。
refresh:
  max_pages: 3

# 段階63b 第2部: 取得のキャッシュ(データ置き場の cache/pages.jsonl。本文は保存しない)と、情報源の種類ごとの有効期間(時間)
page_cache:
  file: cache/pages.jsonl
  ttl_hours:
    status: {value: 24, reason: "紅葉・花の現況ページ。公式の更新は週1〜2回が多い(段階63b の指示書の初期値)"}
    birds: {value: 24, reason: "野鳥の観察記録(東京港野鳥公園など)。毎日〜数日ごとの更新(同上)"}
    visitor_center: {value: 48, reason: "施設の発信(ビジターセンター)。週1回程度の更新が多い(同上)"}
    event: {value: 168, reason: "まつり・行事・観察会。期間は変わりにくい(同上。7日)"}
    practical: {value: 720, reason: "開園時間・アクセスなどの実用情報。ほとんど変わらない(同上。30日)"}
  # 名所カタログ・知識カード・気象庁の平年は、質問のたびには読まない(取得の対象にしない)

# 段階57 第3部: 複数の対象の答えの節の見出し(この語だけの行を対象の節の始まりとして検査する)
segment_headings: {autumn_leaves: 紅葉, flowers: 花, birds: 野鳥}

# 段階57 第2部: 直前の答えの計画の保存(ask page・追質問が引き継ぐ。IKIMONOBIYORI_DATA_DIR の下)
last_plan:
  file: ask/last_plan.json
  valid_hours: 24

# 同じ名所の別の書き方をまとめる(頭の地域名を取る)
duplicate:
  strip_prefixes: [箱根, 丹沢, 奥日光]

# 段階60 第2部: 骨組み → 文章の整え(エージェント)→ 検査 → 事実の一致検査(ikimonobiyori/polish.py。ask polish-check)
polish:
  max_rewrites: 1                      # 整えなおしは 1 回まで(指示書 第2部 4)。通らなければ骨組みのまま出す
  min_name_chars: 2                    # 名前の照合に使う最短の字数
  sources_heading: 出典
  # 段階61 第6部 (a): 整えた文章の各文が、骨組みのどの事実に対応するか。文の字の 2 字組のうち、骨組みにある 2 字組の割合がこれ未満で、
  # 骨組みの事実(名前・日付・数値など)も含まない文は「対応のない文」として不合格。値は仮置き(provisional。試用で見直す)
  sentence_min_overlap: 0.5
  connector_max_chars: 8               # この字数以下の文(つなぎの言葉だけの短い文)は対象外。仮置き
  # 段階61 第6部 (b): 比較・最上級・断定・因果・時期の要注意語。骨組みに同じ語がなければ不合格
  caution_words: [いちばん, 一番, もっとも, 最も, 必ず, 絶対, 間違いなく, ベスト, 最高, 定番, の季節に, ので, だから, ため, おかげで, に違いない]
  # 骨組みにあれば、整えた文章にも残す語(確かさの補足。言い切りを強めない)
  required_words: [公式ではありません, 確認できていません, 時点の参考, 可能性]
  kinds: {url: URL, date: 日付, weekday: 曜日, time: 時刻, km: 距離, month: 月, year: 年, number: 数値, name: 名前, current_date: 現況の日付, phrase: 見込みの言い回し, certainty: 確かさの補足, source: 出典}
  messages:
    added: "骨組みにない{kind}があります: {items}"
    unmapped: "骨組みのどの事実にも対応しない文があります: {items}"
    caution: "骨組みにない言い方(比較・断定・因果・時期)があります: {items}"
    dropped: "骨組みの{kind}が落ちています: {items}"
    retry: 事実の一致検査に通りません。整えなおせるのはあと 1 回です
    fallback: 事実の一致検査に通らないため、骨組みのまま出します
    ok: 事実の一致検査に合格しました

# 段階60 第8部: 場所の質問(「高尾山の今の様子を教えて」)の答えの検査(ask verify --place)。1 か所の答えなので、候補数の下限は当てない(ほかの検査はそのまま)
place_answer:
  verify_skip: [too_few_candidates]

# 段階63a 第1部: 一発コマンド ask answer(ikimonobiyori/answer_run.py)。質問の文 → 必ず空でない答えの本文と、状態(PASS / DEGRADED / BLOCKED)。
# フォールバックの順: 1 整えた文章(必須の検査に合格)→ 2 骨組み → 3 部分回答(問題のある候補を外した骨組み)→ 4 最低限の答え。
answer_run:
  budget_s: {value: 180, reason: "本人の指示(段階63a 第1部 4): 全体で3分を目安。取得が時間切れなら保存済みの記録で答える"}
  max_rewrites: 1                      # 整える工程の作り直しは最大 1 回(段階63a 第1部 3)
  # 段階69 第2部 6: 字数の上限で候補を減らすとき、残す候補の下限(1 つの対象・1 期間)。理由: 「紅葉やススキ、そのほか秋」で、
  # 末尾の補足(今年の情報がない候補・平年・ガイドの目)が字数を使い、おすすめが 3 → 1 件に減っていた(本人の会話の練習 2026-11-09)。
  # おすすめの 3 件は、狙い別の節(歩く・ドライブ・遠出)を 1 件ずつ残せる数(provisional)
  # 段階69 第4部 4: 読むページは最初の 1 回の答えで決め、答え直したあと(同じ質問をこの時間の内にもう一度)は新しいページを足さない(時間)
  refresh_rerun_hours: {value: 3, reason: "本人の会話の練習 2026-11-09: 答え直したあと、読むページが新たに3件出た。1回の質問の読み直しは1回まで(段階63b)", provisional: true}
  refresh_rounds_file: logs/refresh_rounds.json
  min_picks_kept: {value: 3, reason: "本人の会話の練習 2026-11-09: 候補が1件に減った。狙い別の節を1件ずつ残す", provisional: true}
  # 質問の語 → 答える対象(ask の対象)。ガイドの言葉の表(data/guide/policy.yaml の words)のテーマから決める
  subject_by_theme: {紅葉: autumn_leaves, 花: flowers, 野鳥: birds, 冬鳥: birds}
  # 知識の言い方(「教えて」)でも、地域・日付の指定か、この語があれば、場所・時期の答え(計画)にする(「神奈川と東京で紅葉の見ごろを教えて」)。
  # ただし knowledge_words(「について」「とは」など)があれば知識の答え
  plan_words: [見ごろ, 見頃, おすすめ, お出かけ, 出かけ, 行きたい, 咲いて, 色づき, 見られる, 見に行]
  knowledge_words: [について, とは, って何, どんな, 違い]
  # ask の対象がないテーマ(現況の記録がない)は、ガイド型の答え(guide find --text --brief)
  guide_only_themes: [桜, ホタル]
  # 最低限の答え(段階63a 第1部 2-4: 確認できた範囲・確認できなかったこと・確認の方法)。事実は facts の値だけ
  minimal:
    lead: "{days}について、確認できた範囲でお答えします。"
    lead_none: "{days}について、確認できている公式の情報の範囲では、今年の様子を確かめられた場所が見つかりませんでした。"
    item: "・{name}: {state}"
    unknown_heading: 確認できなかったこと
    unknown_line: "・{names}は、今年の状況を確認できていません。"
    how_heading: 確認の方法
    how_line: 出かける前に、各施設・自治体の公式ページで今の様子を確かめてください。
    max_items: 3
  # 知識の質問で、手元の資料(知識カード)も名所の一覧もないときの最低限の答え
  knowledge_none: "{topic}について、イキモノビヨリで確かめた資料はまだありません。"
  knowledge_how: 研究機関・国や自治体・植物園や博物館の解説で確かめてください。

# 段階72 第4部 1: 探索範囲全体のデータの棚卸し(ikimonobiyori/coverage.py。ask coverage)。結果は docs/coverage.md
coverage:
  columns: [紅葉, "花(春)", "花(夏)", "花(秋)", "花(冬)", "花(時期不明)", 野鳥, ススキ, ホタル, 行事, 山のカード, 承認済みの情報源, ビジターセンター]
  seasons:
    - {name: 春, months: [3, 4, 5]}
    - {name: 夏, months: [6, 7, 8]}
    - {name: 秋, months: [9, 10, 11]}
    - {name: 冬, months: [12, 1, 2]}
  # ガイドの名所のテーマ → 表の列(花は季節で分ける)
  guide_themes: {紅葉: 紅葉, 花: 花, 桜: 花, 野鳥: 野鳥, 冬鳥: 野鳥, ホタル: ホタル, ススキ: ススキ}
  # 観察の名所・読んだ記録の対象 → 表の列
  subject_themes: {autumn_leaves: 紅葉, flowers: 花, birds: 野鳥}
  # 読んだ記録の種(kind)の語 → 表の列(対象より先に見る)
  kind_themes: {ホタル: ホタル, ススキ: ススキ, 草紅葉: ススキ}

# 段階72 第4部 2〜4(本人の判断 3。2026-11-10): 探索範囲全体への見直し(answer_plan.scope_of・scope_policy)
scope:
  # 今回のおすすめで、同じ都県の候補の上限(候補があるとき。出発地・近場の指定がない質問と「遠くても」の質問)。provisional
  max_same_prefecture: 2
  no_origin:
    # 出発地も近場の指定もない質問では、距離の点数をこの倍率にする(近いことだけで上位にしない)。provisional
    distance_factor: 0.5
    # この語があれば近場の指定とみなす(出発地の指定は origins が判定する)
    near_words: [近場, 近く, 近い, 手軽, 近所, 気軽]
    # 出発地も近場の指定もないとき、出発地から近い候補の節の見出し(「近場で手軽に」の枠にしない。並びは距離でなく点数)
    near_label: 手軽に楽しむ
  wide:
    # この語があれば、近場の枠を作らず地域ごとの節で答える
    words: [遠くても, 遠くてもいい, 遠くて構わない, エリア全体, 範囲全体, どこでも, 遠出してもいい]
    # 地域ごとの節(並びの順)。節の鍵は狙いの鍵と重ならない名前
    groups:
      - {key: r_tokyo_kanagawa, label: 東京・神奈川, prefectures: [東京都, 神奈川県]}
      - {key: r_saitama_chiba_ibaraki, label: 埼玉・千葉・茨城, prefectures: [埼玉県, 千葉県, 茨城県]}
      - {key: r_tochigi_gunma, label: 栃木・群馬, prefectures: [栃木県, 群馬県]}
      - {key: r_yamanashi_nagano, label: 山梨・長野, prefectures: [山梨県, 長野県]}
      - {key: r_shizuoka, label: 静岡, prefectures: [静岡県]}
      - {key: r_niigata_tohoku, label: 新潟・南東北, prefectures: [新潟県, 福島県, 山形県, 宮城県]}
      - {key: r_other, label: そのほかの地域, prefectures: []}
    fallback_group: r_other
    # 地域の節の距離の点数(重みは小さく。範囲の端まで)
    distance_weight: 2
    ref_km: 250
    # 「遠くても」では日帰りの上限の代わりに範囲の上限(range_limit.max_km)まで
    max_km: 250
    section_max: 2
