# 段階72 第3部 1: 知らない地名をすり替えない(ikimonobiyori/place_guard.py)。場所らしい語の取り出し方と答えの文
unknown_place:
  # 場所らしい語(group 1)。「○○には」「○○付近」「○○の近く」「○○周辺に」「○○で見られる」
  patterns:
    - '([^、。\s?？!！]{2,20}?)(?:付近|の近く|近辺)'
    - '([^、。\s?？!！]{2,20}?)には'
    - '([^、。\s?？!！]{2,20}?)周辺[にで]'
  strip_head_re: '^(今週末|来週末|今日|明日|週末|今|いま|この時期)[、の]?'
  min_chars: 2
  # 場所でない語(この語を含む語は場所として扱わない)
  not_place_words: [紅葉, 花, 野鳥, 鳥, おすすめ, 季節, 時期, ここ, そこ, どこ, 近場, 家, 自宅, 冬, 春, 夏, 秋, 今週, 来週, 見頃, 見ごろ, 名所, 山, 時間, 写真, 子ども, 子供, 初心者]
  subject_words: {野鳥: 野鳥, 鳥: 野鳥, 紅葉: 紅葉, 花: 花, ホタル: ホタル}
  default_label: 生き物
  search: "{name} {label} 公式"
  max_records: 5
  max_species: 10
  lines:
    none: "確認できている公式ページの範囲では、{name}の{label}の情報はまだ見つかっていません。"
    found: "{name}の{label}について、確認できた公式ページの記載です。"
    record: "・{name}: {text}({publisher})"
    state: "{state}({date}時点)"
    no_date: 日付なし
    typical: "例年: {typical}"
    species: "見られる鳥: {species}"
    check: お出かけの前に公式ページで確かめてください。

# 質問の形
question_re: '([^、。\s]+?)(?:の)?(?:エリア|あたり|周辺|方面|界隈)'
split_re: '[、・,〜～]|など'
stop_words: [ここ, この, その, 近く, 紅葉, 花, 野鳥, 今週末, 来週末, 明日, 今日]
lines:
  unknown: "{name}のエリアの範囲を特定できませんでした。"
  near: "近い名前のエリアは{names}です。"
  no_spot: "{name}: 今年の情報が確認できた候補はありません。"
  # 段階69 第2部 5: エリアの質問で候補が 0 件のとき、そのエリアの季節の案内(見どころの型)につなぐ前の 1 文
  zero_lead: "{name}で、今年の様子が確かめられた{label}の名所はありません。例年の時期と、その日の見込みをまとめました。"
  subject_labels: {autumn_leaves: 紅葉, flowers: 花, birds: 野鳥}
