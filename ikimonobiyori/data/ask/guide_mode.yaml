    section:
      heading: "## 聞かれた対象の今年の現況(手元の記録・新しい順)"
      lead: "{where}で、{what}の今年の現況(日付つき)の記録です。公式ページの記録だけ。ここにある場所は候補にも入っている。答えでは、この中から新しいもの・聞かれた対象に合うものを選び、並べる順は 今年の現況のある場所(新しい日付の順)→ 例年の目安の場所 → 未確認の場所。場所(括弧の中)が書かれた記録は、その場所のことだけを書く。"
      none: "- (手元に、この対象の日付つきの今年の現況はない)"
    step_lines:
      - '開いた質問(場所を名指ししていない): 検索 {searches} 回・ページの取得 {pages} 回まで(WebSearch・WebFetch)。検索の語は対象・季節・範囲・今年の年だけ(個人情報・この環境の情報を入れない)。WebSearch には blocked_domains に {blocked} を渡す(使わない出典。結果に出ても読まない)。'
      - '始める前に、利用者への予告を 1 行だけ出す: 「公式ページで広く調べてから答えます。3 分ほどかかります。」(CLAUDE.md の表の「広く調べて答える」。2026-11-28 の試し 9 回の実測。docs/wait-notice-timings.md)。'
      - '目安: 上の節の手元の場所と合わせて、今年の現況を公式ページで確かめた場所が {target} か所以上になるまで、上限の中で探して読む(数を合わせるために確かさを下げない。届かなければ、読めた分で答える)。'
      - '1. 広く探す: 範囲全体(出発地から片道 250km 前後。近い所だけで終わらせない)で、「今その対象が見られそうな場所」の名前を集める。紹介サイト・観光協会の特集・まとめ記事は場所の名前を知るきっかけにだけ使う(そこに書かれた色づきの段階・見頃を事実にしない)。上の節の手元の場所も候補から外さない。'
      - '2. 公式ページで確かめる: 候補ごとに運営者・自治体・観光協会・ビジターセンターのページを WebFetch で読む。中身が取れない応答(148 バイトなど)は読めた扱いにせず、別ページを 1 回だけ試す。それでも読めなければ読めなかったとして扱い、検索結果の抜き書きを公式の内容にしない。'
      - '3. 記録する(ask record --out-dir <データ置き場> --batch <JSON>): subject は必須(autumn_leaves・flowers・birds のどれか)。対象と日付が分かったもの → 1 件ずつ {{"subject", "name", "prefecture", "city", "kind", "state"(原文), "state_date", "url", "publisher", "source_class": "official"}}。月別の花の一覧(「10月」の欄に花の名前が載るだけで、見ごろの期間の記載がない)→ state も typical も入れず {{"name", "prefecture", "city", "kind", "listed_months": [10, 11](名前が載る月), "url", "publisher", "source_class": "official", "basis": "page"}}(「例年」にしない)。見ごろの期間が書かれた日付の無い公式ページ → state を入れず {{"name", "prefecture", "city", "kind", "typical"(書かれた月・時期), "url", "publisher", "source_class": "official", "basis": "page"}}(例年の目安。今年の現況にしない)。公式ページが見つからない・読めないもの → ask record-unverified --batch <JSON>(name・prefecture・city・theme・months)。url は公式サイトのページにする(公式ページが外部のブログの記事を載せているときも、記事の URL ではなく載せている公式ページ)。ページが場所を分けて書いていれば part(30 字まで)。'
      - '4. そのあと python -X utf8 -m ikimonobiyori.ask research searched --brief {id} --place "{where}"(新しい情報が取れなかったら --none <理由>)を実行し、同じ質問で ask brief を作り直す。Web が使えないときは調べずに --none <Web が使えない> を実行する。'
