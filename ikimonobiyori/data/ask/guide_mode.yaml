    label: 船か飛行機で渡る島(直線で約{km}km)
    words: [船, 飛行機, フェリー, 島へ渡]
    fix: 「船か飛行機で渡る島で、直線で約○km」のように、船か飛行機が要ることを同じ文に書く
# 第2部 2・3: 種の質問の名所の一覧(資料に入れる数。古い・あいまいな時期の名所も入れて、その旨を書く)
# 段階79 第1部 5: 日付のない今年の現況の事実(ブログの分類の題名「2026年の野鳥公園(45種)」など)を、書き手が「小さな園なので…」のように
# 読み違えた。いつの記録か分からないことを、事実の文そのものに書く
current_undated: "{name}: 公式の発信に「{state}」とある({publisher}。いつの記録かは資料にない。今の様子の根拠にしない)"
species_rows:
  routes_skip: [difference, name, event, species_dated, highlights_dated]
  max_known: 12
  max_unknown: 8
  # 段階79 第1部 3: 時期の分かる名所がこの数以上あるときは、時期の記載のない名所を資料に入れない(熱海梅園がスイセンとロウバイの両方で出た)
  drop_unknown_when_known: 4
  vague_note: 例年の時期の記載があいまい
  old_note: 古い年の記載
  label: 種の名所(例年の時期)
  # 段階82 の続き(本人の判断 2026-11-13 の 2): 同じ名所で、紹介サイト由来の時期が公式の時期より長いとき(公式にない月がある)、公式の行のあとに区別して入れる
  secondary_line: "{name}({loc}): 紹介サイトによると、{species}の例年の時期 {season}"   # 公式かどうかは出典の区分(その他)で分かる。長い断りを誘わない
  # 段階78 の追記(本人の指示 2026-11-11): 日付の指定がない種の質問では、時期の分かる名所を「今から近い順」だけで選ばず、
  # まとまりごとに枠を分けて順に 1 件ずつ取る(どのまとまりも 0 件にしない)。まとまりは、種ごとの表(kinds が名所の種に当たり、
  # 始まりの月日が from〜to に入るもの。種で決まらなければ月日だけで決める)。表のない種は、始まりの月ごとのまとまり(早い月から遅い月まで偏らない)
  spread:
    # 全体の目安の文(まとまりの表がある種)。表のない種は、今までの形の答えと同じ文(season_place.yaml の text.lead)を、資料に入った名所の時期から作る
    text:
      lead_groups: "{name}は、例年の目安がまとまりごとに違います: {parts}。"
      part: "{group} {start}月〜{end}月"
      part_one: "{group} {start}月"
      sep: "、"
      none: "{name}の例年の時期は、資料の名所では分かりません。"
    groups:
      桜:
        - {name: 冬桜, from: '09-01', to: '12-31', kinds: [冬桜, 十月桜, 四季桜, 子福桜]}
        - {name: 早咲き, from: '01-01', to: '03-10', kinds: [河津桜, 寒桜, 寒緋桜, カンヒザクラ, 元朝桜, 大寒桜, 椿寒桜, 修善寺寒桜, おかめ桜, 頼朝桜, 安行寒桜, 玉縄桜, 早咲きの桜]}
        - {name: 春の桜, from: '03-11', to: '04-15', kinds: [ソメイヨシノ, 染井吉野, ヤマザクラ, 山桜, しだれ桜, 枝垂れ桜, タカトオコヒガンザクラ, コヒガンザクラ, オオシマザクラ, 桜]}
        - {name: 遅咲き, from: '04-16', to: '06-30', kinds: [八重桜, 里桜, 御衣黄, 鬱金, 関山, 普賢象, 一葉]}
# 第1部 4: 代わりの行き先(例年の目安の候補)を添えるのは、場所を聞いていて、その場所が今は楽しめないときだけ。種を聞く質問には付けない
alt_place_routes: [highlights, highlights_dated, town, unknown_place]
# 段階80 の追記(本人の判断 2026-11-11): 名所の記録にある市区町村の名前の質問(「南伊豆で」「松田町で」)は、その市区町村の名所を候補にする(ほかの場所の候補は外す)
town_candidates:
  label: "{town}の名所(例年の時期)"
  tentative_label: 仮(検索で集めたもの)
  tentative_note: "(検索で集めた名所。仮)"
  # 段階80 の追記2(本人の判断 2026-11-11): 候補が仮の名所だけのときの、調べる対象の理由
  tentative_why: "「{where}」の名所が仮(検索で集めたもの)だけ"
  # 段階80 の追記3(本人の判断 2026-11-11): エリア・市区町村の質問で、その場所の名所が 0 件のときの「足りないもの」(ほかの場所の候補は混ぜない)
  none_why: "「{where}」の名所が 0 件"
  none_missing: "「{where}」の名所の記録がない(ほかの場所の候補に置き換えていない。その場で調べる対象)"
  # 段階80 の追記2: 名所の対象(名所カタログの区分・ガイドのテーマ・記録の区分)→ 質問の対象。ここにないもの(ホタルなど)は、対象を絞った質問では出さない
  subject_of: {flowers: flowers, autumn_leaves: autumn_leaves, birds: birds, wintering_birds: birds, 花: flowers, 桜: flowers, 紅葉: autumn_leaves, 野鳥: birds, 冬鳥: birds}
# 段階80 A(提案4): 場所の辞書にない地名の質問(経路 unknown_place)。既定の出発地の近くの候補に置き換えず、足りないものに出す(調べる対象は research)
unknown_place_missing: "場所の辞書にない地名「{name}」: ほかの場所の候補に置き換えていない(その場で調べる対象)"
# --prev: 引き継いだ事実は、次の質問にはもう引き継がない(質問をまたいで関係のない事実が積もらないように)
prev_one_level: true
# 第1部 5: 都道府県のドメイン(pref.<ローマ字>.lg.jp / pref.<ローマ字>.jp)の名前
pref_romaji: {hokkaido: 北海道, aomori: 青森県, iwate: 岩手県, miyagi: 宮城県, akita: 秋田県, yamagata: 山形県, fukushima: 福島県, ibaraki: 茨城県,
  tochigi: 栃木県, gunma: 群馬県, saitama: 埼玉県, chiba: 千葉県, tokyo: 東京都, kanagawa: 神奈川県, niigata: 新潟県, toyama: 富山県, ishikawa: 石川県,
  fukui: 福井県, yamanashi: 山梨県, nagano: 長野県, gifu: 岐阜県, shizuoka: 静岡県, aichi: 愛知県, mie: 三重県}
# 第2部 1: エリア・山域の質問(見どころの経路)では、そのエリアの名所の計画(今年の現況・例年の時期)も資料に入れる。計画を作る質問の形
area_plan_question: '{date}、{area}の紅葉や花や野鳥のおすすめ'
area_plan_max: 8
# 第1部 1・第3部 3: 答えの先頭・末尾の作業の説明と英語の文
work_note_words: [下書き, 合格, そのまま送, 送ります, 照合, 書き直, 検査に, 資料から, ask verify, ask brief]
english_re: '[A-Za-z]{2,}(?:[ ,;:\-]+[A-Za-z]{2,}){2,}'
# 第3部 1: 語りの材料。カードの文を種類に分ける語(上から順に当てる)と、分類の既定(Claude Code が分類の意味から決めた。provisional)
narrative:
  kinds: [なぜ今, どこをどう見る, 見分け方, 次の季節]
  other: その他
  none: 材料なし
  max_items: 8
  min_items: 4
  per_kind_max: 3
  extra_cards: 4                 # 材料が min_items より少ないときに足すカードの上限
  min_items_to_require: 2        # 第3部 3: この数以上の材料があるのに 1 点も使わない答えは不合格
  skip_routes: [name, event]     # 行事の質問と、名前だけを聞く短い質問は除く
  md_note: 'ここから選んで文にする(1つの答えで1〜2点。一般の話は合わせて2つまで。安全・マナーの注意は数えない。使ったら文の終わりに [K…])。「材料なし」の種類は書かない。'
  word_rules:
    - {kind: 見分け方, words: [違い, とは違, 見分け, 区別, 似て, 比べ, 異なる, 見た目, 特徴は, とは別, 別の種, ではなく]}
    - {kind: 次の季節, words: [このあと, その後, 続いて, やがて, 翌年, 翌春, 冬になると, 春になると, 夏になると, 秋になると, 散ったあと, 終わると, 終わったあと, 次は, 落葉後, 冬を越]}
    - {kind: どこをどう見る, words: [朝, 夕方, 夕暮れ, 時間帯, 足元, 梢, 水面, 双眼鏡, 見上げ, 見下ろ, 探す, 探し, 歩くと, 歩き, 近づかず, 観察する, 見つけ, 耳を, が見える, 見渡せ, 沿いで]}
    - {kind: なぜ今, words: ['ため(に)?', 寒さ, 気温, 標高が高, 標高の高, 高いところ, 低いところ, 渡って, 渡り, 越冬, 冷え込み, 日照, 寒暖, 霜, 雪解け, 北から, 南から, 凍って, 凍る, 仕組み]}
  # 材料にしない文(行事・開園・料金・観測の決まりなど、語りではない事実。年・時刻・金額のある文も材料にしない)
  not_material_re: 'ライトアップ|開園|閉園|料金|駐車|問い合わせ|電話|標本木|観測する|観測は|観測の|定義|指定され|登録され|開花日|紅葉日|落葉日|満開日|対象は原則|最初の日'
  # 段階79 第1部 4: 材料の場所に「どこの話か(都県と市区町村)」を付ける。広い山域・湖・湿原は都県だけ(1 つの市町村に決めない)
  wide_place_re: '(山|岳|峠|山地|連峰|高原|アルプス|霞ヶ浦|遊水地|湿原|尾瀬|ヶ原|五湖)$'
  by_category: {季節の仕組み: なぜ今, 夜・天気・自然現象: なぜ今, 見頃の流れ: 次の季節, 出会い方・歩き方: どこをどう見る, 行き方・歩き方: どこをどう見る}
# 第4部: その場で調べる(本人の判断 2026-11-11。段階78 指示書 4)
research:
  dir: research                      # データ置き場の下(取得の控え・調べた記録の一覧・承認待ちの情報源の候補)
  max_pages_per_question: 3          # 1 つの質問で取得するページの上限
  max_seconds_per_question: 120      # 1 つの質問で、最初の取得からこの秒数を過ぎたら取得しない
  min_interval_s: 1                  # 同じホストへの間隔
  declared_publisher_re: '(観光協会|観光連盟|観光推進機構|観光物産協会|観光コンベンション協会|市|町|村|県|都|府|省|庁|事務所|公園|管理センター|管理事務所|ビジターセンター|博物館|植物園|財団|寺|神社|神宮|大社|天満宮|八幡宮|庭園|美術館|記念館|資料館)$'   # --publisher の名前の形(公式に当たる発行元)。段階84 の続き(本人の判断 2026-11-15 の 2): 寺・神社・庭園・美術館などの運営者が自分の境内・施設について書いたページも公式として読む(表示の区分だけで、情報源の承認ではない)
  declared_publishers_approved: [中央アルプス観光株式会社, "Chuo Alps Kanko Co., Ltd.", 浜名湖えんてつグループ]   # 浜名湖えんてつグループ: 浜名湖ガーデンパークの指定管理者(段階84 の続き・本人の判断 2026-11-15 の 2)   # 段階83 第1部(本人の判断 2026-11-13 の 1): 駒ヶ岳ロープウェイの運営会社を公式の発行元として読む(名前の形の決まりの例外。運営者の欄で名前を確かめるのは同じ)
  # 段階80 B(提案9): --publisher の名前を探すのは、ページの運営者の欄だけ(本文にあるだけでは通さない)
  operator_class_re: 'footer|copyright'                  # id・class にこの語を含む要素は運営者の欄
  # 段階84 の続き(本人の判断 2026-11-15 の 3): 運営者の欄の住所の中の名前(「新潟県十日町市…」「〒948-…十日町市」)は、発行元の名前として数えない
  operator_copyright_re: '(©|Ⓒ|\(c\)|\(C\)|[Cc]opyright)\s*\d{0,4}\s*[^\s]{0,4}$'   # 著作権表示の直後の都県名+市町村名は発行元の名前
  operator_longer_name_re: '[一-鿿ァ-ヶー]{0,6}?(観光協会|観光連盟|観光物産協会|観光コンベンション協会|観光機構|商工会|協議会|実行委員会)'   # 名前の後ろにこれが続くと、別の団体の名前の一部
  operator_address_before_re: '([都道府県]|〒\s*\d{3}-?\d{4}\s*|〒[^〒]{0,15}|\d{3}-\d{4}\s*)$'
  operator_line_re: '©|Ⓒ|[Cc]opyright|COPYRIGHT|\([Cc]\)|（[Cc]）|著作権|All [Rr]ights [Rr]eserved|運営者|運営[:：]|運営元|サイト運営|発行者|発行[:：]|発行元|このサイトについて'   # 著作権表示・運営者情報の行
  max_requests_per_page: 4           # 1 ページの取得の通信の上限(robots.txt と本文、同じサイトへの転送を 1 回ずつ)
  cache_days: 7                      # 同じ URL の取得の控えを使う日数
  max_bytes: 3000000                 # 1 ページの大きさの上限
  max_text_chars: 12000              # 標準出力に出す本文の字数の上限(全文は控えのファイル)
  min_species_rows: 2                # 聞かれた種の名所がこの数より少ないと「調べる」
  once_hours: 24                     # 段階82 第3部 4: 同じ質問でこの時間の中に一度調べたら、作り直した資料に「調べる」を出さない(1 つの質問で 1 回だけ)
  done_line: "この質問は一度調べました。今の資料で書ける範囲で、1 回で答える(もう調べない)"
  year_round_words: [通年]           # 段階82 第3部 1: 季節のない名所(苔・地形・巨樹など)は、例年の時期の代わりに「通年」
  kinds: [flowers, birds]            # 記録の対象(observations の subject)
  fields: [name, prefecture, city, kind, typical, notice, url, publisher, closed_period, best_conditions]   # 記録してよい項目(今年の現況は記録しない)。段階82: 行けない時期・特によいとされる条件(公式に書かれているときだけ)
  forbidden_fields: [state, state_date, state_date_text, current, practical]
  event_period_re: 'まつり|祭|開催|イベント|ライトアップ|期間中'   # 段階78 第7部: 行事の期間を例年の時期として記録しない
  omitted_month_re: '\d+月(上旬|中旬|下旬|初旬|末)〜(上旬|中旬|下旬|末)'   # 段階78 第6部の続き: 「4月上旬〜下旬」は前半しか読まれないので、後ろの月を省かない(「4月上旬〜4月下旬」)
  # 指示書 open-question-breadth の続き 第1部(本人の返事 1・7、2026-11-28): 見つけた公式ページを research/pending_sources.jsonl に残し、
  # 広く探す段の最初に、聞かれた対象と範囲に合うページを読む(ikimonobiyori/pending_sources.py)。台帳ではない・答えの材料を絞らない・確かさの区分を上げない。
  pending_first:
    max_reads: {value: 8, source: "指示書 open-question-breadth の続き 1-3 の 5(一覧から読むのは取得の上限 16 回の半分まで。一覧だけで上限を使い切らないため・仮置き)", provisional: true}
    wide_max_same_prefecture: {value: 2, source: "本人の返事 3(2026-11-28): 範囲が wide の質問で、一覧から選ぶページの同じ都県の上限(仮置き)", provisional: true}
    subjects: [autumn_leaves, flowers, birds]
    publisher_kinds: [運営者, 指定管理者, 自治体, 観光協会, ビジターセンター]   # 前の指示書 3-2: 発行元がこのどれかだと、ページの中身から確かめられたときだけ残す
    date_styles: {article: 記事ごとの日付あり, photo: 撮影日あり, none: 日付なし}
    update_styles: {append: 記事が増える, rewrite: 1 ページを書き換える, monthly_url: 月ごとに URL が変わる}
    step_lines:
      - '0. 最初に読む(見つけた公式ページの一覧。Web の検索より先に): 下の {n} ページを WebFetch で読む(一覧から読むのは最大 {max} 回。取得の上限 {pages} 回に数える)。読めて対象と日付が分かったものは、検索で見つけて読んだ公式ページと同じに ask record する(一覧に載っていることで確かさを上げない)。一覧のページの発行元は、運営者の欄・著作権表示・同じホストのトップページで確かめてある(ページに運営者の欄が無くても、一覧の発行元の名前で記録してよい。ただし「運営者は未確認」の印の行は、確かめてから記録する)。発行元自身の投稿(SNS)の文だけのページは、公式サイトが自分のアカウントとして案内している(「フォロー」の案内やリンク)ことを確かめて、ask record の embedded_post で記録する(docs/guide-mode.md)。実際に読めたページだけ、python -X utf8 -m ikimonobiyori.ask research seen <id> --brief {id} を実行する(読んでいないページには実行しない)。'
    row: "   - {id}: {name}({publisher}。{km}最後に読めた日 {last}) {url}"
    # 本人の返事 6(2026-11-28): ask record で書いた今年の現況のページ。(a) 公式の区分のホストで台帳にも一覧にも無ければ自動で残す(運営者は「未確認」)。(b) ほかは案内の 1 行
    auto:
      unverified: 未確認
      reason: "未確認(ask record で今年の現況を書いたときに、コードが自動で残した。運営者の欄は確かめていない)"
      question: (ask record から自動で残した)
      row_mark: "(運営者は未確認。ページの運営者の欄・著作権表示で確かめてから記録する)"
      hint: "一覧に残せるか確かめる: {url} の発行元が運営者・指定管理者・自治体・観光協会・ビジターセンターだとページの中身から確かめられたら、python -X utf8 -m ikimonobiyori.ask research pending --file <JSON> で残す"
  pending_add_line: '公式ページで確かめるのに使えたページのうち、発行元がその場所の運営者・指定管理者・自治体・観光協会・ビジターセンターだとページの中身(運営者の欄・著作権表示)から確かめられたものは、python -X utf8 -m ikimonobiyori.ask research pending --brief {id} --file <JSON> で残す(1 件: publisher・publisher_kind・official_reason・url・subject・content・kinds・date_style(article/photo/none)・update_style(append/rewrite/monthly_url。monthly_url は url_template に {{yyyy}}・{{mm}})・place{{name, prefecture, city, lat, lon}})。台帳にあるページ・確かめられないページは残さない(はねられる)。'
  step_lines:
    - '1. 公式ページの URL を Web 検索で探す(検索の要約を事実にしない。行き先探しだけ)。読んでよいのは自治体・観光協会・公園管理者・施設運営者(指定管理者を含む)・国や県の機関のページ。'
    - '2. python -X utf8 -m ikimonobiyori.ask research fetch <URL> --brief {id} で本文を読む(1 つの質問で 3 ページ・2 分まで。robots.txt で拒否されたページ・公式でないページは読まない)。'
    - '3. 本文で確かめた名所の名前・都県と市町村・見られる種・例年の時期・行く前の注意だけを、ask research record --brief {id} --file <JSON> で記録する(今年の現況・行事の今年の日付は記録しない)。'
    - '4. ask brief を作り直して(同じ質問)、いつもの手順で書く → ask verify。Web を使えない環境では、この節を飛ばして今の資料で答える。'
# 第5部: 足りなかったことの記録
gaps:
  file: logs/gaps.jsonl
  sources_heading: 出典
  answer_words: [確かめられていません, 確かめていません, 分かっていません, 分かりません, 確認できていません, 確認していません, 記録は多くありません]
  skip_missing_re: 'についての確かめた事実は [1-9][0-9]* 件'    # 事実が 1 件以上ある場所の数の報告は、足りないものにしない
  max_chars: 120
# 段階80 の追記5(本人の判断 2026-11-12): 名前の形が違う同じ場所を、資料の候補で 1 つにまとめる(guide_brief.merge_same_candidates)。
# 同じ市区町村・同じ種で、座標が max_m 以内(座標がなければ名前の主な部分が同じ)。max_m は本人の判断の値
merge_same:
  max_m: 200
  conflict_reason: 例年の時期の月が重ならない(事実が食い違う)ので、まとめていない
# 段階82 第2部(本人の判断 2026-11-12。段階79 の判断4 を改める): 種の見分け方・特徴の文は、カードの裏づけを求める。
# 季節や環境についての一般的な説明は、今までどおり AI の知識で書いてよい(この語に当たらない)。
# 段階82 の続き(本人の判断 2026-11-13 の 5): 聞かれた種の季節の姿の写真(写真の対応表の「種(姿)」で点検で可のもの)を資料に出す。
# 答えにその姿の語(綿毛)を書くと、ページにその写真が載る(guide_answer_page)
form_photos:
  heading: "## 写真(ページに載せられる季節の姿)"
  line: "- {name}: 答えで{species}の「{word}」の姿を書くと、ページにこの写真が載る"
species_traits:
  # 見分け・特徴の語(正規表現。別の語の一部に当たらない形にした: 散策の「散」・落ち葉の「落ち」・尾瀬の「尾」・空模様の「模様」)
  words_re:
    - '散(?!策|歩|在|らか|布)'
    - '落ち(?!葉|着|合)'
    - '花びら|花弁|萼|がく片'
    - '葉の形|葉の縁|葉先|ぎざぎざ|ギザギザ|鋸歯'
    - 'くちばし|嘴'
    - '尾羽|(?<![高瀬])尾(が|の|は|を)(?!根|瀬)'
    - '冠羽|羽の色|翼の'
    - '(?<!空)模様'
    - '体長|全長|翼開長'
    - '鳴き声|さえずり|地鳴き'
    - '有毒|毒が|毒を|毒の|毒は'
    - '見分け|との違い|と(は|も)?違(い|う|っ)|違いは|似ている|似た'   # 「まとまりごとに違います」「色の進み方の違い」(時期・見どころの説明)は特徴にしない(段階82 第2部の止めすぎの直し)
  # 段階84 第1部 B: 色・大きさの語(「白い大きな鳥がいたら、ハクチョウです」)。「面白い」「尾白」「腹黒」は数えない。生き物の部分を形容するときだけ数える(「小さな池」「大きな群れ」は止めない)
  clause_words_re:
    # 生き物の部分を形容するときだけ(「小さな池」「大きな群れ」「白い砂浜」は数えない。段階84 第5部のあとの直し)。「白くなる」も。カードの書き方(小輪・大輪・白から)も同じ仲間
    - '(?:(?<![面尾])白い|(?<!腹)黒い|真っ白な|真っ黒な|純白の|白っぽい|黒っぽい|白色の|黒色の|大きな|小さな|大きい|小さい|大型の|小型の|小ぶりの|大ぶりの)(?:鳥|花|羽|体|くちばし|嘴|葉|実|姿|頭|顔|首|尾|翼|胸|腹|模様|斑|輪|成鳥|幼鳥|カモ|水鳥|個体)|(?<![面尾])白く(?:な|見え|目立)|(?<!腹)黒く(?:な|見え|目立)|小輪|大輪|白から|白や'
  # ↑ 読点・句点で区切った節ごとに照らす(その語のある節の種だけ。「冬桜は…小さな花で、…寒桜とは別の種です」の寒桜は照らさない)
  # 段階84 の続き B(本人の指示 2026-11-15): 色・大きさの語は、種の名前と同じ文で見分けを言い切る形(〜がいたら〜です・〜なら〜です・〜のが〜です)のときだけ照らす。
  # 場所や群れを形容する文(小さな池・大きな群れ・白い花が咲く公園)や、種の説明の文(「幼鳥は…白くなります」)は照らさない
  clause_form_re: '(たら|なら|ならば|れば)、?[^。]*(です|だ|でしょう)。?$|のが[^。、]*(です|だ)。?$'
  # 照らす種の名前: 質問の種の読み替えと同じ一覧(species_alias.py)と、season_place.yaml の species の語。
  # 仲間の総称(猛禽類・カモなど)は種の名前として照らさない(「冬のカモは北から渡ってくる」の類は一般の説明)
  group_words: [猛禽類, カモ, シギ, チドリ, カモメ, バラ, 秋バラ]   # バラ・秋バラ: 園芸品種の集まりで、種の特徴がない(見どころの説明を止めない)
  code: trait_without_card
  fix: "この種の特徴は資料にありません。書かないでください(カードにある特徴なら、そのカードの印 [K…] を付ける)"
  wrong_card_code: trait_wrong_card
  wrong_card_fix: "印のカードに、この種のこの特徴は書かれていません。カードにある特徴だけを書くか、書かないでください"
  # 段階82 の続き(本人の判断 2026-11-13 の 1): 2 つの種を比べる見分け方のカード(カードの項目 contrasts)の組み合わせと逆の文を止める。
  # 確かなときだけ: 節(対比の切れ目で分ける)ごとに、特徴の語がどちらの種のことかを決め、否定の形・決められない節は照らさない
  contrast:
    code: trait_reversed
    fix: "印のカードでは、この特徴はもう一方の種のものです。カードのとおりの組み合わせで書いてください"
    split_re: 'のに対し(?:て|、)?|に対して|一方(?:で|、)?|けれど(?:も)?|ですが|ますが|だが|が、|。'
    negation_re: '^.{0,8}?(ない|なく|ず[、。]|ずに|ません|ではな)'
    compare_re: '^(より|ほど|と(は)?違|と(は)?異な|と比べ|に比べ|のよう|に似|と似|とちが|と同じ|に対し)'
    topic_re: '^(は|が|も|では|には|の(ほう|方)が|の(オス|メス|花|葉|穂|羽|成虫|幼虫)?(は|が))'
    # 段階82 の続き(本人の判断 2026-11-13 の 3): 特徴の語と、すぐ後ろの種の名前のあいだに入ってよい語尾(連体の形だけ。「落ちる」の「る」)。
    # 「落ちるが」「大きく」「湿地に」のような、つなぎの語尾は入れない(そのあとの種の名前は別の節の主語)
    modifier_endings: ["", る, た, い, な, の, ている, ていた, った, っている]
  # 資料: 聞かれた種の話のカードが 0 枚のとき
  research_why: "{sp}の公的な解説"
  missing_line: "{sp}の見分け方・特徴は、資料にありません(書かない)"
  step_lines:
    - '種の公的な解説: 自治体・国や県の機関・博物館・植物園・公園管理者の解説ページを検索で探し、ask research fetch <URL> --brief {id} で読む(上の 3 ページ・2 分に含む)。本文で確かめた特徴だけを ask knowledge add --file <JSON> でカードにする(subject に種の名前、category は 種の解説)。公的資料・研究機関のカードは、そのサイトの利用規約を読んで確かめたときだけ rights を「確認済み(日付)。…」で始める(確かめられなければ答えに出ないので、施設のページなら confidence を 施設の解説 にする)。'
# 段階83 第3部: 季節の暦(環境ごと・月ごとの見どころ)のカード。カードの calendar: {environment, months, target, where}
calendar:
  environments: [里山・雑木林, 水辺, 干潟・河口, 高原・湿原, 亜高山・高山, 海辺・磯, 街の公園・庭園]
  targets: [花, 鳥, 虫, 木の葉や実, 痕跡, 地形や気象の現象, そのほかの動物]
  env_words:                     # 質問・候補の名前にこの語があれば、その環境(上から順に。1 つの語は 1 つの環境)
    干潟・河口: [干潟, 河口, 三番瀬]
    高原・湿原: [高原, 湿原, 湿地, 尾瀬, 戦場ヶ原, 霧ヶ峰]
    亜高山・高山: [高山, 亜高山, 山頂, 稜線, アルプス, 森林限界]
    海辺・磯: [海辺, 磯, 海岸, 浜辺, 砂浜, 岬]
    水辺: [水辺, 川, 池, 湖, 沼, 河川, 水鳥]
    里山・雑木林: [雑木林, 里山, 谷戸, 森, 林]
    街の公園・庭園: [公園, 庭園, 植物園, 街, 近所, 近く]
  max_cards: 2                   # 場所・種の話のカードがあるとき(暦のカードは2枚まで。場所の話・種の話を優先)
  max_cards_open: 4              # 場所や種を決めない質問(「今の見頃」「近くの公園で何が見られる」「冬の雑木林の楽しみ方」)
  skip_routes: [season_place, normal, name, event]
  link: 季節の暦
  # 場所や種を決めない質問の語(この語があり、種の名前・市区町村・エリアの指定がない質問)
  open_words: [見頃のもの, 見ごろのもの, 何が見られる, なにが見られる, 何が見える, 楽しみ方, 見どころ, 今の時期, 今ごろ, この時期, 季節の]
  season_months: {春: [3, 4, 5], 夏: [6, 7, 8], 秋: [9, 10, 11], 冬: [12, 1, 2]}
  month_re: '(?<![0-9０-９/])([0-9０-９]{1,2})月(?:の|に|ごろ|頃|上旬|中旬|下旬)'   # 質問の月(「2月の週末」「5月に」)。暦のカードと観察記録はこの月で引く
  category_targets: {birds: [鳥], plants: [花, 木の葉や実], insects: [虫], fungi: [], other_animals: [そのほかの動物]}   # 観察記録の分類 → 暦の対象
  month_mid_day: 15
  word_targets: {紅葉: [木の葉や実], 黄葉: [木の葉や実]}   # この語のある質問は、この対象の暦だけ
  place_names_re: '(東京都|東京|神奈川県|神奈川|埼玉県|千葉県|茨城県|栃木県|群馬県|山梨県|長野県|静岡県|新潟県|福島県|山形県|宮城県)'   # 環境・分類の語を当てる前に除く(「神奈川」の「川」)                # 月だけの質問の観察記録の対象の日(その月の中ほど)
# 段階83 第4部: 小話(名前の由来・人との関わり・歴史・文学や行事とのつながり)のカード。カードの tale: {topic}
tale:
  max_cards: 1                   # 1 つの答えに 1 点まで(答えの終わり近くに添える材料)
  kind: 小話
  link: 小話
  skip_routes: [name]
# 段階84 の続き A(本人の指示 2026-11-15): 読んだ事実の記録の行事(observations の event。年つき・公式・本文で確かめたもの)を、
# 行事を聞いた質問(「来月、梅やロウバイの行事はある?」)と、種を挙げて期間を決めた質問(「2月の週末、梅を見たい」)の資料の事実にする。
# それまでは行事の質問は行事の台帳(facility_events・承認済みの施設)だけを見ていて、名所の記録の行事は場所の候補の事実にしか出なかった
record_events:
  event_words: [行事, まつり, 祭り, イベント, 催し, 観察会]
  subjects: [flowers, birds]
  max_in_window: 6               # 期間の内の行事の数の上限(資料が長くなりすぎないように)
  max_after: 3                   # 期間の内になければ、期間のあとの行事をこの数まで
  weekdays: [月, 火, 水, 木, 金, 土, 日]
  line: "{name}: {event}: {period}"
# 段階85 第1部: 資料を作るときの現況のページの自動の読み直し(auto_refresh.py)。値は指示書 段階85 1.2 による
auto_refresh:
  enabled: true
  max_pages: {value: 5, source: "指示書 段階85 1.2(1 つの質問で最大 5 ページ)", provisional: true}
  max_seconds: {value: 25, source: "指示書 段階85 1.2(合わせて 25 秒まで)", provisional: true}
  max_requests: {value: 12, source: "5 ページ × (robots.txt と本文) に余り。理由: 上限を通信の回数でも抑える", provisional: true}
  max_requests_per_page: {value: 2, source: "robots.txt と本文の 2 回(コードで読む日光・箱根の上限。施設のページは見出しのリンクを 1 つたどるので 3 回になることがある。全体の上限は max_requests)", provisional: true}
  min_interval_s: {value: 1, source: "CLAUDE.md 規則 6(同じホストへの間隔 1 秒以上)", provisional: true}
  connect_s: {value: 5, source: "理由: 25 秒の中で 5 ページを読むため、research(10 秒)より短く", provisional: true}
  read_s: {value: 8, source: "同上", provisional: true}
  max_bytes: {value: 3000000, source: "research.max_bytes と同じ", provisional: true}
  max_text_chars: {value: 20000, source: "理由: 変わったページの本文の控えの長さ(エージェントが読む分)", provisional: true}
  rounds_hours: {value: 2, source: "同じ質問で資料を作り直すあいだ、1 回目に上限で外したページを足さない時間(読み直しがくり返されないように)。理由: 1 問に答える時間より長い", provisional: true}
  alt_text:                          # 本人の決定(2026-11-28 の直す案 7): 指定したページだけ、画像の説明(alt)の全文も控えに入れる。投稿を使ってよい条件(発行元自身のページ・発行元自身の投稿・日付が分かる)は observations の record.embedded_post のまま
    source_ids: [isehara-kankou-oyama-koyo]   # 台帳(data/sources)の id。状態の文がサイドバーの Instagram の画像の説明にだけある(台帳の notation.note)
    min_chars: {value: 20, source: "理由: ロゴや写真の短い説明を控えに入れない", provisional: true}
    truncated_min_chars: {value: 10, source: "理由: 見出しの短い語を、途中で切れた写しと取り違えない", provisional: true}
    heading: "----- 画像の説明(alt の全文)。ここの投稿の文は embedded_post の条件を満たすときだけ使う。途中で切れた文は使わない -----"
  stale_days: {value: 7, source: "指示書 段階85 1.2(現況の日付が対象の日より 7 日以上前なら「古い」の印)", provisional: true}
  vc_follow_words: [紅葉情報, 開花情報, 花情報, 自然情報, 野鳥情報, 今の, 近ごろの自然]   # 本人の判断(2026-11-15 の 1): 施設のトップに見出しだけがあるとき、この語のリンクを 1 つだけたどる(同じサイトの中だけ)
  dir: auto_refresh                  # データ置き場の下(変わったページの本文の控え。次の読み直しで上書き)
  lines:
    failed: "{name}の公式の現況({publisher})を読み直せませんでした({md}時点の記録のまま)"
    heading: "## 読み直したページ(前回の記録から内容が変わった公式の現況)"
    note: "下の本文の控えで、名所ごとの今の状態と日付を確かめ、ask record --batch <JSON> で記録してから、同じ質問で ask brief を作り直す(本文にない状態を書かない。Web を使わない)。記録する事実が無いページは ask warm --mark <URL> で読んだ印だけを残す。"
    notice_note: "  控えに通行止め・閉鎖・復旧中などの案内があり、今も有効なら、必ず ask record に {\"name\", \"notice\": \"自分の言葉で短く(80 字まで)\", \"state_date\": \"案内の日付\", \"url\", \"publisher\", \"source_class\": \"official\", \"basis\": \"page\"} で記録する。解除の案内が出ていたら、notice に「解除」の語を入れて記録する。花を場所ごとに記録するとき(part)は、花の名前を kind に入れる。"
    alt_note: "  画像の説明(alt)の全文を控えの終わりに入れた。そこにある投稿は、発行元自身の公式ページ・発行元自身の投稿・日付が分かる、の 3 つを満たすときだけ ask record の embedded_post で記録する(docs/guide-mode.md)。途中で切れた文は使わない。"
    vc_note: "施設(ビジターセンターなど)のページは ask record ではなく ask vc-record --batch <JSON> で記録する(1 件: center・date(年つき)・state(状態の語だけ)・url。台帳の allowed_fields にない項目(種名など)は入れない)。"
    row: "- {name}({publisher}・前回の記録 {md}時点): {url} → 本文の控え {text_path}"
    stale_mark: "古い({days}日前)"
# 本人の決定(2026-11-28): 今も有効な通行止め・閉鎖・復旧中の案内は、その場所を案内する答えに必ず添える(照合 safety_notice_missing)。
# 記録の notice(公式のページの本文で読んだお知らせを短くまとめた語)のうち、words の語があるもの。名所と発信元ごとにいちばん新しい案内を見て、
# lifted_words の語(解除など)があれば添えない。案内の日付が max_age_days より古いものも添えない(読み直して今も有効なら記録し直す)
must_attach:
  enabled: true
  words: [通行止, 通行禁止, 通行でき, 閉鎖, 閉園, 立入禁止, 立ち入り禁止, 復旧]
  lifted_words: [解除, 全面開通, 全面復旧しました, 全面復旧いたしました, 通常開園]
  max_age_days: {value: 30, source: "理由: 古い案内を今も有効と書かない。復旧の知らせは数週間おきに出る(くりはま花の国の公園だより)", provisional: true}
  line: '{name}: 行く前に(公式の案内): {notice}({md}時点の案内)'
  ng_why: '{place}を案内しているのに、今も有効な通行止め・閉鎖・復旧中の案内([{id}])が添えられていない'
  ng_fix: 'その場所の案内に、事実 [{id}] の内容を印を付けた文で添える'
# 本人の決定(2026-11-28): 資料の「今年の現況」と食い違う言葉。今年の現況の事実がある場所の、ほかの行からは外す
no_current_notes: [。今年の現況は分かりません, (今年の情報は確認できていません), 。今年の情報は確認できていません]
# 本人の決定(2026-11-28 の直す案 8): 月別の花の一覧に名前が載るだけの記録。「例年」と書かない
month_list:
  enabled: true
  line: '{name}: {kind}は、{publisher}の{months}の花の一覧に名前が載っています(見ごろの時期の記載ではありません。今年の様子でもありません)'
  banned_words: [例年, 平年, 毎年, 見頃, 見ごろ]
  ng_why: 月別の花の一覧に名前が載るだけの事実を、例年の時期・見ごろとして書いている
  ng_fix: 「○月の花の一覧に名前が載っています」の形で書く(例年・見ごろの語を使わない)
# 本人の決定(2026-11-28 の直す案 9): 1 つの答えの一般の話(豆知識・小話)は 2 つまで。安全やマナーの注意は数に入れない。数え方の決まりは docs/guide-voice.md §1b
general_talk:
  enabled: true
  max: {value: 2, source: "指示書 open-question-breadth 第4部 8・本人の決定 2026-11-28(上限 2 つ)", provisional: false}
  routes: [plan, season_place, highlights_dated, species_dated, combo]   # 出かける場所を聞く質問の経路。知識を聞く質問は数えない
  exempt_links: [この場所の話, 季節の暦]       # 聞かれた場所の案内と、場所や種を決めない質問の主な材料(暦)
  exempt_categories: [保全・マナー, 安全, シーズンの目安, 行き方・アクセス]
  safety_words: [注意, 危険, 毒, チャドクガ, ハチ, クマ, マムシ, ヤマビル, かぶれ, 刺さ, 近づきすぎ, 近づかな, 餌, エサ, 採ら, 持ち帰, 触ら, さわら, 踏み, 立ち入, 登山道, ライト, 通行止, 閉鎖, マナー]
  ng_why: '一般の話(豆知識・小話)が {n} つある(上限 {max} つ。安全・マナーの注意は数えない)'
  ng_fix: '見に行く人の役に立つ一般の話を {max} つまで残して、ほかは消す(同じカードの続いた文は 1 つ)'
# 段階85 第2部: 「出典を見せて」のときの URL つきの出典(sources_reply.py。ask sources)
sources_reply:
  file: ask/last_sources_reply.json
  heading: 出典
  none: 直前の答えには、URL のある出典はありません。
  no_answer: 直前の答えが見つかりません。もう一度質問していただければ、出典つきでお答えします。
# 段階85 第3部: 取りこぼしの点検(audit.py。ask audit)。通信しない
audit:
  origin: null                       # 省くと ask の既定の出発地
  q_species: "{sp}はいつどこで見られますか?"
  q_month: "{month}月の週末、{sp}を見たい"
  q_place: "{pref}で見られる花は?"
  months_per_species: {value: 2, source: "理由: 時間のため、名所の窓に多く当たる月から 2 か月", provisional: true}
  prefectures: [東京都, 神奈川県, 埼玉県, 千葉県, 茨城県, 栃木県, 群馬県, 山梨県, 静岡県, 長野県]
  place_cap: {value: 12, source: "species_rows.max_known と同じ(都県の質問の候補の枠の目安)", provisional: true}
  place_skip_species: [ホタル]                  # 都県の「花」の質問で数えない種(花でない)
  regress_species: [梅, 水仙, 河津桜, 冬桜, ハクチョウ]      # 回帰テストで点検する種(時間のため絞る)
  list_heading: "### 理由が「上限で外れた」「規約・承認のため」以外の一覧"
  labels:
    kinds: {species: 種の質問, month: 月の週末の質問, place: 都県の質問}
    reasons: {limit: 上限で外れた(件数の枠), no_season: 例年の時期の記録がない・出さない(紹介サイト 1 件だけの時期。時期の分かる名所が多いときは入れない), season_parse: 時期の読み取りに失敗, species_link: 種の名前が結びつかない, place_link: 場所が結びつかない, terms: 規約・承認のため出せない, retired: 取り下げ済み, other: そのほか(理由が分からない)}
# 段階85 第4部 2: 語りの材料の枠(紅葉や野鳥の候補がある質問でも、観察記録と暦を先に取っておく)
reserve:
  seasonal_obs: {value: 2, source: "指示書 段階85 第4部 2(例年この時期の観察記録を 1〜2 点)", provisional: true}
  obs_kind: 例年この時期の観察記録
  calendar_kind: 季節の暦
  fallback_question: 今の時期に見られる生き物           # 観察記録の分類を決めない質問の形(紅葉だけの質問でも地域の観察記録を引く)
  obs_ref: "・公式の現況がなければ、地域の観察記録 [{ids}] の傾向を続けて書ける"
  skip_routes: []
# コンシェル向けの項目(指示書 docs/brief-concierge-fields-instructions.md。2026-11-27)。資料の JSON にだけ入れる(Markdown・rules には出さない)。
# 候補の ID・座標は、計画の行の id が指す名所カタログ・観察の名所の値を写すだけ(作らない・推測しない・丸めない)。無ければ null。
concierge_fields:
  generator_name: ikimonobiyori
  place_id_prefix: "ikimonobiyori:"         # 名所カタログ・観察の名所の id の前に付ける(提案の出力 biyori-proposal/1 の place.site_ref と同じ書き方)
  mountain_site_ref_prefix: "yamabiyori:"   # 資料の候補の mountain_site_ref(山の地点との結びつき。sites.yaml・カタログの site_ref の値)
  coord_source:                             # 座標を写した元
    catalog: catalog                        # 名所カタログ(data/catalog/*.yaml)の point
    catalog_ref: catalog_via_spot           # 観察の名所の catalog_ref が指す名所カタログの point
    spot: observation_spot                  # 観察の名所(data/observations/spots.yaml)の point(point.source に出典が書かれたものだけ)
    spot_coarsened: observation_spot_coarsened   # 下の対象の観察の名所の座標を、プロファイルの位置の粗さに丸めたもの
  # 野鳥の観察の名所の座標(出典の書かれた point か bird_range。小数 2 桁)は、野鳥のプロファイルの位置の粗さ(birds は area_10km = 小数 1 桁)に
  # 丸めて出す(利用者の決定 2026-11-27。丸める前の値は資料に入れない。絶対ルール 7)。丸め方は提案の出力と同じ(proposals.coarse_precision・engine.round_coord)
  spot_coords_coarsen_subjects: [birds, wintering_birds]
  merge_conflict_reason: まとめた候補の元の ID が食い違うので、ID・座標を入れていない
  git:
    timeout_s: 5                            # commit を読む git の待ち時間の上限(仮の値。超えたら null)
# 山の名前を挙げた質問(指示書 docs/mountain-named-instructions.md。2026-11-28 利用者の決定)。質問に sites.yaml の山の名前(括弧の前の部分)があり、
# 対象を紅葉・花などに絞った質問のとき、その山と結びついた名所(カタログの site_ref・観察の名所の mountain_site_ref・catalog_ref 先の site_ref)を
# 候補の末尾に足す。計画の順位にあればその行の形、順位を作らない経路では市区町村の名所の行の形(basis: town)。今ある候補は外さず、順番も変えない。
# enabled: false で、直す前と同じ資料になる。足した候補にだけ、mark_key の項目(値は mark_value)が付く(docs/concierge-brief-fields.md)。
mountain_named_candidates:
  enabled: true
  mark_key: added_by
  mark_value: mountain_name
  # 「調べる(資料が薄い)」の数え方(指示書 docs/mountain-named-2-instructions.md 第 2 部。2026-11-28 利用者の決定): 足した候補が、ここに挙げた種類の事実
  # (今年の現況 current・例年の時期 typical)を 1 つも連れてこなかったときは、その候補を「資料が薄いか」の数に入れない(足す前と同じ「調べる」が残る)。
  thin_fact_kinds: [current, typical]
  # 資料の Markdown の先頭の節(第 3 部): 資料の asked_mountain があるときだけ、候補の一覧より前に、その候補の行と事実の行をそのまま並べる。
  asked_section:
    heading: "## 聞かれた山の名所"
    lead: "質問で挙げられた山の名所です。まずこの名所の状態を答えてください。"
# 指示書 docs/current-status-instructions.md(2026-11-28。利用者の承認: 資料の出力の項目と記録の検査を変えてよい)。
# 聞かれた名所(質問が名前を挙げた山と、質問の場所の語と名前が同じ候補)の今年の現況を、場所ごと(part)・出どころごと(公式・紹介サイト・利用者)に資料に並べる。
# enabled: false で資料に current_status が入らず、照合も main と同じになる。research・spread・steps はそれぞれ第 4・5・6 部を切る。
current_status:
  enabled: true
  section:
    heading: "## 聞かれた名所の今年の現況(場所ごと・出どころごと)"
    lead: "質問で挙げられた名所の、今年の現況の記録をすべて並べます(新しい順)。場所(山頂・中腹など)が書かれた記録は、その場所のことだけを書いてください。発信元が違う記録は、どれも消さずに発信元と日付を添えて書いてください。"
  lines:
    dated: "{label}: {state}({md}時点、{publisher})"
    undated: "{label}: 「{state}」({publisher}。日付の書かれていない発信で、いつの状態か分からない)"
    whole: 名所全体としての表示
    user: "{date}に現地で確認した記録では、{where}は「{state}」(公式の発表ではありません)"
    user_source: 利用者が現地で確認した記録
    no_date: 日付不明
    fresh_unknown: 新しさ不明
    unseen: "- 確認していない: {words}({date}に現地で確認した記録 [{fact}] で、見ていない所。この場所の状態は、別の発信元の記録が無ければ書かない)"
    spread_row: "- ばらつき({part}): {ids}"
    whole_note: "(名所全体としての表示は、場所ごとの記録より粗い)"
    spread_lead: "ばらつきがあるときは、「{line}」と書き、それぞれの発信元と日付を添えて並べる(どれか 1 つだけを選ばない。現地で確認した記録は先に書いてよい)。"
    searched_found: "- その場で調べた({at}): 見つかった記録は上のとおり"
    searched_none_md: "- その場で調べた({at}): 新しい情報は見つからなかった(答えにもそのとおり書く)"
    searched_none: "「{where}」の今年の現況を調べたが、新しい情報は見つからなかった"
    user_fix: "「11月26日に現地で確認した記録では、…(公式の発表ではありません)」の形で、日付と公式ではないことを同じ文に書く"
    skipped_fix: "調べる手順(資料の節「調べる」)で調べて記録し、python -X utf8 -m ikimonobiyori.ask research searched --brief {id} --place {where}(見つからなければ --none <理由>。Web が使えないときは調べずに --none)を実行してから、資料を作り直す"
    refresh_fix: "節「読み直したページ」の本文の控えで状態と日付を確かめて ask record し(新しい情報が無ければ ask research searched --brief {id} --place {where} --none <理由>)、資料を作り直す"
  research:                          # 第 4 部: 聞かれた名所に「新しい」(observations の freshness.fresh_days)今年の現況が 1 件も無いとき
    enabled: true
    routes: [plan]                   # 対象にする経路(仮置き。見どころ・花の質問は今年の現況を調べる対象にしない)
    subject_words: {autumn_leaves: 紅葉, flowers: 花, birds: 野鳥}
    why: "「{where}」の今年の現況が新しくない(広く調べる)"
    search_words: "{where} {what} {year}"
    max_searches_per_place: {value: 2, source: "指示書 current-status 第 4 部(聞かれた名所 1 つにつき検索 2 回・仮置き)", provisional: true}
    max_pages_per_place: {value: 4, source: "指示書 current-status 第 4 部(聞かれた名所 1 つにつきページ 4 枚・仮置き)", provisional: true}
    step_lines:
      - '始める前に、利用者への予告を 1 行だけ出す: 「公式ページで広く調べてから答えます。3 分ほどかかります。」(CLAUDE.md の表の「広く調べて答える」。2026-11-28 の試し 9 回の実測。docs/wait-notice-timings.md)。'
      - '今年の現況(名所ごと): 検索の語は名所の名前・対象・今年の年だけ(個人情報・この環境の情報を入れない)。1 つの名所につき検索 {searches} 回・ページ {pages} 枚まで(WebSearch・WebFetch。検索の要約を事実にしない)。'
      - '読む順番: 現地の発信(観光協会・施設や索道の運営会社・自治体・ビジターセンター)を先に、次に紹介サイト。自動アクセスを断っているページ・ログインや有料の壁は読まず、人が開く URL として添える。'
      - '読んだら 1 件ずつ ask record --out-dir <データ置き場> --batch <JSON> で記録する(--out-dir は必須。state は原文・state_date は状態の日付・part はページが場所を分けて書いていればその言葉・url・publisher・source_class)。日付の無い状態は、読んだ日を状態の日付にしない(state_date を省く)。名所全体に 1 つの語だけの紹介サイトの表示は part なしで記録する。'
      - 'そのあと python -X utf8 -m ikimonobiyori.ask research searched --brief {id} --place <名所>(新しい情報が取れなかったら --none <理由>)を実行し、同じ質問で ask brief を作り直す。Web が使えないときは調べずに --none <Web が使えない> を実行する。'
  post:                              # 指示書 open-question-breadth の続き 第3部: 公式ページに載った発行元自身の投稿
    mark: "(公式ページに載った発行元の投稿、投稿日 {md})"
    mark_inferred: "(公式ページに載った発行元の投稿、投稿日 {md}。年は読んだ日から補った)"
    quote_fix: 投稿の文を写さず、状態の語と日付を自分の言葉で書く(「11月27日時点では見頃で、落葉が目立ち始めていました」の形)
  spread:                            # 第 5 部
