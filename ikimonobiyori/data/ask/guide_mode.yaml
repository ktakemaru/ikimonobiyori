# 段階75: 「ガイドが書き、コードが裏を取る」形(試作)の設定。ask brief(guide_brief.py)・ask verify --brief(guide_verify.py)が読む。
# 値の理由: 試作の初期値(provisional)。本人が比較(docs/stage75-report.md)を読んで決める。
schema: ikimonobiyori-guide-mode/1

# 答えの形の切り替え。classic = 今までの形(ask answer の出力をそのまま)。guide = 新しい形(ask brief → 書く → ask verify)。
# 既定は今までの形(指示書 3.4)。guide にしても ask answer の答えは変わらない(標準エラーに資料の場所と手順の 1 行を足すだけ)。
answer_form: guide              # 段階77: 既定を新しい形に切り替えた(本人の判断 2026-11-10)。今までの形に戻すときは classic にする
answer_forms: [classic, guide]

brief_dir: briefs                 # データ置き場の下
max_candidates: 12                # 資料に入れる候補の数(順位の上から)
max_cards: 8                      # 資料に入れる知識カードの数(段階76 第2部: 場所・種・テーマ・季節を合わせて最大 8 枚)
cand_card_places: 3               # 答えに選んだ候補のうち、場所のカードを引く件数(上から)
place_cards_max: 7                # 質問の場所のカードの上限
# 資料で場所のカードを並べる順(安全を先に、続けてガイドが話す「目玉」。保全・行き方は後)
brief_category_order: [安全, 種の解説, シーズンの目安, 出会い方・歩き方, 見頃の流れ, 季節の仕組み, 痕跡・暮らし, 地形・地質・火山, 名前・歴史・文化, 夜・天気・自然現象, 保全・マナー, 行き方・歩き方, 施設]
species_cards_max: 4              # 質問の種・現象のカードの上限
cand_cards_max: 2                 # 選んだ候補の場所のカードの上限
species_word_re: '[ァ-ヴー]{3,}|冬桜|寒桜|四季桜|十月桜|氷の花|氷華'   # 質問から種・現象の名前を取り出す形
place_suffix_re: '(山|岳|高原|峠|湖|沼|川|池|公園|神社|寺|原|渓谷|峡|滝|島|浜|海岸|干潟|遊水地|庭園|半島|温泉)$'   # 場所の形の名前(テーマのカードにしない)
general_place_words: [鳥, 花, 桜, 外来種, 生き物, 植物, 森, 天気, 季節]   # 一般の話のカードの場所の欄の語(テーマの語に足す)
not_species_words: [イキモノビヨリ, ドライブ, イベント, ライトアップ]
card_links: {place: この場所の話, species: この種の話, theme: 一般の話(テーマ)}
# テーマのカードを引く語(対象か質問の語で選ぶ。特定の場所のカードは引かない。季節は対象の日の月)
card_themes:
  - {subject: autumn_leaves, question_words: [紅葉, 黄葉, 色づ], words: [紅葉, 黄葉, 色づ, カエデ, イチョウ]}
  - {subject: flowers, question_words: [花, 桜, 咲], words: [冬桜, 寒桜, 桜, バラ, 菊, 花]}
  - {subject: birds, question_words: [野鳥, 鳥, 冬鳥, 渡り, カモ, カワセミ, 白鳥], words: [冬鳥, 渡り, カモ, 野鳥]}
  - {question_words: [観察会, 観察, 野鳥, 鳥], words: [観察の作法, 野鳥との接し方, 近づきすぎ, マナー]}
  - {question_words: [地形, 地質, 火山, 成り立ち], words: [地形, 地質, 火山, 付加体, 成り立ち]}
# 行事の質問のカードを、行事の対象で絞る語(段階77 の判断 3)。行事の本文に event_words があれば、その対象の card_words を題・主語・分類に含むカードだけ
event_topics:
  - {name: 地質, event_words: [地形, 地質, 岩石, 化石, 火山, 石ころ], card_words: [地形, 地質, 岩石, 化石, 火山, 成り立ち, 地層, 地塊, プレート]}
  - {name: 野鳥, event_words: [野鳥, 鳥, バード, 探鳥], card_words: [野鳥, 鳥, 冬鳥, 夏鳥, カモ, 猛禽, 渡り]}
  - {name: 植物, event_words: [植物観察, 野草, 樹木, 花の観察], card_words: [植物, 野草, 樹木, 花]}   # 「森」は施設名(横浜自然観察の森)に当たるので使わない
  - {name: 昆虫, event_words: [昆虫, 虫, チョウ, ホタル], card_words: [昆虫, 虫, チョウ, ホタル]}

# 例年の目安の候補(段階76 第1部)。ガイドのカタログのテーマ(対象ごと)
typical_themes:
  autumn_leaves: [紅葉]
  flowers: [花, 桜]
  birds: [野鳥, 冬鳥]
typical_candidates:
  per_group: 2                    # 範囲が広い(wide)とき、地域の組ごとの件数
  far_total: 3                    # 範囲の指定がないとき、出発地の地域の組の外から合わせた件数
  label: 例年の目安の候補(今年の現況はない)
region_groups:                    # 地域の組(指示書 段階76 第1部 3)
  - {name: 東京・神奈川, prefectures: [東京都, 神奈川県]}
  - {name: 埼玉・千葉・茨城, prefectures: [埼玉県, 千葉県, 茨城県]}
  - {name: 栃木・群馬, prefectures: [栃木県, 群馬県]}
  - {name: 山梨・長野, prefectures: [山梨県, 長野県]}
  - {name: 静岡, prefectures: [静岡県]}
  - {name: 新潟・南東北, prefectures: [新潟県, 福島県, 山形県, 宮城県]}
closure_note:                     # 冬季閉鎖の事実に添える語(順位は下げない。資料に明記する)
  in_period: 対象の日は例年の閉鎖の時期に当たる
  out_period: 対象の日は例年の閉鎖の時期の外
max_prev_facts: 40                # --prev で引き継ぐ事実の数

rewrites:
  max: 2                          # 書き直しは 2 回まで(3 回目の不合格で今の ask answer の答え)
length:                           # 長さの目安(合否には使わない。結果に警告として出す)
  min: 400
  max: 900
knowledge_places:
  max: 3                          # AI の知識で添える場所は 1 つの答えに 3 か所まで
  unverified_words: [確かめていません, 確かめていない, 確かめられていません, 確認していません, 確認できていません, 未確認, 確かめてから, 確かめてください]
  theme_default: その他

# 確かめた事実の種類(資料の kind)
kinds:
  current: 今年の現況
  typical: 例年の目安
  event: 行事
  facility: 施設
  safety: 安全・規制
  other: その他の記録

# 答えの行から事実の種類を決める語(上から順に当てる)
line_kinds:
  - kind: safety
    words: [通行止め, 閉鎖, 規制, 一方通行, 立入禁止, 運休, 通行禁止, 注意, 危険, クマ, 入山]
  - kind: event
    words: [まつり, 祭り, 祭, 開催, ライトアップ, 観察会, 講座, イベント, 展示, 菊花, 申込, 定員, 締切, 募集]
  - kind: facility
    words: [開館, 開園, 休館, 休園, 料金, 入園, 入館, 円, 電話, 営業, 駐車場]
  - kind: current
    words: [時点, 現在, 今の状況, 今年, 記録です, 発信]
  - kind: typical
    words: [例年, 平年, 見頃の時期, ごろから, 月まで]

not_current_words: [確認できていません, 分かりません, 記録がありません]   # 今年の情報がない旨の行は「例年の目安」(今年の現況にしない)
line_skip_words: [可能性があります, 選びました, 対象の日は, 見込みです, 確かめてください, 直線距離です, 距離で選びました]   # 見込み・選び方・案内の文は事実ではない
not_publisher_words: [植物, 踏み, 弱い, 確認, 時点, 例年, 主催者, 公式ではありません, 紹介サイト, 約]   # 行の終わりの括弧が発行元でない語
publisher_name_re: '(省|庁|事務所|県|都|府|市|町|村|協会|センター|博物館|公園|財団|機構|管理|研究所|環境省|観光|ビジターセンター|保護)$'   # 括弧の語を発行元とみなす形(区・地名・文は除く)
official_name_re: '(省|庁|事務所|県|都|府|市|町|村)$'    # URL のない発行元で、国・自治体の名前は「公式」
min_plain_line_chars: 12          # 腐りやすい値のない行は、この字数以上のときだけ事実にする(短い見出し・語だけの行を除く)

# 状態の語(照らす対象)。norm で表記をそろえる(左を右に置き換える)
state_words: [見頃, 見ごろ, みごろ, 色づき始め, 色づきはじめ, 色づき進む, 色づきすすむ, 色付き, 色づき, 散り始め, 落葉, 終盤, 見頃終盤, 真っ盛り, 最盛, 盛り, 咲き始め, 咲きはじめ, 開花, 満開, 五分咲き, 散り, 青葉, 終わり, 咲いています, つぼみ, 飛来, 渡来, 見られています, 確認されています, 観察されています]
state_norm:
  見ごろ: 見頃
  みごろ: 見頃
  はじめ: 始め
  すすむ: 進む
  色付き: 色づき
  咲きはじめ: 咲き始め
now_words: [今週末, 来週末, 今週, 今年, 現在, 今日, 明日, この週末, 時点, 今の, 今は, いまは, いまが, いまの, 今、, 今が, 今も, 今ちょうど]
event_words: [まつり, 祭り, 紅葉祭, 開催, ライトアップ, 観察会, 講座, イベント, 展示会, 菊花展, 特別開園, 申込, 定員, 締切]
period_words: [期間, まで, から, 〜, ～, 中旬, 上旬, 下旬]
closure_words: [通行止め, 閉鎖, 規制, 一方通行, 立入禁止, 運休, 通行禁止, 休園, 休館]

# 下書きの形(印と場所の一覧)
draft:
  marker_re: '\[([FK]\d{3,})\]'
  places_heading: '[場所]'
  places_record: '記録:'
  places_knowledge: '知識:'

# 今までの検査の部品のうち、この形では印の照合が受け持つもの(骨組み用。電話は印の事実と照らす)
skip_reused_codes: [phone_not_from_official]

# この形の答えに出さない内部の言葉(今までの検査の語に足す)
guide_internal_words: [資料, 知識カード, カード, 記録によると, 記録では, 記録にある, 記録にない, 記録上, 検査, 裏取り, brief, id, ID, '[F', '[K']
# 今の状態の語があっても、確かめていない・少ないと正直に書いた文は合格(指示書 3.2 の例外の扱い。段階75 の判断)
honest_words: [分かっていません, 分かっていない, 確かめられていません, 確かめていません, 確認できていません, 確認していません, 分かりません, 多くありません, 少なく]
# 例年の目安の事実を根拠に、この語で始まる・含む文は「例年の話」(今の状態の文として扱わない)
typical_words: [例年, 平年, 毎年]

# 段階77 第1部 1: 対象の日より前の現況を、対象の日の状態として言い切る文を止める(時点の報告と見込みは通す)
stale_as_target:
  target_words: [今週末, 来週末, この週末, 週末は, 週末の, 当日, お出かけの日]
  hedge_words: [見込み, 可能性, かもしれ, でしょう, ころ, 頃に, 頃から, 頃まで, 予想, そうです, そうな, 期待, 向かう, はず, だろう]   # 「頃」だけは「見頃」に当たるので使わない
  point_words: [時点, 現在, 発表, でした, ていました, とされ, の記録, 発信, 伝えて]

# 段階76 第5部 4: この形で止める問いかけ(読む人への質問だけ。「どちらも…ご確認ください」のような案内は止めない)
question_re: '([?？]\s*$|(ますか|ませんか|でしょうか|ですか|しますか|しましょうか)[。]?\s*$|どちらにしますか|いかがですか|いかがでしょう)'
# 段階76 第5部 2: 文中に入れない長い断り(公式かどうかは最後の出典で分かる)
long_disclaimers: [紹介サイトの記載で、公式ではありません, の記載で、公式ではありません, (公式ではありません), （公式ではありません）]
# 公式として扱うホスト(段階76 第5部 1)。霧ヶ峰自然保護センター: 長野県が設置、指定管理者の諏訪観光協会が運営(https://www.kirigamine-vc.jp/about。2026-11-10 確認)
official_hosts: [kirigamine-vc.jp]

# 最終の文の出典の並び
final:
  sources_heading: 出典
  official: 公式
  not_official: 公式ではありません
  card_note: '{date}に確認'
  fact_note: '{date}時点'

# 資料の「決まり」(AI に渡す。指示書 0.3 の事実の決まりを短く)
rules:
  - ウェザーニュース(転載を含む)・tenki.jp・日本気象協会の予想と、SNS の投稿は使わない。
  - 山と溪谷オンラインは、状態の語・日付・URL だけ。
  - 行事(まつり・ライトアップなど)の期間を、例年の見頃や今の色づきとして書かない。
  - 範囲は横浜から片道250km前後。範囲の外の場所を書かない。
  - 今年の現況・日付・行事の名前と期間・開園時間・休園日・料金・電話・通行止め・特定の名所の例年の時期は、確かめた事実にあるときだけ書き、文の終わりに印 [F001] / [K001] を付ける。
  - 確かめた事実にないことは「今年の状況は確かめられていません」のように書くか、書かない。
  - 内部の言葉(資料・カード・記録・検査・id など)と作業の事情を答えに書かない。答えの最後に質問を書かない。
  - '答えの最後に [場所] の一覧を書く(記録: 確かめた場所 / 知識: 自分の知識で添えた場所(都県)。3か所まで)。'
