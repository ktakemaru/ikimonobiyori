    enabled: true
  # 指示書 open-question-breadth 第 1 部(2026-11-28): 場所を名指ししない質問でも、手元の今年の現況を全部並べ、Web で広く探す。
  # 名指しの質問(上の research)は変えない。調べた印・照合(current_research_skipped)は同じ部品(--place に where を渡す)。
