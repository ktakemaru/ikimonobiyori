# 段階75: 「ガイドが書き、コードが裏を取る」形(試作)の設定。ask brief(guide_brief.py)・ask verify --brief(guide_verify.py)が読む。
# 値の理由: 試作の初期値(provisional)。本人が比較(docs/stage75-report.md)を読んで決める。
schema: ikimonobiyori-guide-mode/1

# 答えの形の切り替え。classic = 今までの形(ask answer の出力をそのまま)。guide = 新しい形(ask brief → 書く → ask verify)。
# 既定は今までの形(指示書 3.4)。guide にしても ask answer の答えは変わらない(標準エラーに資料の場所と手順の 1 行を足すだけ)。
answer_form: guide              # 段階77: 既定を新しい形に切り替えた(本人の判断 2026-11-10)。今までの形に戻すときは classic にする
answer_forms: [classic, guide]

brief_dir: briefs                 # データ置き場の下
max_candidates: 12                # 資料に入れる候補の数(順位の上から)
max_cards: 8                      # 資料に入れる知識カードの数(段階76 第2部: 場所・種・テーマ・季節を合わせて最大 8 枚)
cand_card_places: 3               # 答えに選んだ候補のうち、場所のカードを引く件数(上から)
place_cards_max: 7                # 質問の場所のカードの上限
# 資料で場所のカードを並べる順(安全を先に、続けてガイドが話す「目玉」。保全・行き方は後)
brief_category_order: [安全, 種の解説, シーズンの目安, 出会い方・歩き方, 見頃の流れ, 季節の仕組み, 痕跡・暮らし, 地形・地質・火山, 名前・歴史・文化, 夜・天気・自然現象, 保全・マナー, 行き方・歩き方, 施設]
species_cards_max: 4              # 質問の種・現象のカードの上限
species_card_place_suffix: 一般     # 段階79 第3部: 種のカードの場所の欄(「桜一般」)。種の質問では、このカードを先に
species_card_skip_routes: [plan]   # 種のカードを先に引かない経路(計画の質問は、選んだ候補の場所のカードを優先する)
species_blob_exclude_re: '梅雨|梅干|青梅|梅田|桜えび|桜エビ|桜海老|ホタルイカ'   # 種の名前を含む別の語(種の話として数えない)
cand_cards_max: 2                 # 選んだ候補の場所のカードの上限
species_word_re: '[ァ-ヴー]{3,}|冬桜|寒桜|四季桜|十月桜|氷の花|氷華'   # 質問から種・現象の名前を取り出す形
place_suffix_re: '(山|岳|高原|峠|湖|沼|川|池|公園|神社|寺|原|渓谷|峡|滝|島|浜|海岸|干潟|遊水地|庭園|半島|温泉)$'   # 場所の形の名前(テーマのカードにしない)
general_place_words: [鳥, 花, 桜, 外来種, 生き物, 植物, 森, 天気, 季節]   # 一般の話のカードの場所の欄の語(テーマの語に足す)
not_species_words: [イキモノビヨリ, ドライブ, イベント, ライトアップ]
card_links: {place: この場所の話, species: この種の話, theme: 一般の話(テーマ)}
# テーマのカードを引く語(対象か質問の語で選ぶ。特定の場所のカードは引かない。季節は対象の日の月)
card_themes:
  - {subject: autumn_leaves, question_words: [紅葉, 黄葉, 色づ], words: [紅葉, 黄葉, 色づ, カエデ, イチョウ]}
  - {subject: flowers, question_words: [花, 桜, 咲], words: [冬桜, 寒桜, 桜, バラ, 菊, 花]}
  - {subject: birds, question_words: [野鳥, 鳥, 冬鳥, 渡り, カモ, カワセミ, 白鳥], words: [冬鳥, 渡り, カモ, 野鳥]}
  - {question_words: [観察会, 観察, 野鳥, 鳥], words: [観察の作法, 野鳥との接し方, 近づきすぎ, マナー]}
  - {question_words: [地形, 地質, 火山, 成り立ち], words: [地形, 地質, 火山, 付加体, 成り立ち]}
# 行事の質問のカードを、行事の対象で絞る語(段階77 の判断 3)。行事の本文に event_words があれば、その対象の card_words を題・主語・分類に含むカードだけ
event_topics:
  - {name: 地質, event_words: [地形, 地質, 岩石, 化石, 火山, 石ころ], card_words: [地形, 地質, 岩石, 化石, 火山, 成り立ち, 地層, 地塊, プレート]}
  - {name: 野鳥, event_words: [野鳥, 鳥, バード, 探鳥], card_words: [野鳥, 鳥, 冬鳥, 夏鳥, カモ, 猛禽, 渡り]}
  - {name: 植物, event_words: [植物観察, 野草, 樹木, 花の観察], card_words: [植物, 野草, 樹木, 花]}   # 「森」は施設名(横浜自然観察の森)に当たるので使わない
  - {name: 昆虫, event_words: [昆虫, 虫, チョウ, ホタル], card_words: [昆虫, 虫, チョウ, ホタル]}

# 例年の目安の候補(段階76 第1部)。ガイドのカタログのテーマ(対象ごと)
typical_themes:
  autumn_leaves: [紅葉]
  flowers: [花, 桜]
  birds: [野鳥, 冬鳥]
typical_candidates:
  per_group: 2                    # 範囲が広い(wide)とき、地域の組ごとの件数
  far_total: 3                    # 範囲の指定がないとき、出発地の地域の組の外から合わせた件数
  label: 例年の目安の候補(今年の現況はない)
# 段階79 第2部: 範囲の指定がない野鳥の質問(「野鳥のおすすめ」「渡り鳥」)に、季節の目玉がある観察地を、地域の組が偏らないように入れる。
# 観察地は段階76 第3部で目玉のカード(環境省・国土交通省・県・市町村・施設の管理者の本文で確かめたもの)を集めた場所。
# 季節は、その場所のカードの月(condition.months)を合わせたもので決める(この表に月を書かない)。theme は目玉の種類(偏りを避けるための語)、
# label は資料に書く目玉の語(カードの本文にある鳥の名前だけ)。card_place はカードの場所の欄。名所カタログ(catalog/birds.yaml)は変えない(判断: 報告書)
bird_highlights:
  min: 4
  max: 6
  label: 季節の目玉がある観察地
  cards_per_site: 2                 # 観察地ごとに資料に足すカードの上限
  material_kind: 観察地の目玉         # 語りの材料に足す種類の名前(観察地ごとに 1 点)
  months_ahead: 1                   # この季節 = 対象の月と、そのあとこの月数(11 月の質問なら 12 月の目玉も)
  sites:
    - {name: 葛西臨海公園 鳥類園, prefecture: 東京都, city: 江戸川区, theme: 猛禽, label: "冬の猛禽(ノスリ・オオタカ・ハイタカ)", card_place: 葛西臨海公園}
    - {name: 谷津干潟, prefecture: 千葉県, city: 習志野市, theme: 干潟の鳥, label: "干潟のシギ・チドリとカモ", card_place: 谷津干潟}
    - {name: 多々良沼, prefecture: 群馬県, city: 館林市, theme: 白鳥, label: "冬の白鳥", card_place: 多々良沼}
    - {name: 霞ヶ浦(妙岐ノ鼻・稲波干拓), prefecture: 茨城県, city: 稲敷市, theme: ガン, label: "オオヒシクイとチュウヒ", card_place: 霞ヶ浦}
    - {name: 渡良瀬遊水地, prefecture: 栃木県, city: 栃木市, theme: 猛禽, label: "冬の猛禽(チュウヒ・ハイイロチュウヒ・コミミズク)", card_place: 渡良瀬遊水地}
    - {name: 涸沼, prefecture: 茨城県, city: 鉾田市, theme: 冬のカモ, label: "スズガモなど冬のカモ", card_place: 涸沼}
    - {name: 本埜白鳥の郷, prefecture: 千葉県, city: 印西市, theme: 白鳥, label: "コハクチョウ", card_place: 本埜白鳥の郷}
    - {name: 手賀沼, prefecture: 千葉県, city: 我孫子市, theme: 冬のカモ, label: "冬のカモとオオバン", card_place: 手賀沼}
region_groups:                    # 地域の組(指示書 段階76 第1部 3)
  - {name: 東京・神奈川, prefectures: [東京都, 神奈川県]}
  - {name: 埼玉・千葉・茨城, prefectures: [埼玉県, 千葉県, 茨城県]}
  - {name: 栃木・群馬, prefectures: [栃木県, 群馬県]}
  - {name: 山梨・長野, prefectures: [山梨県, 長野県]}
  - {name: 静岡, prefectures: [静岡県]}
  - {name: 新潟・南東北, prefectures: [新潟県, 福島県, 山形県, 宮城県]}
closure_note:                     # 冬季閉鎖の事実に添える語(順位は下げない。資料に明記する)
  in_period: 対象の日は例年の閉鎖の時期に当たる
  out_period: 対象の日は例年の閉鎖の時期の外
max_prev_facts: 40                # --prev で引き継ぐ事実の数

rewrites:
  max: 2                          # 書き直しは 2 回まで(3 回目の不合格で今の ask answer の答え)
length:                           # 長さの目安(合否には使わない。結果に警告として出す)
  min: 400
  max: 900
knowledge_places:
  max: 3                          # AI の知識で添える場所は 1 つの答えに 3 か所まで
  unverified_words: [確かめていません, 確かめていない, 確かめられていません, 確認していません, 確認できていません, 未確認, 確かめてから, 確かめてください]
  theme_default: その他

# 確かめた事実の種類(資料の kind)
kinds:
  current: 今年の現況
  typical: 例年の目安
  event: 行事
  facility: 施設
  safety: 安全・規制
  other: その他の記録

# 答えの行から事実の種類を決める語(上から順に当てる)
line_kinds:
  - kind: safety
    words: [通行止め, 閉鎖, 規制, 一方通行, 立入禁止, 運休, 通行禁止, 注意, 危険, クマ, 入山]
  - kind: event
    words: [まつり, 祭り, 祭, 開催, ライトアップ, 観察会, 講座, イベント, 展示, 菊花, 申込, 定員, 締切, 募集]
  - kind: facility
    words: [開館, 開園, 休館, 休園, 料金, 入園, 入館, 円, 電話, 営業, 駐車場]
  - kind: current
    words: [時点, 現在, 今の状況, 今年, 記録です, 発信]
  - kind: typical
    words: [例年, 平年, 見頃の時期, ごろから, 月まで]

not_current_words: [確認できていません, 分かりません, 記録がありません]   # 今年の情報がない旨の行は「例年の目安」(今年の現況にしない)
line_skip_words: [可能性があります, 選びました, 対象の日は, 見込みです, 確かめてください, 直線距離です, 距離で選びました]   # 見込み・選び方・案内の文は事実ではない
not_publisher_words: [植物, 踏み, 弱い, 確認, 時点, 例年, 主催者, 公式ではありません, 紹介サイト, 約]   # 行の終わりの括弧が発行元でない語
publisher_name_re: '(省|庁|事務所|県|都|府|市|町|村|協会|センター|博物館|公園|財団|機構|管理|研究所|環境省|観光|ビジターセンター|保護)$'   # 括弧の語を発行元とみなす形(区・地名・文は除く)
official_name_re: '(省|庁|事務所|県|都|府|市|町|村)$'    # URL のない発行元で、国・自治体の名前は「公式」
min_plain_line_chars: 12          # 腐りやすい値のない行は、この字数以上のときだけ事実にする(短い見出し・語だけの行を除く)

# 状態の語(照らす対象)。norm で表記をそろえる(左を右に置き換える)
state_words: [見頃, 見ごろ, みごろ, 色づき始め, 色づきはじめ, 色づき進む, 色づきすすむ, 色付き, 色づき, 散り始め, 落葉, 終盤, 見頃終盤, 真っ盛り, 最盛, 盛り, 咲き始め, 咲きはじめ, 開花, 満開, 五分咲き, 散り, 青葉, 終わり, 咲いています, つぼみ, 飛来, 渡来, 見られています, 確認されています, 観察されています]
state_norm:
  見ごろ: 見頃
  みごろ: 見頃
  はじめ: 始め
  すすむ: 進む
  色付き: 色づき
  咲きはじめ: 咲き始め
now_words: [今週末, 来週末, 今週, 今年, 現在, 今日, 明日, この週末, 時点, 今の, 今は, いまは, いまが, いまの, 今、, 今が, 今も, 今ちょうど]
event_words: [まつり, 祭り, 紅葉祭, 開催, ライトアップ, 観察会, 講座, イベント, 展示会, 菊花展, 特別開園, 申込, 定員, 締切]
period_words: [期間, まで, から, 〜, ～, 中旬, 上旬, 下旬]
closure_words: [通行止め, 閉鎖, 規制, 一方通行, 立入禁止, 運休, 通行禁止, 休園, 休館]

# 下書きの形(印と場所の一覧)
draft:
  marker_re: '\[([FK]\d{3,})\]'
  places_heading: '[場所]'
  places_record: '記録:'
  places_knowledge: '知識:'

# 今までの検査の部品のうち、この形では印の照合が受け持つもの(骨組み用。電話は印の事実と照らす)
skip_reused_codes: [phone_not_from_official]

# この形の答えに出さない内部の言葉(今までの検査の語に足す)
guide_internal_words: [資料, 知識カード, カード, 記録によると, 記録では, 記録にある, 記録にない, 記録上, 検査, 裏取り, brief, id, ID, '[F', '[K']
# 今の状態の語があっても、確かめていない・少ないと正直に書いた文は合格(指示書 3.2 の例外の扱い。段階75 の判断)
honest_words: [分かっていません, 分かっていない, 確かめられていません, 確かめていません, 確認できていません, 確認していません, 分かりません, 多くありません, 少なく]
# 例年の目安の事実を根拠に、この語で始まる・含む文は「例年の話」(今の状態の文として扱わない)
typical_words: [例年, 平年, 毎年]

# 段階77 第1部 1: 対象の日より前の現況を、対象の日の状態として言い切る文を止める(時点の報告と見込みは通す)
stale_as_target:
  target_words: [今週末, 来週末, この週末, 週末は, 週末の, 当日, お出かけの日]
  hedge_words: [見込み, 可能性, かもしれ, でしょう, ころ, 頃に, 頃から, 頃まで, 予想, そうです, そうな, 期待, 向かう, はず, だろう]   # 「頃」だけは「見頃」に当たるので使わない
  point_words: [時点, 現在, 発表, でした, ていました, とされ, の記録, 発信, 伝えて]

# 段階76 第5部 4: この形で止める問いかけ(読む人への質問だけ。「どちらも…ご確認ください」のような案内は止めない)
question_re: '([?？]\s*$|(ますか|ませんか|でしょうか|ですか|しますか|しましょうか)[。]?\s*$|どちらにしますか|いかがですか|いかがでしょう)'
# 段階76 第5部 2: 文中に入れない長い断り(公式かどうかは最後の出典で分かる)
long_disclaimers: [紹介サイトの記載で、公式ではありません, の記載で、公式ではありません, (公式ではありません), （公式ではありません）, とのことで、公式ではありません, 、公式ではありません]   # 段階78: 「紹介サイトによると、とのことで、公式ではありません。」
# 公式として扱うホスト(段階76 第5部 1)。霧ヶ峰自然保護センター: 長野県が設置、指定管理者の諏訪観光協会が運営(https://www.kirigamine-vc.jp/about。2026-11-10 確認)
official_hosts: [kirigamine-vc.jp]

# 最終の文の出典の並び
final:
  sources_heading: 出典
  official: 公式
  not_official: 公式ではありません
  card_note: '{date}に確認'
  fact_note: '{date}時点'

# 資料の「決まり」(AI に渡す。指示書 0.3 の事実の決まりを短く)
rules:
  - ウェザーニュース(転載を含む)・tenki.jp・日本気象協会の予想と、SNS の投稿は使わない。
  - 山と溪谷オンラインは、状態の語・日付・URL だけ。
  - 行事(まつり・ライトアップなど)の期間を、例年の見頃や今の色づきとして書かない。
  - 範囲は横浜から片道250km前後。範囲の外の場所を書かない。
  - 今年の現況・日付・行事の名前と期間・開園時間・休園日・料金・電話・通行止め・特定の名所の例年の時期は、確かめた事実にあるときだけ書き、文の終わりに印 [F001] / [K001] を付ける。
  - 確かめた事実にないことは「今年の状況は確かめられていません」のように書くか、書かない。
  - 内部の言葉(資料・カード・記録・検査・id など)と作業の事情を答えに書かない。答えの最後に質問を書かない。
  - '答えの最後に [場所] の一覧を書く(記録: 確かめた場所 / 知識: 自分の知識で添えた場所(都県)。3か所まで)。'

# ---- 段階78 ----
# 第1部 3: 距離は直線と明記する。東京湾をはさむ場所(千葉県の内房・外房・南房総)は距離の数字を書かない。
#   北緯 max_lat より南の千葉県を「東京湾の向こう側」とする(木更津 35.38・館山 34.99・勝浦 35.15、市原 35.50 は含めない。Claude Code が市役所の位置で概算。provisional)
distance:
  straight_label: 直線で約{km}km
  across_bay_label: 東京湾の向こう側(距離の数字は書かない)
  across_bay:
    prefecture: 千葉県
    max_lat: 35.45                # 座標があるとき
    origin_prefectures_not: [千葉県]
    # 市町村(座標がないとき)。内房・外房・南房総(Claude Code が地図の一般的な区分で選んだ。provisional)
    municipalities: [木更津市, 君津市, 富津市, 袖ケ浦市, 館山市, 南房総市, 鋸南町, 鴨川市, 勝浦市, いすみ市, 御宿町, 大多喜町, 一宮町, 睦沢町, 長生村, 白子町, 長柄町, 長南町, 茂原市]
  estimated_label: 距離は未計算
# 第2部 2・3: 種の質問の名所の一覧(資料に入れる数。古い・あいまいな時期の名所も入れて、その旨を書く)
# 段階79 第1部 5: 日付のない今年の現況の事実(ブログの分類の題名「2026年の野鳥公園(45種)」など)を、書き手が「小さな園なので…」のように
# 読み違えた。いつの記録か分からないことを、事実の文そのものに書く
current_undated: "{name}: 公式の発信に「{state}」とある({publisher}。いつの記録かは資料にない。今の様子の根拠にしない)"
species_rows:
  routes_skip: [difference, name, event, species_dated, highlights_dated]
  max_known: 12
  max_unknown: 8
  # 段階79 第1部 3: 時期の分かる名所がこの数以上あるときは、時期の記載のない名所を資料に入れない(熱海梅園がスイセンとロウバイの両方で出た)
  drop_unknown_when_known: 4
  vague_note: 例年の時期の記載があいまい
  old_note: 古い年の記載
  label: 種の名所(例年の時期)
  # 段階78 の追記(本人の指示 2026-11-11): 日付の指定がない種の質問では、時期の分かる名所を「今から近い順」だけで選ばず、
  # まとまりごとに枠を分けて順に 1 件ずつ取る(どのまとまりも 0 件にしない)。まとまりは、種ごとの表(kinds が名所の種に当たり、
  # 始まりの月日が from〜to に入るもの。種で決まらなければ月日だけで決める)。表のない種は、始まりの月ごとのまとまり(早い月から遅い月まで偏らない)
  spread:
    # 全体の目安の文(まとまりの表がある種)。表のない種は、今までの形の答えと同じ文(season_place.yaml の text.lead)を、資料に入った名所の時期から作る
    text:
      lead_groups: "{name}は、例年の目安がまとまりごとに違います: {parts}。"
      part: "{group} {start}月〜{end}月"
      part_one: "{group} {start}月"
      sep: "、"
      none: "{name}の例年の時期は、資料の名所では分かりません。"
    groups:
      桜:
        - {name: 冬桜, from: '09-01', to: '12-31', kinds: [冬桜, 十月桜, 四季桜, 子福桜]}
        - {name: 早咲き, from: '01-01', to: '03-10', kinds: [河津桜, 寒桜, 寒緋桜, カンヒザクラ, 元朝桜, 大寒桜, 椿寒桜, 修善寺寒桜, おかめ桜, 頼朝桜, 安行寒桜, 玉縄桜, 早咲きの桜]}
        - {name: 春の桜, from: '03-11', to: '04-15', kinds: [ソメイヨシノ, 染井吉野, ヤマザクラ, 山桜, しだれ桜, 枝垂れ桜, タカトオコヒガンザクラ, コヒガンザクラ, オオシマザクラ, 桜]}
        - {name: 遅咲き, from: '04-16', to: '06-30', kinds: [八重桜, 里桜, 御衣黄, 鬱金, 関山, 普賢象, 一葉]}
# 第1部 4: 代わりの行き先(例年の目安の候補)を添えるのは、場所を聞いていて、その場所が今は楽しめないときだけ。種を聞く質問には付けない
alt_place_routes: [highlights, highlights_dated, town, unknown_place]
# --prev: 引き継いだ事実は、次の質問にはもう引き継がない(質問をまたいで関係のない事実が積もらないように)
prev_one_level: true
# 第1部 5: 都道府県のドメイン(pref.<ローマ字>.lg.jp / pref.<ローマ字>.jp)の名前
pref_romaji: {hokkaido: 北海道, aomori: 青森県, iwate: 岩手県, miyagi: 宮城県, akita: 秋田県, yamagata: 山形県, fukushima: 福島県, ibaraki: 茨城県,
  tochigi: 栃木県, gunma: 群馬県, saitama: 埼玉県, chiba: 千葉県, tokyo: 東京都, kanagawa: 神奈川県, niigata: 新潟県, toyama: 富山県, ishikawa: 石川県,
  fukui: 福井県, yamanashi: 山梨県, nagano: 長野県, gifu: 岐阜県, shizuoka: 静岡県, aichi: 愛知県, mie: 三重県}
# 第2部 1: エリア・山域の質問(見どころの経路)では、そのエリアの名所の計画(今年の現況・例年の時期)も資料に入れる。計画を作る質問の形
area_plan_question: '{date}、{area}の紅葉や花や野鳥のおすすめ'
area_plan_max: 8
# 第1部 1・第3部 3: 答えの先頭・末尾の作業の説明と英語の文
work_note_words: [下書き, 合格, そのまま送, 送ります, 照合, 書き直, 検査に, 資料から, ask verify, ask brief]
english_re: '[A-Za-z]{2,}(?:[ ,;:\-]+[A-Za-z]{2,}){2,}'
# 第3部 1: 語りの材料。カードの文を種類に分ける語(上から順に当てる)と、分類の既定(Claude Code が分類の意味から決めた。provisional)
narrative:
  kinds: [なぜ今, どこをどう見る, 見分け方, 次の季節]
  other: その他
  none: 材料なし
  max_items: 8
  min_items: 4
  per_kind_max: 3
  extra_cards: 4                 # 材料が min_items より少ないときに足すカードの上限
  min_items_to_require: 2        # 第3部 3: この数以上の材料があるのに 1 点も使わない答えは不合格
  skip_routes: [name, event]     # 行事の質問と、名前だけを聞く短い質問は除く
  md_note: 'ここから選んで文にする(1つの答えで2〜4点。使ったら文の終わりに [K…])。「材料なし」の種類は書かない。'
  word_rules:
    - {kind: 見分け方, words: [違い, とは違, 見分け, 区別, 似て, 比べ, 異なる, 見た目, 特徴は, とは別, 別の種, ではなく]}
    - {kind: 次の季節, words: [このあと, その後, 続いて, やがて, 翌年, 翌春, 冬になると, 春になると, 夏になると, 秋になると, 散ったあと, 終わると, 終わったあと, 次は, 落葉後, 冬を越]}
    - {kind: どこをどう見る, words: [朝, 夕方, 夕暮れ, 時間帯, 足元, 梢, 水面, 双眼鏡, 見上げ, 見下ろ, 探す, 探し, 歩くと, 歩き, 近づかず, 観察する, 見つけ, 耳を, が見える, 見渡せ, 沿いで]}
    - {kind: なぜ今, words: ['ため(に)?', 寒さ, 気温, 標高が高, 標高の高, 高いところ, 低いところ, 渡って, 渡り, 越冬, 冷え込み, 日照, 寒暖, 霜, 雪解け, 北から, 南から, 凍って, 凍る, 仕組み]}
  # 材料にしない文(行事・開園・料金・観測の決まりなど、語りではない事実。年・時刻・金額のある文も材料にしない)
  not_material_re: 'ライトアップ|開園|閉園|料金|駐車|問い合わせ|電話|標本木|観測する|観測は|観測の|定義|指定され|登録され|開花日|紅葉日|落葉日|満開日|対象は原則|最初の日'
  # 段階79 第1部 4: 材料の場所に「どこの話か(都県と市区町村)」を付ける。広い山域・湖・湿原は都県だけ(1 つの市町村に決めない)
  wide_place_re: '(山|岳|峠|山地|連峰|高原|アルプス|霞ヶ浦|遊水地|湿原|尾瀬|ヶ原|五湖)$'
  by_category: {季節の仕組み: なぜ今, 夜・天気・自然現象: なぜ今, 見頃の流れ: 次の季節, 出会い方・歩き方: どこをどう見る, 行き方・歩き方: どこをどう見る}
# 第4部: その場で調べる(本人の判断 2026-11-11。段階78 指示書 4)
research:
  dir: research                      # データ置き場の下(取得の控え・調べた記録の一覧・承認待ちの情報源の候補)
  max_pages_per_question: 3          # 1 つの質問で取得するページの上限
  max_seconds_per_question: 120      # 1 つの質問で、最初の取得からこの秒数を過ぎたら取得しない
  min_interval_s: 1                  # 同じホストへの間隔
  declared_publisher_re: '(観光協会|観光連盟|観光推進機構|観光物産協会|観光コンベンション協会|市|町|村|県|都|府|省|庁|事務所|公園|管理センター|管理事務所|ビジターセンター|博物館|植物園|財団)$'   # --publisher の名前の形(公式に当たる発行元)
  max_requests_per_page: 4           # 1 ページの取得の通信の上限(robots.txt と本文、同じサイトへの転送を 1 回ずつ)
  cache_days: 7                      # 同じ URL の取得の控えを使う日数
  max_bytes: 3000000                 # 1 ページの大きさの上限
  max_text_chars: 12000              # 標準出力に出す本文の字数の上限(全文は控えのファイル)
  min_species_rows: 2                # 聞かれた種の名所がこの数より少ないと「調べる」
  kinds: [flowers, birds]            # 記録の対象(observations の subject)
  fields: [name, prefecture, city, kind, typical, notice, url, publisher]   # 記録してよい項目(今年の現況は記録しない)
  forbidden_fields: [state, state_date, state_date_text, current, practical]
  event_period_re: 'まつり|祭|開催|イベント|ライトアップ|期間中'   # 段階78 第7部: 行事の期間を例年の時期として記録しない
  omitted_month_re: '\d+月(上旬|中旬|下旬|初旬|末)〜(上旬|中旬|下旬|末)'   # 段階78 第6部の続き: 「4月上旬〜下旬」は前半しか読まれないので、後ろの月を省かない(「4月上旬〜4月下旬」)
  step_lines:
    - '1. 公式ページの URL を Web 検索で探す(検索の要約を事実にしない。行き先探しだけ)。読んでよいのは自治体・観光協会・公園管理者・施設運営者(指定管理者を含む)・国や県の機関のページ。'
    - '2. python -X utf8 -m ikimonobiyori.ask research fetch <URL> --brief {id} で本文を読む(1 つの質問で 3 ページ・2 分まで。robots.txt で拒否されたページ・公式でないページは読まない)。'
    - '3. 本文で確かめた名所の名前・都県と市町村・見られる種・例年の時期・行く前の注意だけを、ask research record --brief {id} --file <JSON> で記録する(今年の現況・行事の今年の日付は記録しない)。'
    - '4. ask brief を作り直して(同じ質問)、いつもの手順で書く → ask verify。Web を使えない環境では、この節を飛ばして今の資料で答える。'
# 第5部: 足りなかったことの記録
gaps:
  file: logs/gaps.jsonl
  sources_heading: 出典
  answer_words: [確かめられていません, 確かめていません, 分かっていません, 分かりません, 確認できていません, 確認していません, 記録は多くありません]
  skip_missing_re: 'についての確かめた事実は [1-9][0-9]* 件'    # 事実が 1 件以上ある場所の数の報告は、足りないものにしない
  max_chars: 120
