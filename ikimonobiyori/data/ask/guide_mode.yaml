# 段階75: 「ガイドが書き、コードが裏を取る」形(試作)の設定。ask brief(guide_brief.py)・ask verify --brief(guide_verify.py)が読む。
# 値の理由: 試作の初期値(provisional)。本人が比較(docs/stage75-report.md)を読んで決める。
schema: ikimonobiyori-guide-mode/1

# 答えの形の切り替え。classic = 今までの形(ask answer の出力をそのまま)。guide = 新しい形(ask brief → 書く → ask verify)。
# 既定は今までの形(指示書 3.4)。guide にしても ask answer の答えは変わらない(標準エラーに資料の場所と手順の 1 行を足すだけ)。
answer_form: classic
answer_forms: [classic, guide]

brief_dir: briefs                 # データ置き場の下
max_candidates: 12                # 資料に入れる候補の数(順位の上から)
max_cards: 12                     # 資料に入れる知識カードの数
max_prev_facts: 40                # --prev で引き継ぐ事実の数

rewrites:
  max: 2                          # 書き直しは 2 回まで(3 回目の不合格で今の ask answer の答え)
length:                           # 長さの目安(合否には使わない。結果に警告として出す)
  min: 400
  max: 900
knowledge_places:
  max: 3                          # AI の知識で添える場所は 1 つの答えに 3 か所まで
  unverified_words: [確かめていません, 確かめていない, 確かめられていません, 確認していません, 確認できていません, 未確認, 確かめてから, 確かめてください]
  theme_default: その他

# 確かめた事実の種類(資料の kind)
kinds:
  current: 今年の現況
  typical: 例年の目安
  event: 行事
  facility: 施設
  safety: 安全・規制
  other: その他の記録

# 答えの行から事実の種類を決める語(上から順に当てる)
line_kinds:
  - kind: safety
    words: [通行止め, 閉鎖, 規制, 一方通行, 立入禁止, 運休, 通行禁止, 注意, 危険, クマ, 入山]
  - kind: event
    words: [まつり, 祭り, 祭, 開催, ライトアップ, 観察会, 講座, イベント, 展示, 菊花, 申込, 定員, 締切, 募集]
  - kind: facility
    words: [開館, 開園, 休館, 休園, 料金, 入園, 入館, 円, 電話, 営業, 駐車場]
  - kind: current
    words: [時点, 現在, 今の状況, 今年, 記録です, 発信]
  - kind: typical
    words: [例年, 平年, 見頃の時期, ごろから, 月まで]

not_current_words: [確認できていません, 分かりません, 記録がありません]   # 今年の情報がない旨の行は「例年の目安」(今年の現況にしない)
line_skip_words: [可能性があります, 選びました, 対象の日は, 見込みです, 確かめてください, 直線距離です, 距離で選びました]   # 見込み・選び方・案内の文は事実ではない
not_publisher_words: [植物, 踏み, 弱い, 確認, 時点, 例年, 主催者, 公式ではありません, 紹介サイト, 約]   # 行の終わりの括弧が発行元でない語
publisher_name_re: '(省|庁|事務所|県|都|府|市|町|村|協会|センター|博物館|公園|財団|機構|管理|研究所|環境省|観光|ビジターセンター|保護)$'   # 括弧の語を発行元とみなす形(区・地名・文は除く)
official_name_re: '(省|庁|事務所|県|都|府|市|町|村)$'    # URL のない発行元で、国・自治体の名前は「公式」
min_plain_line_chars: 12          # 腐りやすい値のない行は、この字数以上のときだけ事実にする(短い見出し・語だけの行を除く)

# 状態の語(照らす対象)。norm で表記をそろえる(左を右に置き換える)
state_words: [見頃, 見ごろ, みごろ, 色づき始め, 色づきはじめ, 色づき進む, 色づきすすむ, 色付き, 色づき, 散り始め, 落葉, 終盤, 見頃終盤, 真っ盛り, 最盛, 盛り, 咲き始め, 咲きはじめ, 開花, 満開, 五分咲き, 散り, 青葉, 終わり, 咲いています, つぼみ, 飛来, 渡来, 見られています, 確認されています, 観察されています]
state_norm:
  見ごろ: 見頃
  みごろ: 見頃
  はじめ: 始め
  すすむ: 進む
  色付き: 色づき
  咲きはじめ: 咲き始め
now_words: [今週末, 来週末, 今週, 今年, 現在, 今日, 明日, この週末, 時点, 今の, 今は, いまは, いまが, いまの, 今、, 今が, 今も, 今ちょうど]
event_words: [まつり, 祭り, 紅葉祭, 開催, ライトアップ, 観察会, 講座, イベント, 展示会, 菊花展, 特別開園, 申込, 定員, 締切]
period_words: [期間, まで, から, 〜, ～, 中旬, 上旬, 下旬]
closure_words: [通行止め, 閉鎖, 規制, 一方通行, 立入禁止, 運休, 通行禁止, 休園, 休館]

# 下書きの形(印と場所の一覧)
draft:
  marker_re: '\[([FK]\d{3,})\]'
  places_heading: '[場所]'
  places_record: '記録:'
  places_knowledge: '知識:'

# 今までの検査の部品のうち、この形では印の照合が受け持つもの(骨組み用。電話は印の事実と照らす)
skip_reused_codes: [phone_not_from_official]

# この形の答えに出さない内部の言葉(今までの検査の語に足す)
guide_internal_words: [資料, 知識カード, カード, 記録によると, 記録では, 記録にある, 記録にない, 記録上, 検査, 裏取り, brief, id, ID, '[F', '[K']
# 今の状態の語があっても、確かめていない・少ないと正直に書いた文は合格(指示書 3.2 の例外の扱い。段階75 の判断)
honest_words: [分かっていません, 分かっていない, 確かめられていません, 確かめていません, 確認できていません, 確認していません, 分かりません, 多くありません, 少なく]
# 例年の目安の事実を根拠に、この語で始まる・含む文は「例年の話」(今の状態の文として扱わない)
typical_words: [例年, 平年, 毎年]

# 最終の文の出典の並び
final:
  sources_heading: 出典
  official: 公式
  not_official: 公式ではありません
  card_note: '{date}に確認'
  fact_note: '{date}時点'

# 資料の「決まり」(AI に渡す。指示書 0.3 の事実の決まりを短く)
rules:
  - ウェザーニュース(転載を含む)・tenki.jp・日本気象協会の予想と、SNS の投稿は使わない。
  - 山と溪谷オンラインは、状態の語・日付・URL だけ。
  - 行事(まつり・ライトアップなど)の期間を、例年の見頃や今の色づきとして書かない。
  - 範囲は横浜から片道250km前後。範囲の外の場所を書かない。
  - 今年の現況・日付・行事の名前と期間・開園時間・休園日・料金・電話・通行止め・特定の名所の例年の時期は、確かめた事実にあるときだけ書き、文の終わりに印 [F001] / [K001] を付ける。
  - 確かめた事実にないことは「今年の状況は確かめられていません」のように書くか、書かない。
  - 内部の言葉(資料・カード・記録・検査・id など)と作業の事情を答えに書かない。答えの最後に質問を書かない。
  - '答えの最後に [場所] の一覧を書く(記録: 確かめた場所 / 知識: 自分の知識で添えた場所(都県)。3か所まで)。'
