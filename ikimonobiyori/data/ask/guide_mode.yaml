      lead: "今年の現況の幅(14 日)より前の、公式の記録です。今の様子として言い切らず、「○月○日時点では見頃でした。その後の様子は確かめられていません」の形で、日付つきで書く。並べる順は 今年の現況 → 少し前の様子 → 例年の目安 → 未確認。"
      later_unknown_words: [その後, 確かめられていません, 確かめていません, 確認できていません, 分かりません]
      fix: "「○月○日時点では見頃でした。その後の様子は確かめられていません」の形で、日付と、その後の様子が分からないことを同じ文に書く"
    max_known: {value: 20, source: "資料に並べる手元の今年の現況の数の上限(仮置き。2026-11-28 の写しで、花の開いた質問の日付つきの記録は 11 件)", provisional: true}
    max_searches: {value: 8, source: "指示書 open-question-breadth 1-3(1 問あたり検索 8 回の初期値。第 5 部の試しで見直す)", provisional: true}
