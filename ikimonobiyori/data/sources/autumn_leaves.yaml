# 紅葉の現況を発信する公式ページの台帳(ikimono-status-sources/1)。段階15(docs/design.md §0、docs/data-sources.md §7)。
# 2026-10-23 に Claude Code が各ページを 1 回読んで、readable・notation・terms を確かめた(WebFetch。ページを取得して要約モデルが質問に答える道具。
#   原文そのものとの照合は人の目でしていない)。読んだ結果の状態そのもの(今年の値)はここに書かない(記録は IKIMONOBIYORI_DATA_DIR の下)。
# notation.map には、読んで確かめた書き方だけを書いた(見ていない書き方を推測で足さない)。
# 承認: 指示書の条件(公式・読めた・利用条件が要約や出典つきの事実の利用を禁じていない)を満たすものを Claude Code が仮承認した(フェーズ 2)。
#   2026-10-23 にユーザーが見直し、承認済みはすべてユーザーの承認(approved_by: user)に切り替えた。伊勢原市は pending に戻した。一覧は docs/stage15-review.md。
