# 情報源の台帳・現況の記録・「今週末のおすすめ」の手順の方針(段階15。docs/design.md §0)。
# ikimonobiyori/sources.py はここから読み、コードに値を持たない。各値に出典または理由と provisional を付ける。
schema: ikimono-sources-policy/1

# 段階の並び(段階16 B-1)。対象ごとの段階(id・呼び方)の正本は、各プロファイル(profiles/<対象>.yaml)の stages。
# sources.load_policy() がプロファイルから stages を読み込み、policy["stages"][<対象>] に置く(ここには書かない)。
# 共通の順番: 対象ごとの段階は、この order のどれかに対応する(プロファイルの stages.items[].order)
common_stages:
  source: "指示書(段階16 B-1、2026-10-23 ユーザー承認): 0 前、1 始まり、2 見ごろ、3 最盛、4 終わり"
  provisional: true
  items:
    - {order: 0, label: 前}
    - {order: 1, label: 始まり}
    - {order: 2, label: 見ごろ}
    - {order: 3, label: 最盛}
    - {order: 4, label: 終わり}

# 質問の型③「どの段階まで」(段階16 B-4)。既定は見ごろ・最盛。「早めに・始まりも」で始まりを、「終わりかけでも」で終わりを足す
stage_scope:
  source: "指示書(段階16 B-4)"
  default: [2, 3]
  early: [1]
  late: [4]

# 質問の型①「いつ」(段階16 B-4): 読んだ日からこの日数より先の日は、公式の現況では答えず、公式の見頃予測と例年の時期だけで答える(そう明記する)
horizon_days: {value: 14, source: "指示書(段階16 B-4): 14日より先は、公式の見頃予測と例年の時期だけで答える", provisional: true}

# 新しさ: 公式の更新日から、読んだ日(または答える日)までの日数で分ける
freshness:
  fresh_max_days: {value: 3, source: "指示書(段階15): 3 日以内は『新しい』", provisional: true}
  somewhat_old_max_days: {value: 7, source: "指示書(段階15): 7 日以内は『やや古い』、それより古いものは『古い。参考程度』", provisional: true}
  labels: {fresh: 新しい, somewhat_old: やや古い, old: 古い。参考程度, unknown: 更新日不明, year_unknown: 新しさ不明}
  # 年のない「M/D現在」の年の補い方(段階17 の見直し、2026-10-24 ユーザーの判断): 同じ地点に年つきの最終更新日があるときは、
  # 「現在」の日付が更新日以前で、この日数以内に収まる年を選ぶ(記録の印は observed_year_inferred: from_same_item_update_date)。
  # 年つきの日付がないもの(箱根など)は補わず「新しさ不明」のまま
  observed_year_from_update_max_days: {value: 60, source: "ユーザーの判断(段階17 の見直し、2026-10-24)", provisional: true}
  observed_year_from_update_mark: from_same_item_update_date
  # 年のない更新日(台帳の notation.year_shown: false。読んだ人が年を補ったもの)は日数で分けず year_unknown にする
  #   (ユーザーの見直し 2026-10-23: 箱根町観光協会。前年の日付かもしれないので、新しい・やや古いと判定しない)

# 候補の絞り込み: 名所カタログの例年の時期(typical_window)に対象の日が入っている、または前後これだけの日数以内
candidates:
  window_margin_days: {value: 7, source: "指示書(段階15): 例年の時期の前後 1 週間以内", provisional: true}

# 答えの形: おすすめの件数
recommend:
  top_min: {value: 3, source: "指示書(段階15): 上位 3〜5 か所", provisional: true}
  top_max: {value: 5, source: "指示書(段階15): 上位 3〜5 か所", provisional: true}

# 答えの形(段階17 フェーズ1。ikimonobiyori/answer.py が答えの下書きを組み立てるときに使う)。
# 結論(今回のおすすめ)を先に、根拠 → 注意 → 公式の現況を読めていない名所 の順。同じ名所は 1 か所にだけ出す。日付は地点ごとに 1 つ
answer:
  source: "指示書(段階17 フェーズ1、2026-10-24 ユーザー承認)"
  # 答えの本文に出してはいけない内部用語(指示書のとおり。URL の中は数えない)
  forbidden_terms: [reader, code, record, 規則, access_notes, v0, 台帳, approved, pending, provisional, status_log, read_plan, out_of_season]
  headings: {recommend: 今回のおすすめ, evidence: 根拠, notes: 注意, unread: 公式の現況を読めていない名所}
  # おすすめの一言の理由。{stage} は段階の呼び方、{forecast} は公式の見頃予測の原文
  reasons:
    in_scope: "公式で「{stage}」"
    forecast: "公式の見頃予測「{forecast}」が対象の日にかかる"
    latest: "公式の最新の記載"
  none_found: "公式の情報で、対象の日におすすめできる名所は見つかりませんでした。"
  # おすすめの見出し(段階17 の見直し、2026-10-24 ユーザー承認)。始まり・終わりも含めるときは段階ごと、対象の日が先のときは見頃予測の見出しを足す
  stage_headings: {default: 見ごろ〜最盛, early: 始まり(早めに), late: 終わりかけ, ahead: 対象の日に公式の見頃予測の時期}
  ahead_min_days: {value: 7, source: "ユーザーの指示(段階17 の見直し、2026-10-24):『来週末など対象の日が先のとき』。対象の最初の日が読んだ日から 7 日以上先", provisional: true}
  # 状態が書かれていない発信(谷川岳など)・参考リンク(段階17 の見直し)
  no_state: "公式ページに今の状態の記載がありません"
  reference_link: "参考(公式ページ)"
  unread_no_url: "公式の現況のページがまだありません"
  human_url: "公式ページ(ご自身で開いてください)"
  typical_window: "例年 {start}〜{end}"
  # 年のない日付(箱根など)を「○/○時点」と書くときに添える
  year_unknown_suffix: "(年の記載なし)"
  stale_display: "表示が昨シーズンのままの可能性があります。おすすめに使っていません"
  # 干潟の名所(名所カタログの related_urls に tide_table)を答えに出すときに添える(段階17 フェーズ3。潮位表は読まない)
  tide_note: "潮の時刻は公式表で確かめてください(気象庁 潮位表)"
  # 季節の前の名所(候補の upcoming_windows): 例年の時期の始まりを添える(段階16 C)
  upcoming: "例年の時期はこれから({month}月{day}日ごろから)"
  upcoming_within_days: {value: 30, source: "仮置き(段階17 フェーズ7)。来年の時期まで並べないため、対象の日から 30 日以内に始まる名所だけ添える", provisional: true}
  # 要約の道具で読んだ記録を使ったとき(段階17 修正①)・読んだ事実を記録できなかったとき(修正④)に出す 1 行
  simple_read_note: "今回は簡易な読み取りです。表記のぶれがありえます"
  record_failed_note: "読んだ結果を記録できませんでした"
  conflict: "読み方によって状態が食い違っています。公式ページをご自身でご確認ください"
  # 気温からの推定(v0 の出力)を答えに書くときの呼び方(内部の呼び名 v0 を出さない)
  aux_estimate_label: "気温からの推定(未検証。答え合わせで不合格)"

# 補助の推定: 現況がない名所だけに、v0 の気温判定(biyori-proposal/1 の出力)を添えるときの書き方(段階15 決定 D-06)
aux_estimate:
  label: "推定(未検証・段階14で不合格)"
  source: "指示書(段階15): 現況がない名所の補助として『推定(未検証・段階14で不合格)』と明記して出す"

# 読んだ結果の記録(IKIMONOBIYORI_DATA_DIR の下。config.yaml の status_log.dir)。事実だけを残す(本文の写し・写真は残さない)
record:
  schema: ikimono-status-record/1
  # 記録に入れてよい項目(これ以外は拒否する。本文の写しを入れる欄を作らない)
  fields: [schema, subject, source_id, site, name, label, official_state, stage, official_updated, updated_year_inferred, read_at, url,
           method, official_forecast, event_start, event_end, erroneous, erroneous_reason, corrected_on,
           unmarked_on, unmarked_reason, user_checked_on, method_note,
           official_observed, observed_year_inferred, freshness_basis, read_by]
  # 新しさの基準(段階17 修正⑤): ①ページが示す現地の状態の日付(「10/22現在」など。official_observed)、②なければ最終更新日(official_updated)。
  # どちらを使ったかを freshness_basis に残す。日付が 1 つだけの情報源は、その日付の種類を台帳の notation.date_basis に書く(既定は updated_date)
  freshness_bases: [observed_date, updated_date]
  # 読み方(method)→ read_by(段階17 修正④)。summary = 要約の道具で読んだ(答えに「簡易な読み取り」と書く)
  read_by: {agent_summary: summary, assistant_webfetch: summary, code: code, user_verified: user}
  # 読み方(記録の method)。agent_summary = エージェントが要約の道具(WebFetch など)で読んだ(段階15。method がない記録もこれ)、
  # code = 決まった形を読むコードで読んだ(段階16 A-4。日光・箱根だけ)、user_verified = ユーザーが原文を確かめた(段階16 A-1)
  # assistant_webfetch = 別の会話のアシスタント(Claude)が WebFetch で読んだもの。古いページ(キャッシュ)の可能性があり、ユーザーの確認として扱わない
  #   (段階16 の見直し 2026-10-23。湖尻の「まだまだ、10/15現在」は user_verified と書いたが、実際はこれだった)
  methods: [agent_summary, code, user_verified, assistant_webfetch]
  default_method: agent_summary
  # 誤りの印(段階16 A-1)。誤った記録は消さずに erroneous: true・理由・訂正日を付ける。印の付いた記録は読む処理が使わない
  erroneous_fields: [erroneous, erroneous_reason, corrected_on]
  # 記録の直し方(段階16 の見直し): amend_records で直せる項目だけ。事実(状態・更新日・地点)は直さない(直すなら誤りの印を付けて新しい記録を足す)
  #   unmarked_on・unmarked_reason は誤りの印を外したときの記録(外した印は消すが、外した理由と日を残す)。user_checked_on はユーザーが目で確かめた日
  amendable_fields: [method, method_note, user_checked_on]
  # 公式の状態の原文(記号・語)の長さの上限(文字)。本文の写しを防ぐための仮置き(根拠のある値ではない。記号 1 字〜「色づきはじめ」程度の語を想定)
  max_state_chars: {value: 20, source: "仮置き(段階15)。本文を写さないための上限", provisional: true}
  # 地点の書き方(公式ページでの地点名)の長さの上限(文字)。仮置き(「【湯西川・川俣・奥鬼怒】湯西川水の郷」程度を想定)
  max_label_chars: {value: 40, source: "仮置き(段階15)。本文を写さないための上限", provisional: true}
  # 公式の見頃予測の原文(「10月下旬～11月上旬(木の種類により異なります)」程度)の長さの上限(文字)。仮置き(段階16 A-8)
  max_forecast_chars: {value: 60, source: "仮置き(段階16)。本文を写さないための上限", provisional: true}

# 記録の再利用(段階16 A-2): 読んだ結果は、読んだ日(その記録の時刻のオフセットでの暦日)と同じ日のうちだけ答えに使う。日をまたいだら読み直す
reuse:
  same_day_only: true
  source: "指示書(段階16 A-2)"

# 質問の話題 → 答える対象(段階17 修正⑦)。「野鳥全般」の質問は、通年の探鳥地(birds)と冬鳥の飛来地(wintering_birds)の両方で答える
topics:
  source: "指示書(段階17 フェーズ3・4、2026-10-24 ユーザー承認)"
  items:
    野鳥: [birds, wintering_birds]
    鳥: [birds, wintering_birds]
    探鳥: [birds, wintering_birds]
    白鳥: [wintering_birds]
    冬鳥: [wintering_birds]
    紅葉: [autumn_leaves]
    花: [flowers]
    お花: [flowers]

# 未実装の対象を聞かれたとき(段階17 修正⑩)。関係のない実装済みの対象を並べず、答えられない理由と、足すとどうなるかを 1〜2 文で。
# 近い対象(related)が答えられる対象なら、それだけを示す
unimplemented:
  source: "指示書(段階17 フェーズ3 の 5)"
  text: "{name}は、まだお答えできません(公式の情報源と名所の一覧をまだ作っていないため)。足すと、現地の公式な発信(公園・自治体などの現況のページ)を読んで、今の状態と場所をお答えできるようになります。"
  related_text: "近い対象の「{related}」ならお答えできます。"
  related: {cherry_blossom: flowers, higanbana: flowers, sunflower: flowers}

# データ源の利用条件の確認の状態(段階17 修正⑦の 4)。答えを組み立てるときはここを読む(未確認と答えない)。正本の記録は docs/data-sources.md
data_terms:
  inaturalist: {status: user_confirmed, checked_on: "2026-10-21", ref: "docs/data-sources.md §3", note: "ユーザーが規約と API の推奨手順を確認し、集計値だけを使う使い方は適合と判断。Claude Code は原文を読めていない(HTTP 403)。実通信は計測フックの下で、その場の承認があるときだけ(CLAUDE.md 規則 6)"}

# 和暦(段階17 修正⑥): 月ごとの記事の見出し(「令和8年10月の白鳥の渡来状況」)を作るため。令和元年 = 2019 年
japanese_era:
  name: 令和
  first_year: {value: 2019, source: "元号を改める政令(平成31年政令第143号): 2019年5月1日から令和", provisional: false}

# 公式の見頃予測の「上旬・中旬・下旬」→ 日の範囲(段階16 A-8)。下旬の終わりは月末
# 出典: 気象庁 予報用語「上旬: 1日から10日まで、中旬: 11日から20日まで、下旬: 21日から月末まで」
month_thirds:
  source: "気象庁 予報用語(時に関する用語)https://www.jma.go.jp/jma/kishou/know/yougo_hp/toki.html"
  provisional: false
  items:
    上旬: {first: 1, last: 10}
    中旬: {first: 11, last: 20}
    下旬: {first: 21, last: null}
