# 紅葉の名所カタログの下書き(段階14b。ikimono-site-catalog/1 の形)。docs/design.md §5、docs/stage14b-review.md。
# 本番のカタログ(../autumn_leaves.yaml)とは分けて置く。承認された件だけを、承認の後に本番のカタログへ移す(docs/stage14b-decisions.md D-13)。
# 検査: python -X utf8 -m ikimonobiyori.catalog check --catalog-dir ikimonobiyori/data/catalog/drafts
# 公式ページ(自治体・観光協会・管理者)を Claude Code が読み、事実だけを自分の言葉で短く書いた。ページの文章は写していない。自動収集はしていない。
#   point: 代表点の座標は、公式ページの所在地をもとに Claude Code が推定した値(公式ページに座標はない)。elevation_m はその座標の Open-Meteo Elevation API の値(2026-10-22 取得)。どちらも要確認。
#   typical_window: 公式ページの「上旬・中旬・下旬」を 01〜10 日・11〜20 日・21 日〜月末に直した(D-14)。元の書き方は note に残す。
#   sources[].checked_on は Claude Code がページ本文を読めた日。本文を読めず検索結果の要約でしか確かめられなかった出典には checked_on を付けていない(note に書いた)。
#   id の kouyou-0004(丸沼高原)と kouyou-0016(御岳渓谷)は見送りのため欠番。
schema: ikimono-site-catalog/1
subject: autumn_leaves
note: "段階14b の下書きのうち、保留(承認結果が未記入)のものだけ。承認された件は本番のカタログに移した(2026-10-22)。却下はなし"
entries:
  - id: kouyou-0003
    name: 中禅寺湖・いろは坂(中禅寺温泉付近)
    subjects: [autumn_leaves]
    timing_type: temperature
    kind: area
    point: {lat: 36.738, lon: 139.501, elevation_m: 1284}
    location_precision: exact
    typical_window: {start: "10-11", end: "11-10", source_url: "https://www.nikko-kankou.org/flowering/autumn-leaves", note: "公式の「見頃予測」: 中禅寺湖・華厳滝、いろは坂とも10月中旬〜11月上旬(例年値か今年の予測かは明記なし)"}
    official_status_url: "https://www.nikko-kankou.org/flowering/autumn-leaves"
    access_notes: "いろは坂は紅葉期に渋滞しやすく、普段約20分の上りが2〜3時間、連休に最大6時間かかった例がある。中禅寺湖の駐車場は奥日光県営駐車場(栃木県のページ)"
    status: candidate              # 保留: 中禅寺湖: 承認結果に判定の記入がなかった(時期が例年値か今年の予測かの回答も未記入)
    sources:
      - {url: "https://www.nikko-kankou.org/spot/12", title: "日光市観光協会 中禅寺湖", checked_on: "2026-10-22"}
      - {url: "https://www.nikko-kankou.org/spot/9", title: "日光市観光協会 いろは坂", checked_on: "2026-10-22"}
      - {url: "https://www.nikko-kankou.org/flowering/autumn-leaves", title: "日光市観光協会 紅葉状況", checked_on: "2026-10-22"}
    note: "代表点: 中禅寺温泉(バス停付近。標高は公式で湖面1269m。推定)。いろは坂は坂の途中で標高が約440m変わり、上から下へ色づく"
