# 検査: python -X utf8 -m ikimonobiyori.catalog check --catalog-dir ikimonobiyori/data/catalog/drafts
# 公式ページ(自治体・観光協会・管理者)を Claude Code が読み、事実だけを自分の言葉で短く書いた。ページの文章は写していない。自動収集はしていない。
#   point: 代表点の座標は、公式ページの所在地をもとに Claude Code が推定した値(公式ページに座標はない)。elevation_m はその座標の Open-Meteo Elevation API の値(2026-10-22 取得)。どちらも要確認。
#   typical_window: 公式ページの「上旬・中旬・下旬」を 01〜10 日・11〜20 日・21 日〜月末に直した(D-14)。元の書き方は note に残す。
#   sources[].checked_on は Claude Code がページ本文を読めた日。本文を読めず検索結果の要約でしか確かめられなかった出典には checked_on を付けていない(note に書いた)。
#   id の kouyou-0004(丸沼高原)と kouyou-0016(御岳渓谷)は見送りのため欠番。
