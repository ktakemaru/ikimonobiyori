# 紅葉の名所カタログの下書き(段階14b。ikimono-site-catalog/1 の形)。docs/design.md §5、docs/stage14b-review.md。
# 本番のカタログ(../autumn_leaves.yaml)とは分けて置く。承認された件だけを、承認の後に本番のカタログへ移す(docs/stage14b-decisions.md D-13)。
# 検査: python -X utf8 -m ikimonobiyori.catalog check --catalog-dir ikimonobiyori/data/catalog/drafts
# 公式ページ(自治体・観光協会・管理者)を Claude Code が読み、事実だけを自分の言葉で短く書いた。ページの文章は写していない。自動収集はしていない。
#   point: 代表点の座標は、公式ページの所在地をもとに Claude Code が推定した値(公式ページに座標はない)。elevation_m はその座標の Open-Meteo Elevation API の値(2026-10-22 取得)。どちらも要確認。
#   typical_window: 公式ページの「上旬・中旬・下旬」を 01〜10 日・11〜20 日・21 日〜月末に直した(D-14)。元の書き方は note に残す。
#   sources[].checked_on は Claude Code がページ本文を読めた日。本文を読めず検索結果の要約でしか確かめられなかった出典には checked_on を付けていない(note に書いた)。
#   id の kouyou-0004(丸沼高原)と kouyou-0016(御岳渓谷)は見送りのため欠番。
schema: ikimono-site-catalog/1
subject: autumn_leaves
note: "段階14b の下書きのうち、保留のものだけ。承認された件は本番のカタログに移した(2026-10-22)。却下はなし"
entries:
  - id: kouyou-0005
    name: 那須高原(殺生石・那須湯本温泉周辺)
    subjects: [autumn_leaves]
    timing_type: temperature
    kind: area
    point: {lat: 37.107, lon: 139.999, elevation_m: 1020}
    location_precision: exact
    typical_window: {start: "10-11", end: "10-31", source_url: "https://www.tochigiji.or.jp/spot/s10954/", note: "栃木県観光物産協会の一覧: 殺生石・湯本温泉周辺 10月中旬〜下旬(例年のもの)。本文は直接読めず(応答 503)、検索結果の要約で確認。要目視"}
    status: candidate              # 保留: 那須高原: 出典ページを読めていないため保留(ユーザーの判定 2026-10-22)
    sources:
      - {url: "https://www.tochigiji.or.jp/spot/s10954/", title: "栃木県観光物産協会 茶臼岳(那須岳)"}
    note: "代表点: 殺生石・那須温泉神社付近(推定)。76地点の那須岳(茶臼岳)と重ならないよう、山麓の温泉地にした。那須町観光協会のサイトは応答なし(503)"
  - id: kouyou-0009
    name: 清津峡
    subjects: [autumn_leaves]
    timing_type: temperature
    kind: point
    location_precision: exact
    typical_window: {start: "10-21", end: "11-10", source_url: "https://www.tokamachishikankou.jp/special/autumn_leaves/", note: "十日町市観光協会: 紅葉時期は例年10月中旬〜11月中旬頃、見頃は10月下旬〜11月上旬"}
    official_status_url: "https://www.tokamachishikankou.jp/special/autumn_leaves/"
    access_notes: "繁忙期は混雑緩和のため事前予約が必要な期間がある"
    status: candidate              # 保留: 清津峡: 修正の指示の座標が 2 回とも未記入(「［lat, lon］」のまま)。座標が決まるまで保留
    sources:
      - {url: "https://www.tokamachishikankou.jp/special/autumn_leaves/", title: "十日町市観光協会 紅葉情報2026", checked_on: "2026-10-22"}
    note: "代表点(清津峡渓谷トンネルの入口)の座標を確かめられなかったので point を入れていない(推定した座標の標高が1,410mと出て、入口の標高と合わないと判断)。承認のときに決めたい"
  - id: kouyou-0017
    name: 高尾山(清滝駅・ケーブルカー沿線)
    subjects: [autumn_leaves]
    timing_type: temperature
    kind: area
    point: {lat: 35.633, lon: 139.271, elevation_m: 193}
    location_precision: exact
    typical_window: {start: "11-11", end: "12-10", source_url: "https://www.takaotozan.co.jp/StationStaff/archives/14100", note: "高尾登山電鉄(ケーブルカーの管理者)のブログ: 例年11月中旬〜12月上旬。山頂〜薬王院が先、ケーブル沿線は遅れる。本文は直接読めず(メンテナンス中)、検索結果の要約で確認。要目視"}
    status: candidate              # 保留: 高尾山: 出典サイトがメンテナンス中のため保留(ユーザーの判定 2026-10-22)
    sources:
      - {url: "https://www.takaotozan.co.jp/StationStaff/archives/14100", title: "高尾登山電鉄 高尾山の紅葉情報"}
    note: "代表点: ケーブルカー清滝駅(推定)。76地点の高尾山(山頂)とは別に山麓を代表点にした"
