# 名所カタログの検査の方針(段階13)。検査器 ikimonobiyori/catalog.py はここから読み、コードに値を持たない。
schema: ikimono-catalog-policy/1
# 位置の粗さの並び(細かい → 粗い)。下限より細かい値は拒否する
precision_order: [exact, area_1km, area_10km]
# 粗さごとの座標の小数の桁の上限(これより細かい桁の座標は拒否する)。exact は制限なし(null)
# area_10km = 小数1桁は、既存の野鳥の丸め(sites.yaml の bird_areas、プロファイルの location_precision)と同じ。area_1km = 小数2桁(約1km)は同じ考え方からの仮置き
precision_decimals: {exact: null, area_1km: 2, area_10km: 1}
# 対象ごとの位置の粗さの下限。ここにない対象は default
# 段階13 の既定の判断: docs/design.md §4 の「配慮」に「位置を粗く」とある対象(野鳥・ホタル)を area_10km、それ以外を exact(作業指示書 フェーズ2)
min_location_precision:
  default: exact
  birds: area_10km
  fireflies: area_10km
  # 冬鳥の飛来地(段階16 C): 自治体・管理者が公開している観察場所だけを載せる前提で area_1km(小数 2 桁)。個々の群れ・ねぐらの正確な位置は載せない(安全側の仮置き)
  wintering_birds: area_1km
# 公式に公開された観賞会場(entry.public_venue)なら、下限より細かい位置を許す対象。野鳥は許さない(安全側。判断 D-08)
public_venue_exception: [fireflies]
# 希少種・生息地(entry.sensitive: true)の下限。公開会場の例外は効かない
sensitive_min_location_precision: area_10km
# 名所の範囲(段階14b。ビヨリシリーズの決まり: 東京・横浜からの直線距離 250 km 以内)。point のある件だけを検査する。
# 起点の座標は東京駅・横浜駅の付近(Claude Code の知識による値。小数 3 桁)。地球の半径は球の近似(km)
range_limit:
  max_km: 250
  # 出発地(段階23 の続き。ユーザーの指示 2026-10-25: ハブのコンシェルと同じく既定は横浜、東京などを選べる)。距離は出発地から測り、範囲は出発地ごとに判定する
  default_origin: 横浜
  # 範囲の端(ユーザーの指示 2026-10-25): 出発地から edge_min_km 以上 max_km 以下は「範囲の端」と書く
  edge_min_km: {value: 240, source: "ユーザーの指示(2026-10-25):『240〜250 kmは「範囲の端」と書く』", provisional: false}
  earth_radius_km: 6371.0
  origins:
    - {name: 東京, lat: 35.681, lon: 139.767}
    - {name: 横浜, lat: 35.466, lon: 139.622}
