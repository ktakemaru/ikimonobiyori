# 紅葉の名所カタログ(ikimono-site-catalog/1)。docs/design.md §5。
# 段階13 では説明用の例だけを入れる(example: true。実在しない。座標・例年値・URL はすべて「例」)。実在の名所の下書きは段階14。
# v0 の判定はこのファイルを使わない(v0 は ikimonobiyori/data/sites.yaml の 76 地点)。
schema: ikimono-site-catalog/1
subject: autumn_leaves
note: "段階13: 例のみ。approved にしない"
entries:
  - id: kouyou-example-0001
    name: (例)〇〇渓谷の遊歩道
    example: true
    subjects: [autumn_leaves]
    timing_type: temperature
    species: [いろはかえで, ぶな]
    kind: point
    point: {lat: 35.0, lon: 139.0, elevation_m: 900}      # 例の値(実在の場所ではない)。見る場所の標高
    location_precision: exact
    typical_window: {start: "11-01", end: "11-15", source_url: "https://example.org/kouyou-example-0001/typical", note: "例の値"}
    official_status_url: "https://example.org/kouyou-example-0001/status"
    description: "(例)渓谷沿いの遊歩道。説明用の例で、実在しない"
    access_notes: "(例)指定の駐車場から徒歩"
    manners: ["指定の駐車場・歩道を使う", "枝や葉を採らない"]
    status: candidate
    sources:
      - {url: "https://example.org/kouyou-example-0001", title: "例の出典(実在しない)", checked_on: "2026-10-21"}
  - id: kouyou-example-0002
    name: (例)△△山の中腹の広葉樹林
    example: true
    subjects: [autumn_leaves]
    timing_type: temperature
    kind: area
    point: {lat: 36.0, lon: 138.0, elevation_m: null}     # 例の値。標高は不明の例(null)
    location_precision: area_1km
    site_ref: yamabiyori:m001                             # 他のビヨリの地点への参照の書き方の例(内容の対応は例)
    status: candidate
    sources:
      - {url: "https://example.org/kouyou-example-0002", title: "例の出典(実在しない)", checked_on: "2026-10-21"}
