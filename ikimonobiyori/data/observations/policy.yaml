# 観察の記録(段階34。ikimonobiyori/observations.py)の方針。値・語・文はここに置き、コードに持たない(CLAUDE.md 規則 1)。
# 利用者の決定(2026-11-01、指示書「イキモノビヨリの生まれ変わり」): 古いデータ・公式でない情報で答えを止めない。
# どの区分の記録も捨てない。新しさの区分は「取りに行く合図」と「確かさの書き方」にだけ使う。
schema: ikimono-observations-policy/1

subjects: [autumn_leaves, flowers, birds]
subject_labels: {autumn_leaves: 紅葉, flowers: 花, birds: 野鳥}

# 記録の検査
record:
  dir: observations                       # IKIMONOBIYORI_DATA_DIR の下
  max_raw_chars: {value: 80, source: "指示書 2-通信の作法・4-2(状態の短い原文は80字まで)", provisional: false}
  source_classes: [official, secondary]
  required: [url, state, source_class]
  # 段階69 第3部 4: 名所の登録(種 kind と例年の時期 typical。本文を読んだ印 basis: page)は、今の状態(state)がなくても記録できる。
  # 今の状態は読めたときだけ別に記録する(画像で読めないときは記録しない。推測しない)
  state_optional_with: [kind, typical]
  # 段階80 F(提案7): 「行く前に」(notice。台風の被害で一部開園など)だけの記録も、公式のページの本文を読んだもの(source_class: official・basis: page)なら、今の状態なしで記録できる
  state_optional_notice: true
  # 段階64 第5部: 取得の作法の検査(記録の入口)。
  # basis: 事実の読み方。page = ページの本文を読んだ / search_summary = 検索結果の要約だけ(記録しない)。
  # 種(kind)と例年の時期(typical)の記録(時期と場所の答えの材料)は、本文を読んだ印(basis: page)が要る
  basis_values: [page, search_summary]
  basis_rejected: [search_summary]
  basis_required_with: [kind, typical]
  # 強い事実(災害・閉鎖・規制・休園・火事・通行止め・料金)は、公式ページで確かめたものだけ記録する(紹介サイトだけなら記録しない)
  strong_fact_words: [災害, 閉鎖, 規制, 休園, 閉園, 火事, 火災, 山火事, 焼け, 通行止め, 立入禁止, 立ち入り禁止, 料金, 有料]
  strong_fact_fields: [state, notice, practical, typical]
  # 範囲: 次の都県(全域が横浜・東京から 250km 前後に収まる。data/ask/season_place.yaml の unknown_distance_prefectures と同じ考え方)の外の記録は、
  # 市区町村の代表点で範囲の内と確かめられたときだけ記録する(福島県・新潟県・北海道など)
  range_check:
    prefectures: [東京都, 神奈川県, 埼玉県, 千葉県, 茨城県, 栃木県, 群馬県, 山梨県, 長野県, 静岡県]
  # 段階47(利用者の決定 2026-11-05): 利用規約が自動取得を禁じるホスト。記録しない・既にある記録も答えの材料にしない(人が開くリンクとしてだけ扱う)
  not_read_hosts: {value: [tenki.jp, weathernews.jp, n-kishou.com, n-kishou.co.jp], source: "tenki.jp 利用規約 第8条 禁止事項 6(ブラウザ・RSSリーダー以外での取得と利用の禁止)", provisional: false}
  # 段階62 第9部: 本人が不採用と決めた情報源のホスト(バードリサーチ。2026-11-08)。読まない・記録できない・答えと知識カードの出典に使わない
  rejected_hosts: [bird-research.jp]
  # 段階58 第4部: SNS の投稿を事実の根拠にしない(記録しない。過去の記録も答えの材料にしない)
  sns_hosts: [x.com, twitter.com, facebook.com, instagram.com, youtube.com, youtu.be, tiktok.com, threads.net]
  # 段階57 第11部: 公式の機械可読データ。台帳の承認(approval.status)が approved になるまで答えの材料にしない(記録は残す)
  # 段階60 第9部: 承認待ちを隠す仕組みの統一。対象(記録の対象 → 隠す台帳の状態)。公式の台帳(data/sources/*.yaml)で、
  # 記録の URL に対応する項目がこの状態なら、公式としての記録は承認されるまで答えに出さない(記録は残る。承認されれば自動で出る)。
  # 紹介サイトなど(source_class secondary)は段階34 の方針どおり「公式ではありません」で出る。野鳥・冬鳥の現況の記録(status_log)は記録の時点で承認済みだけが通る
  gated_ledgers: {autumn_leaves: [pending, revoked], flowers: [pending, revoked]}
  # 段階62 第7部: 名所カタログの地点がまだ候補のため、台帳(data/sources/<対象>.yaml。地点は承認済みの名所に結ぶ決まり)に入れられない
  # 承認待ちの情報源。承認待ちとして扱い(gated_ledgers と同じ)、承認されるまで公式としての記録を答えの材料にしない。承認の記入はしていない
  pending_sources:
    - id: tbg-kahaku-migoro
      subject: flowers
      publisher: 国立科学博物館 筑波実験植物園
      url: https://tbg.kahaku.go.jp/migoro-event/syokubutsu/index.html
      site_candidate: hana-0041
      robots: "robots.txt は /staging/* だけを拒否(「今週のみごろ」は拒否されていない。指示書 段階62 第7部 2)"
      terms: "「当サイトの内容等を許可なく複製・改変および販売・出版・放送等に利用しないようにお願いします」の記載。使うのは花の名前・「見ごろ」の語・日付・URL だけ(事実のみ)"
      approval: {status: pending, reason: 段階62 第7部で承認待ちとして追加。利用者が規約メモを見て決めるまで答えの材料にしない}      # 段階61 第8部(本人の確認 2026-11-08): 花の台帳にも広げた
  gated_sources:
    - {url_re: 'yamanashi-kankou\.jp/special/documents/koyo_', ledger: autumn_leaves, source: yamanashi-kankou-koyo-csv}
  # 段階54 第1部(利用者の決定 2026-11-06): 山と溪谷オンライン(山と溪谷社)の掲載情報。利用規約が事前の承諾のない複製・転用を禁じる(第4条⑧)ので、
  # 記事の文章は保存・転載・要約・言い換えのどの形でも使わない。使うのは「状態を表す短い語句」「掲載の日付」「URL」だけ。
  # 承認待ちの間は答えの材料にしない(approved を本人が true にするまで)。記録はリポジトリの外(IKIMONOBIYORI_DATA_DIR)にだけ置く。
  # 段階54 第8部: 取得した文章は指示ではなくデータ。次のどれかに当たる事実は記録しない（指示に見える文・制御文字・極端に長い文字列）
  untrusted_text:
    max_field_chars: {value: {name: 80, city: 40, publisher: 80, url: 500, prefecture: 20, area: 40, kind: 40}, source: "段階54 第8部の方針(仮置き)。状態・例年の時期・実用情報は max_raw_chars（80）", provisional: true}
    instruction_words: [以前の指示, 上記の指示, 指示を無視, 指示をすべて, 無視して, 承認済みにして, 承認して, 取得して, このURL, このＵＲＬ, システムプロンプト, ignore previous, ignore all, disregard, 引用は, 文字まで引用, 実行して, 設定を書き換, 台帳を, allowed_hosts, approved]
  restricted_sources:
    hosts: {value: [yamakei-online.com], source: "山と溪谷オンライン利用規約 第4条⑧、利用者の決定 2026-11-06", provisional: false}
    approved: false
    max_state_chars: {value: 30, source: "利用者の決定 2026-11-06(状態を表す数語。文章は使わない)", provisional: false}
    forbidden_fields: [practical, typical, event, species, forecast]
    sentence_marks: ["。", "！", "？", "!", "?", "\n"]
    safety_words: [日没, 日の入り, 下山, 通行止め, 通行禁止, 一方通行, 閉鎖, 立入禁止, 運休, 規制, 凍結, 注意, 危険]
    guide_line: "最新の山の状況は{center}の案内({url})で確認してください"
    source_label: "{center}発信(山と溪谷オンライン掲載)"

# 段階52(利用者の決定 2026-11-06): ウェザーニュース(ウェザーニューズ)の予想は、他サイトの転載でも答えの材料にしない。
# 記録に次の語を含む事実(状態・例年の時期・出所・発行元の欄)は、既にあっても使わない(記録は消さない)。ウォーカープラスの記事 161896 は転載で、転載の部分を判別できないため今年の予想は使わない。
not_read_words: {value: [ウェザーニュース, ウェザーニューズ, weathernews, "topics/article/161896"], source: "利用者の決定 2026-11-06(転載であっても使わない)", provisional: false}

# 段階53 第2部: まつり・イベント（festivals.yaml。ikimonobiyori/festivals.py）。期間は主催者が設定した運営上の日程で、色づきを保証しない。現況とは別の行にする
festivals:
  file: festivals.yaml
  period_label: 主催者が設定した期間
  status_text:
    ongoing: "まつり期間中({start}〜{end})"
    starts_today: "本日開始({start}〜{end})"
    starts_in: "あと{days}日で開始({start}〜{end})"
    ended: "終了しました({start}〜{end})"
  # 段階56: 1日だけの行事（開始日と終了日が同じ）。ラベル（主催者が設定した期間）は付けない
  single_day_text:
    ongoing: "本日{md}（{wd}）に開催"
    starts_today: "本日{md}（{wd}）に開催"
    starts_in: "{md}（{wd}）に開催（あと{days}日）"
    ended: "{md}（{wd}）に開催（終了しました）"
  lightup_text: "ライトアップ: {start}〜{end}{hours}{note}"
  lightup_no_period: "ライトアップ: {hours}{note}"
  hours_fmt: " {hours}"
  note_fmt: "。{note}"
  organizer_line: "主催: {organizer}({klass})"
  class_labels: {official: 公式, secondary: 公式ではありません}
  no_state: "色づき状況は確認できていません"
  # 段階67 第2部(承認欄 A(b)。本人の判断 2026-11-09): 会場が町内の複数か所にわたるまつり(festivals.yaml の area)は、名所の tags の同じ項目が同じなら、
  # 同じ地域の名所にも結ぶ(対象 targets が名所の対象と合うときだけ)。会場が特定の場所だけのまつりには area を付けない
  area_link:
    fields: [city]
    source: "本人の判断(2026-11-09。段階67 指示書の承認欄 A(b))"
    provisional: false
  # 段階67 第3部 1・2: まつり・行事の対象(targets)が節の対象と合うものだけ付ける。名前のない行事は出さない。対象の日と重ならない行事は出さない
  target_of_subject: {autumn_leaves: [autumn_leaves], flowers: [flowers], birds: [birds]}
  # 答えの行(名前を必ず先に書く)。label は「主催者が設定した期間」(1日だけの行事は付けない)
  named_line: "{name}({label}): {period}"
  named_line_single: "{name}: {period}"
  contact_line: "問い合わせ: {contact}"
  dropped:
    other_year: 今シーズンの情報ではない
    weekday_mismatch: 日付と曜日が今年の暦と合わない
    year_missing: 年が読めない

# 新しさの区分(状態の日付、なければ読んだ日 から 今日まで の日数)。どれも捨てない
freshness:
  source: "指示書 4-4(紅葉・花は2日以内、野鳥は7日以内が新しい。14日以内が古い。それより前がかなり古い)"
  provisional: true
  fresh_days: {autumn_leaves: 2, flowers: 2, birds: 7}
  stale_days: 14
  labels: {fresh: 新しい, stale: 古い, very_stale: かなり古い, none: 記録なし}

# 旬(ハブのコンシェルと同じ。上旬 1〜10 日・中旬 11〜20 日・下旬 21 日〜月末)
month_thirds: {上旬: [1, 10], 中旬: [11, 20], 下旬: [21, 31]}
# 「11月20日頃」のような 1 日だけの書き方の前後の幅(日)
around_days: {value: 5, source: "仮置き(『頃』の幅。根拠のある値ではない)", provisional: true}

# 状態の語の正規化。並びは共通の順番(0 前・1 始まり・2 見頃・3 過ぎ)
states:
  autumn_leaves:
    order: {青葉: 0, 色づき始め: 1, 見頃: 2, 見頃過ぎ: 3}
    # 原文に含まれる語 → 正規化した語(上から順に照合。最初に当たったもの)
    words:
      - [見頃過ぎ, 見頃過ぎ]
      - [見ごろ過ぎ, 見頃過ぎ]
      - [落葉, 見頃過ぎ]
      - [終盤, 見頃過ぎ]
      - [散り始め, 見頃過ぎ]
      - [終わり, 見頃過ぎ]              # 段階65 第6部 2: 日光市観光協会「▼ 10/23現在、終わりです」(花の語と同じ)
      - [色づき始め, 色づき始め]
      - [色付き始め, 色づき始め]
      - [色づきはじめ, 色づき始め]
      - [まもなく見頃, 色づき始め]      # 段階58: 長瀞町観光協会の書き方(2026-11-05 の記事)
      - [色づき進, 色づき始め]          # 段階58: 同上
      - [そろそろ見ごろ, 色づき始め]
      - [そろそろ見頃, 色づき始め]
      - [見頃近し, 色づき始め]
      - [見頃, 見頃]
      - [見ごろ, 見頃]
      - [真っ盛り, 見頃]
      - [青葉, 青葉]
      - [まだ, 青葉]
  flowers:
    order: {見頃前: 0, 見頃: 2, 見頃過ぎ: 3}
    # 「N分咲き」(範囲は小さい方)。peak_min 分以上は見頃、それ未満は見頃前
    bloom_pattern: "([0-9０-９一二三四五六七八九十]+)(?:\\s*[~〜～\\-]\\s*[0-9０-９一二三四五六七八九十]+)?\\s*分咲"
    peak_min_bu: {value: 8, source: "指示書 4-2(8分以上・満開・見頃→見頃)", provisional: false}
    words:
      - [見頃前, 見頃前]
      - [見ごろ前, 見頃前]
      - [これから見頃, 見頃前]
      - [これから見ごろ, 見頃前]
      - [見頃を迎えます, 見頃前]
      - [見ごろを迎えます, 見頃前]
      - [見頃を迎える予定, 見頃前]
      - [見頃過ぎ, 見頃過ぎ]
      - [見ごろ過ぎ, 見頃過ぎ]
      - [終了, 見頃過ぎ]
      - [終わり, 見頃過ぎ]
      - [満開, 見頃]
      - [見頃, 見頃]
      - [見ごろ, 見頃]
      - [咲き始め, 見頃前]
      - [つぼみ, 見頃前]
    # 品種名・区画だけの「見頃」は園全体の見頃にしない(data/regional/policy.yaml の partial_variety と同じ考え)
    partial_quoted: "[「『][^」』]+[」』]"
    partial_words: [品種, 一部, 区画, エリア, ゾーン]
  birds:
    order: {}
    words: []
unknown_state: 状態不明

# 段階37(指示書 2-4-3): 時期を表す語の中の「見頃」は、今の状態として読まない(正規化の前に原文から取り除く。原文は残す)。
# 段階H10 の試用で、ウォーカープラスの「(例年の見頃のみ)」が「見頃」と読まれた
not_state_phrases: [例年の見頃, 例年の見ごろ, 例年見頃, 例年見ごろ, 見頃の時期, 見ごろの時期, 見頃時期, 見ごろ時期, 見頃予想, 見ごろ予想, 見頃予測, 見ごろ予測,
                    見頃の予想, 見ごろの予想, 見頃は例年, 見ごろは例年, 見頃期, 見ごろ期]

# 段階37(指示書 2-4-1): 状態の日付を原文から補ったときの印(記録の state_date_inferred)。
# day_only: 月のない「01日現在」を、読んだ日以前でいちばん近いその日とした。month_day: state_date_text の「10/25現在」から年を補った
state_date_inferred: {day_only: month_from_read_date, month_day: year_from_read_date}

# 地域のまとめページ(1 ページで多くの名所の今の状態が分かる。plan の先頭)
summary_pages:
  autumn_leaves:
    神奈川県:
      - {url: "https://koyo.walkerplus.com/ranking/ar0314/", publisher: ウォーカープラス, source_class: secondary, note: "神奈川の紅葉名所ランキング(例年の見頃)"}
      - {url: "https://www.pref.kanagawa.jp/docs/f4y/02yama/kanagawaparkranger/leaves/l-top.html", publisher: 神奈川県, source_class: official, note: "丹沢の紅葉記録の一覧(山の色づき)"}
      - {url: "https://koyo.walkerplus.com/list/ar0314/", publisher: ウォーカープラス, source_class: secondary, note: "神奈川の紅葉名所の一覧(例年の見頃。今の色づき段階は一覧に出ない)"}
      - {url: "https://koyo.walkerplus.com/list/ar0314/ct08800/", publisher: ウォーカープラス, source_class: secondary, note: "箱根の紅葉名所の一覧(例年の見頃)"}
      - {url: "https://koyo.walkerplus.com/list/ar0314/ct08700/", publisher: ウォーカープラス, source_class: secondary, note: "小田原・県西の紅葉名所の一覧(例年の見頃)"}
      - {url: "https://koyo.walkerplus.com/list/ar0314/ct08000/", publisher: ウォーカープラス, source_class: secondary, note: "鎌倉の紅葉名所の一覧(例年の見頃)"}
    東京都:
      - {url: "https://koyo.walkerplus.com/list/ar0313/", publisher: ウォーカープラス, source_class: secondary, note: "東京の紅葉名所の一覧(例年の見頃。今の色づき段階は一覧に出ない)"}
  flowers:
    神奈川県:
      - {url: "https://gardennecklace.city.yokohama.lg.jp/", publisher: ガーデンネックレス横浜, source_class: official, note: "横浜の花の行事"}
      - {url: "https://www.kanagawa-kankou.or.jp/", publisher: 神奈川県観光協会, source_class: secondary, note: "県内の花の行事"}
  birds:
    神奈川県: []
search_templates:
  autumn_leaves: "{name} 紅葉 色づき"
  flowers: "{name} {kind} 見頃"
  birds: "{name} 野鳥"

# 1 回の質問で取りに行く上限(指示書 2-通信の作法。答えに必要なら、理由を記録して超えてよい)
fetch_limits: {searches: 10, pages: 30, minutes: 5, same_host_interval_s: 1, source: "指示書 2-通信の作法", provisional: false}

# facts の並び(指示書 4-5)
order:
  # 同じ段の中の確かさの順(小さいほど先)
  evidence_rank: {fresh_official: 0, fresh_secondary: 1, stale: 2, typical_only: 3}
  # 対象の日の近く(例年の見頃の前後この日数)を「例年の見頃にかかる」とみなす幅
  near_days: {value: 7, source: "既存の weekend の near(前後7日)と同じ", provisional: true}

# 関係の語(答えの材料。答えにそのまま使える日本語)
relation_labels:
  in_peak: 見頃中の見込み
  before_peak: 見頃前の見込み
  after_peak: 見頃過ぎの見込み
  unknown: 分からない
reason_labels:
  most_advanced: 今いちばん進んでいる
  coming: これから進む
  peak_now: いま見頃
  event: 行事がある
  near: 近い
  typical_overlaps: 例年の見頃にかかる
  inat_season: この時期の記録が多い
avoid_reasons:
  too_early: まだ早い(対象の日は例年の見頃の前)
  past: 見頃を過ぎた
# 地域の候補が少ないとき、県外を足す下限
min_candidates: {value: 3, source: "指示書 R2(地域の候補を3件以上)", provisional: false}
# 段階60 第1部: 名寄せ(同じ名所の表記ゆれ。「箱根 仙石原(長安寺)」と公式の地点の書き方「仙石原(長安寺)」など)。
# 同じ名所とみなすのは: ①別名辞書(data/ask/place_aliases.yaml と手元の追加分)で同じ正式名称になる、
# ②一方の名前(照合用の形)が他方に含まれ、短いほうが min_key_chars 字以上で、市区町村が食い違わない、
# ③(名所どうしのとき)②に加えて、座標がどちらもあれば直線 max_km 以内。
# 長いほうが「・」などで複数の地点を並べた名前(「中禅寺湖・華厳滝」)で、短いほうがその一部だけに当たるときは、別の名所として扱う。
# 候補が 2 つ以上当たるときは、取り違えないように結びつけない。統合した名前は消さず別名として残す。
merge:
  max_km: {value: 0.3, source: "段階60 指示書 第1部(例: 直線で300m以内)", provisional: true}
  min_key_chars: {value: 3, source: "仮置き(2字の地名「湯本」などの取り違えを避ける)", provisional: true}
  list_separators: ["・", "、", "/"]
# 地域を指定しない質問の出発地 → 主に見る都道府県
origin_home: {横浜: 神奈川県, 東京: 東京都}
# 地域を指定しない質問（ask の既定。利用者の決定 2026-11-04）: 都道府県に縛らず、出発地から片道の範囲内（catalog の range_limit）の登録済みの名所すべて
all_range_words: [全範囲, 登録済みの全範囲]
all_range_name: 登録済みの全範囲（出発地から片道250km前後）
# 段階62 第2部: 複数の都県の指定(「東京か神奈川で」「東京と神奈川」「神奈川・埼玉」)を都県の OR として受け付ける。
# 全体で 1 つの地域にならないときだけ、区切りで分けて、どの部分も地域の呼び名に一致するときに使う(推測で近いものを選ばない)。
multi_region:
  split_re: '[・、,/／]|か|と|や|または|および'
  strip_suffix_re: '(で|あたり|周辺|方面|の中|内)$'
  name_sep: ・

# 答えに出さない内部用語(facts の文の自己検査)
forbidden_terms: [snapshot, status_log, proposal, band, max_age_h, pending, 台帳, observations, source_class, secondary, official]

# 段階35(指示書 biyori-hub/docs/stageH9-instructions.md 穴3): 例年の時期と今年の行事の期間を分ける
typical:
  # 段階67 第3部 5: 名所カタログの例年の窓の備考(note)の最初の文がこの型なら作業のメモなので答えに使わない(月日の文にする)
  note_memo_re: '記載|確認|確かめ|承認|推定|代表点|typical_window|ユーザー|ページには|ページに'
  note_paren_memo_re: 'にした|として|推定|確認|承認'
  # 名所カタログの flower_windows の注記にこの語があれば、行事の期間を写したもの(例年の時期として使わない)
  # 段階64 第2部 3: 曜日つきの日付(「10月29日(木)〜11月19日(木)」)・菊花展・展示の期間も行事の期間(川崎大師・横浜市こども植物園の型)
  event_note_words: [期間, フェスタ, フェスティバル, まつり, 祭, 開放, 曜日, 菊花展, 展示, 開催]
  # 段階64 第2部 3: 名所の名前がこの語を含むとき(行事・展示そのものの名所)、その期間は例年の見頃ではなく行事の期間
  event_name_words: [菊花展, 菊まつり, まつり, 祭り, フェスタ, フェスティバル, フェア, ウィーク]
  # 記録の「例年の見頃」の原文にこの語があれば、例年の時期ではなく行事・今年の予定(例年の時期として使わない)
  record_not_typical_words: [開催, 予定, 期間]
  # 段階36(利用者の決定 2026-11-01。評価表 R4 の読み方 (b)): 例年の時期が分からない候補の代わりの材料にする、前の年の同じ時期の記録の幅(対象の日の前後の日数)
  last_year_window_days: {value: 30, source: "仮置き(野鳥の season_window_days と同じ前後ひと月。根拠のある値ではない)", provisional: true}
# 段階72 第6部 2: 1 年じゅうの窓(通年)。答えでは「通年（咲く花は季節で変わる）」と書き、「今見頃の花」の候補の上位に置かない(見込みは unknown)
year_round: {start: "01-01", end: "12-31"}
typical_labels:
  known: "例年の見頃: {text}"
  known_strip: "例年"          # 段階56: 原文に「例年」があるときは、重ねないよう原文の「例年」を外す
  # 段階38(指示書 3-4): 同じ期間を2度書かない言い方に
  unknown_with_event: "例年の時期は分かりません。今年は{start}〜{end}に{name}があります。"
  unknown_with_last_year: "例年の時期は分かりません({year}年{md}の記録({publisher})では「{text}」)"
  unknown: "例年の時期は分かりません"
  # 段階72 第6部 2: 例年の窓が 1 年じゅう(year_round)の名所(筑波実験植物園など)
  year_round: "例年の見頃: 通年（咲く花は季節で変わる）"

# 段階57 第4部: 状態の記号を語にする(ページ上の凡例が出どころ)。凡例が読めていない発行元の記号は、そのまま出さず状態を断定しない
state_symbols:
  chars: "✕×△〇◯○◎▼"
  by_publisher:
    日光市観光協会: {"✕": まだ, "×": まだ, "△": 色づき始め, "〇": 見ごろ, "◯": 見ごろ, "○": 見ごろ, "◎": 真っ盛り, "▼": 色褪せ・落葉始め}
# 段階57 第4部: 対象の日ではない日の開園時間(「11/6の有料エリア 9:30〜21:00」)を出さない。通常の開園時間・休園日は出してよい
# 段階67 第3部 3・4: 答えに出す状態は「凡例の語 1 つ」と「短い状態の語(30字以内)」だけ。記号・日付の言い方・原文の文(2文目以降)・「です」「ます」は出さない。
# すべての経路(候補の行・今の時期・避けたほうがよい場所・計画)で同じ処理(observations.short_state)
short_state:
  max_chars: {value: 30, source: "利用者の決定 2026-11-06(状態の短い語句 30 字以内)を全経路に(段階67 第3部 4)", provisional: false}
  date_re: '[(（]?\d{1,2}[/月]\d{1,2}日?(現在|時点)?[)）]?'
  clause_end: '。！？!?'
  tail_re: '(です|でした|ます|ました|となっています|となりました)$'
  pair: "{word}（{rest}）"
  degree_re: '割|分|％|%|程度'           # 凡例の語に添えてよい、状態の度合いの語
  lead_particle_re: '^[のにはでが、]+'  # 段階77: 日付を除いたあとの頭の助詞(「10/21の活動で13種」→「活動で13種」。「の活動で…」の崩れを防ぐ)
practical_other_day:
  pattern: '(\d{1,2})/(\d{1,2})の[^。]{0,16}?\d{1,2}:\d{2}'
  replace: 当日の開園情報は公式ページで確認してください

# 段階35(穴2): 野鳥は「例年の見頃」ではなく「この時期に見られる鳥」で書く
birds:
  # 前の年の観察の記録を「この時期」とみなす幅(対象の日の前後の日数)
  season_window_days: {value: 30, source: "仮置き(前後ひと月。根拠のある値ではない)", provisional: true}
  season_labels:
    inat: "この時期に見られる鳥: iNaturalist の過去{years}年の記録(前後{weeks}週間・{area}の半径{radius}km。{fetched}取得)では、{names}が多く記録されています"
    # 段階36: 前回の集計の中心の日が対象の日と違う(対象の日がその期間の中にある)とき
    inat_other_center: "この時期に見られる鳥: iNaturalist の過去{years}年の記録({center}の前後{weeks}週間・{area}の半径{radius}km。{fetched}取得)では、{names}が多く記録されています"
    # 段階38: 一年の記録(分母)があるときは、季節らしさの順(この時期らしい鳥)で書く
    inat_park: "この時期に見られる鳥: iNaturalist の記録({months}・{area}の半径{radius}km。{fetched}取得)では、{names}が記録されています。どれも、この時期は{region}で一年の平均より多く記録される鳥です"
    inat_park_plain: "この時期に見られる鳥: iNaturalist の記録({months}・{area}の半径{radius}km。{fetched}取得)では、{names}が多く記録されています"
    inat_seasonal: "この時期に見られる鳥: iNaturalist の過去{years}年の記録({center}の前後{weeks}週間・{area}の半径{radius}km。{fetched}取得)では、{names}がこの時期に多く記録されています(一年の平均と比べて)"
    past_record: "この時期に見られる鳥: {year}年{md}の記録({publisher})では「{text}」"
    page: "この時期に見られる鳥: {publisher}の紹介では「{text}」"
    unknown: "この時期に見られる鳥の記録は見つかっていません"
    # 段階57 第4部: 公園の観察の記録があるのに「見つかっていません」と書かない
    with_current: "この時期に見られる鳥: {when}{publisher}の観察の記録があります"

# 段階36(利用者の決定 2026-11-01。指示書 biyori-hub/docs/stageH10-instructions.md 決定2): 野鳥の iNaturalist の集計の取り直し
# 区域の集計が max_age_days より古いか、対象の日が前回の集計の期間(中心の日の前後 window_weeks 週。プロファイル)から外れたら、質問のときに取り直す。
inat_refresh:
  max_age_days: {value: 7, source: "利用者の決定 2026-11-01(7日より古ければ取り直す)", provisional: false}
  max_requests_per_question: {value: 10, source: "利用者の決定 2026-11-01(1回の質問につき最大10リクエスト)", provisional: false}
  index_file: observations/inat_index.json        # IKIMONOBIYORI_DATA_DIR の下。取り直した集計の中心の日と取得時刻

# 段階38(利用者の決定 2026-11-01。指示書 docs/stage38-instructions.md 3-1・3-2): 公園ごとに「見られる鳥」
park_birds:
  # 範囲: 半径10kmの円(bird_areas.yaml)をやめ、探鳥地ごとの範囲(spots.yaml の bird_range: 中心と半径)にする。
  # bird_range がない名所だけ、従来の区域(bird_area)を使う。
  range:
    default_radius_km: {value: 2, source: "指示書 段階38 3-2(既定は半径2km)。仮置き(公園の広さに合わせた較正はしていない)", provisional: true}
    # 公開の公園の代表点なので、冬鳥の飛来地(data/catalog/policy.yaml の wintering_birds)と同じ area_1km(小数2桁 = 約1km)に丸める。
    # 群れ・ねぐら・観察者の位置ではない。問い合わせ・キャッシュ・出力にはこの丸めた値だけを使う(絶対ルール7)
    location_precision: area_1km
  # 季節らしさ(methods/observation_frequency.seasonal_rank):
  #   lift = (対象の日の前後 window_weeks 週の、その種の記録の割合) ÷ (同じ場所・同じ過去の年の、一年の記録の中の割合)
  #   lift が lift_min 以上で、時期の件数が min_window_count 以上の種を「この時期らしい」として先に、lift の大きい順。ほかは件数の順で後ろ(消さない)。
  seasonality:
    formula: "lift = (時期の種の件数 / 時期の鳥類の総数) / (一年の種の件数 / 一年の鳥類の総数)"
    lift_min: {value: 1.2, source: "仮置き(一年の平均より2割多ければ『この時期らしい』。根拠のある値ではない)", provisional: true}
    lift_strong: {value: 2.0, source: "仮置き(一年の平均の2倍以上を『特に多い』。根拠のある値ではない)", provisional: true}
    min_window_count: {value: 2, source: "仮置き(1件だけの記録で季節らしさを決めない。根拠のある値ではない)", provisional: true}
  # 公園ごとの範囲の「この時期」と年(2026-11-01 の実測: 半径2km・前後1週・過去5年では、公園ごとの記録が 2〜6 件しかなかった。docs/stage38-report.md)。
  # 公園ごとの範囲は、対象の日の前後 half_days 日にかかる月(11/3 なら 10月・11月)の、すべての年の記録を 1 リクエストで取る。分母も同じくすべての年の一年の記録(1 リクエスト)
  window:
    half_days: {value: 15, source: "仮置き(前後半月にかかる月。半径2kmの公園で記録の数を確保するため。根拠のある値ではない)", provisional: true}
    all_years: true                       # 年で絞らない(公園ごとの範囲では記録が少ないため)
  min_total: {value: 15, source: "仮置き(公園ごとの範囲の『この時期』の記録の下限。プロファイルの min_total_observations 30 より小さい。2026-11-01 の実測で横浜自然観察の森が18件。根拠のある値ではない)", provisional: true}
  # 季節らしさは地域全体の記録で決める(2026-11-01 の受け入れテストの採点: 公園ごとの記録(20件前後)では割合がぶれ、キジバト・メジロなど一年中いる鳥が上位に来た)。
  # 公園の記録は「その公園で見られる鳥」(どの鳥か)にだけ使い、並び(この時期らしいか)は地域全体の同じ月・一年の記録の割合の比で決める。
  # 地域の区域は都道府県ごとに 1 つ。座標は area_10km(小数1桁)。取得は公園と同じ形(この時期の月 1 リクエスト + 一年 1 リクエスト。キャッシュを使い回す)
  regional_areas:
    神奈川県: {id: "region:神奈川県", name: 神奈川県の探鳥地周辺, lat: 35.4, lon: 139.5, radius_km: 30, location_precision: area_10km,
              source: "仮置き(横浜を中心に、神奈川の探鳥地の一覧の公園を含む半径。根拠のある値ではない)", provisional: true}
  # 反対の季節との比べ(2026-11-01 の実測: 10・11月と一年の平均の比だけでは、コサギ・ハクセキレイ・トビなど一年中いる鳥も 1.3 前後になり、
  # 冬鳥(コガモ 1.38)と分けられなかった。一年の平均には冬鳥の多い冬も入るため)。地域全体でだけ、反対の季節の月の記録も 1 リクエスト取る。
  #   季節らしい = (一年の平均との比 lift >= lift_min) かつ (反対の季節との比 contrast_lift >= contrast_min。反対の季節に記録がなければ満たす)
  #   contrast_lift = (この時期の種の割合) / (反対の季節の種の割合)。並びは contrast_lift の大きい順
  contrast:
    summer: [6, 7, 8]
    winter: [12, 1, 2]
    # この時期の月が summer の月にかかるときは winter と、それ以外は summer と比べる
    # 2026-11-01 の実測(神奈川・10・11月 対 6〜8月): コガモ 26.9・モズ 6.9・ジョウビタキ(夏の記録なし)、一年中いる鳥 ヤマガラ 4.6・エナガ 4.0・コサギ 1.6
    # (夏は葉が茂り観察者も少ないため、一年中いる小鳥も夏の記録の割合が下がる)。それを分ける値として 5
    contrast_min: {value: 5.0, source: "仮置き(2026-11-01 の実測で一年中いる小鳥 4.6 以下・冬鳥 6.9 以上を分ける値。根拠のある値ではない)", provisional: true}
  regional_min_window_count: {value: 5, source: "仮置き(地域全体のこの時期の記録がこれ未満の鳥は季節らしさを決めない。根拠のある値ではない)", provisional: true}
  # 一年の記録(分母)の取り直しの間隔。季節で変わらないので、窓の集計(inat_refresh.max_age_days)より長くする
  baseline_max_age_days: {value: 30, source: "仮置き(一年分の過去の記録はひと月では大きく変わらない想定。根拠のある値ではない)", provisional: true}
  # 「最近の記録」とみなす幅(状態の日付から対象の日まで)
  recent_strict_days: {value: 7, source: "ユーザー指示(段階39 A-7)。この日数以内の記録を「最近の記録」、recent_days 以内を「今季の記録」とする", provisional: false}
  recent_days: {value: 30, source: "仮置き(公園の観察の記録は月に数回の更新が多い。根拠のある値ではない)", provisional: true}
  # 公園ごとに出す鳥の数(閾値ではなく表示の件数の設計値)
  max_species: {value: 8, source: "表示の件数の設計値(スマホの1画面で2〜3行)", provisional: false}
  # そのうち最近の記録から出す数の上限(この時期の記録の鳥も並ぶように。最近の記録は先に出す)
  max_recent: {value: 5, source: "表示の件数の設計値", provisional: false}
  # 海の鳥(内陸の公園でこれが上位 sea_top_n に入ったら、範囲が広すぎる合図として facts の range_warnings に出す。報告書に書く)
  sea_birds: [ウミネコ, カモメ, セグロカモメ, オオセグロカモメ, ユリカモメ, イソヒヨドリ, ウミウ, ミサゴ, スズガモ, ウミアイサ]
  sea_top_n: {value: 5, source: "表示の上位(仮置き)", provisional: true}
  # なぜ今か(決まった文。材料から作る)
  why:
    recent: "最近({md})、公園の記録に出ています"
    recent_season: "今季({md})、公園の記録に出ています"
    seasonal_strong: "この時期は、一年の平均より特に多く記録されています"
    seasonal: "この時期は、一年の平均より多く記録されています"
    # 段階38(採点の後): 地域全体の記録で季節らしさを決めたとき
    region_strong: "この公園で記録があり、この時期は{region}で一年の平均より特に多く記録される鳥です"
    region: "この公園で記録があり、この時期は{region}で一年の平均より多く記録される鳥です"
    region_year_round: "一年を通して見られる鳥です"
    window_only: "この時期の記録があります"
    year_round: "一年を通して記録されています"
    last_year: "{year}年{md}にも記録があります({publisher})"
    page: "{publisher}の紹介にあります"
  kind_labels: {recent: 最近の記録, recent_season: 今季の記録, season: この時期の記録, last_year: 前の年の同じ時期の記録, page: 公園の紹介}
  inat_period: "{center}の前後{weeks}週間(過去{years}年)"
  inat_period_park: "{months}の記録"
  months_label: "{months}月"
  # 和名の辞書(記録の原文から鳥の名前を拾う): data/guide/bird_taxa.yaml の和名と、その公園の iNaturalist の集計の和名
  name_min_len: {value: 2, source: "1文字の語(「鵜」など)を拾わない設計値", provisional: false}
