# 種ごとの花期(段階51。2026-11-06 にチャット側の Claude が検索して読めたものを取り込んだ)。山ごとの花暦(wildflower_calendar.yaml)とは別の層。
# bloom は '6-8'・'7中-8中'(旬がなければ月の精度)。bloom が null の項目は、月の記載がない(timing に原文の言い方だけを書く。月を足さない)。
# src は wildflower_facts.yaml の sources。reference_only: true は、本州の山にそのまま当てはめない種の一般情報の参考。
# 紹介サイトだけの項目は答えに「公式ではありません」を添える。2 つの紹介サイトで花期が食い違う種は範囲で併記する(conflict は出どころの違いからコードが判定)。
schema: ikimono-wildflower-species/1
species:
  - name: チングルマ
    items:
      - {bloom: '6-8', elev: [2400, null], place: 立山, src: [arf], note: 立山黒部アルペンルートの記載(高山帯は標高2400m以上)}
      - {bloom: '7-8', place: 北海道・大雪山系, src: [hbk], reference_only: true, note: 本州の山にそのまま当てはめられません}
  - name: タテヤマリンドウ
    items:
      - {bloom: '6-7', place: 立山, src: [arf]}
  - name: ミヤマリンドウ
    items:
      - {bloom: '7-9', place: 立山, src: [arf]}
  - name: ミヤマキンバイ
    items:
      - {bloom: '6-8', src: [yh53], note: 亜高山帯〜高山帯の砂礫地・草地。公式の月の記載は見つからなかった}
  - name: ハクサンコザクラ
    items:
      - {bloom: null, timing: 雪解け直後に咲き始める(湿った場所・雪渓周辺), src: [mlt], note: 月の記載はない。月は足さない}
  - name: コマクサ
    items:
      - {bloom: '5-7', src: [yh17]}
  - name: ハクサンフウロ
    items:
      - {bloom: '7-8', src: [yh53b]}
  - name: トウヤクリンドウ
    items:
      - {bloom: null, timing: 晩夏〜初秋, place: 槍ヶ岳, src: [yh69], note: 田中澄江『花の百名山』で槍ヶ岳に選ばれた花。月の記載はない。月は足さない}
# 山ごとの記載(花暦ではない。見られる花の言い方と、花を見に行ける時期の前提)。月が読めた項目だけ月を入れる。
mountain_notes:
  - site: m037
    name: 槍ヶ岳
    notes:
      - {text: 田中澄江『花の百名山』で選ばれた花はトウヤクリンドウ(晩夏〜初秋)。種ごとの詳しい開花月は見つかっていない, src: [yh69]}
  - site: m047
    name: 仙丈ヶ岳
    notes:
      - {text: 氷河地形のカールが見られ、多くの高山植物が咲く。広河原へ通じる県営林道はマイカー規制区間があり、規制は6月下旬〜11月上旬、それ以外は冬季閉鎖, src: [ynk]}
      - {text: 山頂付近に3つのカールがあり、高山植物が非常に豊富。ニホンジカの食害を防ぐため馬の背ヒュッテ付近に防護柵がある, src: [rnk]}
      - {text: 花を見に行ける時期の前提として、仙丈小屋は例年6月中旬〜10月中旬(tabi-mag)。伊那市観光協会の2023年資料では長衛小屋7月1日〜10月9日・馬ノ背ヒュッテ7月1日〜10月中旬・仙丈小屋6月中旬〜10月下旬で、年・資料で幅がある, src: [ina, tbm]}
      - {text: 種ごとの開花月は見つかっていない, src: []}
  - site: m065
    name: 立山(天狗平)
    notes:
      - {text: 天狗平のチングルマの花の見頃は例年7月中旬〜8月上旬(紹介サイト。立山の公式の花暦がある場合は公式を優先), src: [yh51]}
