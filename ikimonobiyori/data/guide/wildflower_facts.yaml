species:
  キクザキイチゲ: {family: キンポウゲ科, habitat: 低地から山地の明るい林内, tip: 花は一般に白色。丹沢の高標高域では淡青色や桃色もある。葉は3出複葉で深く切れ込む}
  マメザクラ: {habitat: 山地, tip: 葉が出る前に、他の桜より小さな花が下向きに咲く。丹沢で最も早く咲く野生の桜}
  コケリンドウ: {habitat: 標高が高く、日当たりの良い尾根筋, tip: 丹沢で最も小さいリンドウの仲間}
  エイザンスミレ: {tip: 切れ込みの入った葉。花は淡紅色から白色}
  コイワザクラ: {habitat: 岩場やその周辺の草地, caution: 盗掘による減少の心配がある。採らない, protected: true}
  ツルキンバイ: {tip: 同じ時期によく似たミツバツチグリも咲く}
  ツルシロカネソウ: {habitat: 早春のブナ林, tip: 白い花びらのようなガクに、黄色の球状の花びらが目立つ}
  シロヤシオ: {family: ツツジ科, habitat: 太平洋側の山地, tip: 枝先に5枚の葉が輪生し、白い花。別名ゴヨウツツジ}
  トウゴクミツバツツジ: {family: ツツジ科, habitat: 山地の温帯上部の林内, tip: 赤紫色の花が咲くころ、枝先に3枚の葉が開く。雄しべは10本。類似種にミツバツツジ}
  ミツバツツジ: {family: ツツジ科, habitat: 山地の林内, tip: 葉より花が先に咲く。雄しべは5本}
  サラサドウダン: {tip: 風鈴のような小さい花が鈴なりに垂れ下がる}
  サンショウバラ: {family: バラ科, habitat: 山地（富士箱根周辺に分布）, tip: 葉がサンショウに似る。別名ハコネバラ}
  ヤマツツジ: {tip: 表丹沢の鍋割山などで5月に見られる（開花記録）}
  ケイワタバコ: {habitat: 渓谷などの湿った岩場, tip: 全体に毛が多い。似たイワタバコは毛がなく、花期も一か月ほど遅い}
  シモツケ: {habitat: 草地や岩場, tip: 枝先にピンク色の花が半球状に集まる。似た花にシモツケソウ}
  オオバイケイソウ: {habitat: やや湿った林内, tip: 梅に似た緑白色の花を多数つける}
  マルバダケブキ: {tip: 大型の草本。黄色い大きな花と根元の大きな葉が目立つ}
  ウスユキソウ: {tip: 薄く雪をまとったように見える葉の上に、目立たない花を咲かせる}
  タンザワイケマ: {caution: 有毒のつる性植物。触れない・口にしない, tip: 小さな白い花が半球状にまとまる。「丹沢」の名を持つ数少ない種}
  ヤマユリ: {tip: 神奈川県の花, caution: シカの食害で減っている。踏まない・採らない}
  イワギボウシ: {habitat: 湿った岩場や木の幹に着生, tip: 淡紫色の花。茎に紫褐色の斑点}
  タテヤマギク: {tip: 野菊の仲間。縁がぎざぎざの三角形の葉。白い舌状花が5〜8枚と少ない}
  ヤマホトトギス: {tip: 白地に紅紫色の斑点。花びらが反り返る（反り返らないのはホトトギス）}
  フジアザミ: {habitat: 砂礫地や崩壊地, tip: 10cm近い大きな花を下向きに咲かせる}
  テンニンソウ: {tip: 淡黄白色の花を密につける。雄しべと雌しべが突き出る, caution: シカの食害などで極端に減ったと山荘の発信にある}
  シロヨメナ: {habitat: 山麓からブナ林まで普通, tip: 花は直径2cmほど}
  サガミジョウロウホトトギス: {habitat: 谷間, tip: 黄色い花。丹沢が原産地の希少植物, caution: 希少種。採らない・谷に入り込まない, protected: true}
  イワシャジン: {habitat: 湿った岩場, tip: 細い茎に釣鐘形の花}
  ホソエノアザミ: {tip: 葉に針状のトゲ。花のつけ根にも強く反り返ったトゲ}
  ヤマトリカブト: {tip: 鳥兜に似た青紫色の花, caution: 草全体に毒がある。触れない・口にしない}
  ダイモンジソウ: {habitat: 湿った岩場や木の幹に着生, tip: 花の形が「大」の字に見える}
  リンドウ: {tip: 紫色のすじが入った花を上向きに咲かせる}
  センブリ: {caution: 資料に、リンドウと同じ説明文が重なって載っている（見分けは図鑑で確認）}
  リュウノウギク: {habitat: 日当たりの良い尾根筋など, tip: 浅く裂けた葉の野菊の仲間。花は直径3〜4.5cm}
  ヤマルリソウ: {habitat: 落葉樹林の林縁や道端, tip: 淡紫色から淡紅色の花を次々につける}
  ヒトリシズカ: {family: センリョウ科, habitat: 丘陵や低山の林内, tip: ブラシのような白い花を1本だけ出す}
  ミツマタ: {tip: 中国南部原産の落葉低木。丹沢にも群生地がある}
  ワチガイソウ: {habitat: 山地の木陰, tip: 細い茎の先に白い小さな5弁の花。星のような赤い雄しべ}
  ギンリョウソウ: {habitat: 山地の林内, tip: 葉緑素がない腐生植物}
  マムシグサ: {habitat: 山地のやや暗い林内, tip: 仏炎苞は緑色で白い筋が入る（紫褐色もある）, caution: 有毒のサトイモ科。触れた手で目をこすらない}
  ミミガタテンナンショウ: {habitat: 山野の林内, tip: 仏炎苞の口辺部が耳たぶ状に張り出す}
  ヨゴレネコノメ: {habitat: 低山から山地の湿地, tip: 萼片の色が汚れた色。見分けが難しい花の一つ}
  タニギキョウ: {habitat: 山地の湿った林内, tip: 小さな花が上向きに咲く}
  クワガタソウ: {habitat: 山地のやや湿った林内, tip: 似た花にヤマクワガタ}
  ヒメレンゲ: {habitat: 低地から山地の沢沿いの岩の上, tip: 黄色い花。別名コマンネンソウ}
  マルバスミレ: {habitat: 低山の森林や林縁}
  キンラン: {family: ラン科, habitat: 平地・丘陵地の林の下, tip: 黄色い花。花弁の内側に赤い筋, caution: ラン科。採らない・林床に入り込まない, protected: true}
  ギンラン: {family: ラン科, habitat: 低地から山地の林内, tip: 白い花, caution: ラン科。採らない・林床に入り込まない, protected: true}
  キバナノショウキラン: {family: ラン科, habitat: 山地の落葉樹林下, tip: 腐生植物, caution: ラン科。採らない・林床に入り込まない, protected: true}
  クモキリソウ: {family: ラン科, habitat: 落葉広葉樹の林床や林縁, tip: 淡緑色の花。唇弁が強く反り返る, caution: ラン科。採らない・林床に入り込まない, protected: true}
  クマガイソウ: {caution: 保護が必要な野草。採らない・湿原や林床に入り込まない, protected: true}
  カキラン: {caution: 保護が必要な野草。採らない・湿原や林床に入り込まない, protected: true}
  ミズチドリ: {caution: 保護が必要な野草。採らない・湿原や林床に入り込まない, protected: true}
  ススキ: {habitat: 仙石原の台ケ岳の山裾の草原, tip: 秋の七草の一つ。毎年3月に山焼きが行われる}
  ノハナショウブ: {habitat: 湿原, tip: 仙石原湿原を代表する花の一つ}
