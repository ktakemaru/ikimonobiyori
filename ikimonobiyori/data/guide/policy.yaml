  min_sources_established: {value: 2, source: "指示書 stage40 3章・stage39 D-2: 独立した発行元が 2 件以上で定評、1 件は仮", provisional: true}
  max_names_in_sentence: {value: 5, source: "仮置き(段階40)。コンシェルジュが添える文に並べる花の数", provisional: true}
  site_elevation_floor_margin_m: {value: 0, source: "仮置き(段階40)。地点の標高が、花の標高の下限に届かない花は、その地点の出力に入れない（下限の記載があるときだけ）", provisional: true}
  alpine_min_elevation_m: {value: 2500, source: "仮置き(段階43)。高山の花と山麓〜山地の花を分ける標高の目安。富士登山オフィシャルサイトに森林限界は2,500m付近、国土交通省の観光情報に北岳の森林限界は2,700mとある。高原（霧ヶ峰など）は高山に入れない", provisional: true}
  subalpine_min_elevation_m: {value: 1500, source: "利用者の指示(2026-11-04): 高山の線(2500m)の下で、1500m以上を「亜高山・高原」として別の見出しにする（霧ヶ峰・尾瀬・八島ヶ原・会津駒ヶ岳など）", provisional: true}
