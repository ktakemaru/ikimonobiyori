  さざんか: {themes: [花], kinds: [サザンカ]}
  サザンカ: {themes: [花], kinds: [サザンカ]}
  山茶花: {themes: [花], kinds: [サザンカ]}
  ロウバイ: {themes: [花], kinds: [ロウバイ]}
  蝋梅: {themes: [花], kinds: [ロウバイ]}
