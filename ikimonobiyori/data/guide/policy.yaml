# ガイド型の質問(「どこで・いつごろ・どんな種類?」)のための方針(段階23。ikimonobiyori/guide.py が読む。コードに値を持たない)。
# 現況型の質問(「今どうなっている?」)は、これまでどおり data/sources/ の台帳と status_log で答える(このファイルは使わない)。
# 正本の決定は docs/stage23-decisions.md。指示書 stage23-instructions.md(ユーザー承認 2026-10-25)。
schema: ikimono-guide-policy/1
source: "指示書 段階23(2026-10-25 ユーザー承認)"

# 信頼の段階(D-02)。ホシビヨリの curated_external(定評)・viewpoint_reference(参考)と言葉の意味をそろえる
tiers:
  order: [verified, curated, reference]                  # 強い順。表示の並びにも使う
  curated:
    min_independent: {value: 3, source: "指示書 段階23 フェーズ2 の 4(ユーザー承認 2026-10-25)", provisional: true}
    # テーマごとの上書き(段階24。ユーザーの決定 2026-10-30)。ここにないテーマは上の既定。「冬鳥」を野鳥と同じ扱いにするのは解釈(野鳥の一部と考えた。docs/stage24-decisions.md)
    min_independent_by_theme:
      野鳥: {value: 2, source: "ユーザー指示 2026-10-30(段階24)", provisional: false}
      冬鳥: {value: 2, source: "ユーザー指示 2026-10-30(段階24。冬鳥は野鳥の一部と解釈)", provisional: false}
    needs_class_any: [A, B, C]
  verified:
    status_classes: [A]                                  # 現地の発信(A)で、日付つきの状態が読めたもの。または、ユーザーが「行って確認した」と記録したもの
  labels: {verified: 確認済み, curated: 定評, reference: 参考}
# 却下・退役した対象と出どころは、件数が足りても自動で定評にしない(段階24。ユーザーの決定 2026-10-30)
#   catalog_status: 名所カタログ(data/catalog/*.yaml)の status がこの値の件(名前と出どころの URL を使う)。review_states: reviews の state がこの値の件
retired_guard:
  catalog_status: [retired]
  review_states: [rejected]
  # 出どころの URL だけを退役する(名所カタログの retired にない出どころ。定評の件数に数えない)。指示文の中身は書かない(存在と URL だけ)
  urls:
    - {url: "https://www.city.funabashi.lg.jp/kids/facilities/p000586.html", reason: "ページ内に指示文(段階25、2026-10-30)"}
    - {url: "https://www.city.tochigi.lg.jp/uploaded/attachment/42210.pdf", reason: "404(2026-10-30)。同じ栃木市の別のページ(site/watarase-heartland/2875.html)に差し替え(段階28)"}
# 実在の確認(フェーズ2 の 5): 自治体・公園・観光協会・メディア(A・B・C)の出どころで 1 件以上
existence_classes: [A, B, C]
# 取り出した種名・時期を、ガイドの答えに出してよい下限(独立した出どころの数。フェーズ3 の 2)
show_fact_min_independent: {value: 2, source: "指示書 段階23 フェーズ3 の 2", provisional: true}
# 範囲(250 km。data/catalog/policy.yaml の range_limit を使う)の距離の丸め(フェーズ2 の 6)
distance_step_km: {value: 10, source: "指示書 段階23 フェーズ2 の 6『距離は10 km単位でよい』", provisional: true}
# 「これから」の欄(フェーズ5): 例年の時期の始まりが、対象の日からこの日数以内に来る名所。仮置き
upcoming_days: {value: 60, source: "仮置き(段階23)。根拠のある値ではない。季節の前の『これから』を 2 か月ほど先まで見せるため", provisional: true}

# 出どころの区分(フェーズ2 の 2)。信頼の段階は区分ではなく、独立した出どころの数と新しさで決める(D-02)
classes:
  A: 運営者の発信
  B: 公的機関の資料
  C: 報道・観光メディア
  D: 個人の発信
default_class: C                                         # 表にないホストは C(指示書)
# 公的なドメインの PDF は「資料」(B)として扱う(調査報告など。運営者のお知らせのページは A のまま)
pdf_class_by_suffix: {lg.jp: B, go.jp: B, tokyo.jp: B, kanagawa.jp: B, saitama.jp: B, chiba.jp: B, ibaraki.jp: B, tochigi.jp: B, gunma.jp: B, yamanashi.jp: B, shizuoka.jp: B, nagano.jp: B, niigata.jp: B, fukushima.jp: B}
# 読まない・記録しないホスト(SNS。ログインが要る・自動アクセスを拒むことが多い。指示書の取得の条件)
unreadable_hosts: [x.com, twitter.com, instagram.com, facebook.com, tiktok.com, threads.net, youtube.com, line.me]
# 発行元の数え方(フェーズ2 の 3)。表にないホストは、下の公開接尾辞の 1 つ下までを発行元とする(rurubu.jp と kids.rurubu.jp は同じ)
public_suffixes: [co.jp, or.jp, ne.jp, go.jp, ac.jp, ed.jp, gr.jp, lg.jp, ad.jp, blog.jp, hatenablog.com, hatenablog.jp, fc2.com, livedoor.blog,
                  tokyo.jp, kanagawa.jp, saitama.jp, chiba.jp, ibaraki.jp, tochigi.jp, gunma.jp, yamanashi.jp, shizuoka.jp, nagano.jp, niigata.jp, fukushima.jp]
# 1 つのホストに多くの個人がいる場所(パスの最初の部分までを発行元とする)
path_platforms: [ameblo.jp, note.com]

