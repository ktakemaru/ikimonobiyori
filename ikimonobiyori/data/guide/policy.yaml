# 候補の記録(record-candidate)の項目。本文を写さないための長さの上限(仮置き。data/sources/policy.yaml の record と同じ考え方)
record:
  schema: ikimono-guide-candidate/1
  pending_theme_prefix: "pending:"                       # 段階39 B-5: テーマの表にない話題(野草など)は pending:<語> の仮のテーマで記録できる(あとで種類に昇格)
  dir: guide                                             # 書き込み先の基準(IKIMONOBIYORI_DATA_DIR)からの相対
  fields: [schema, scope, theme, name, prefecture, municipality, kinds, season, url, title, note, copies_of, status, closure, access, origin, seed_id,
           read_at, read_at_note, read_by, host, publisher, class]
  input_fields: [scope, theme, name, prefecture, municipality, kinds, season, url, title, note, copies_of, status, closure, access, origin, seed_id]
  scopes: [place, kind]                                  # place = 名所、kind = 種類の説明(冬の渡り鳥の種類と時期、桜・ホタルの種類など。場所を持たない)
  origins: [search, fetch, seed, user]                   # search = 検索結果の抜粋、fetch = 要約の道具でページを読んだ、seed = 付録A、user = ユーザーが行って確認した
  read_by: summary                                       # 種名・数字はコードが原文で確かめられないので「要約で読んだ」(フェーズ3 の 2)
  access_values: [walk_from_station, bus, car_only, ropeway, cable_car]
  max_name_chars: {value: 40, source: "仮置き(段階23)。本文を写さないための上限", provisional: true}
  max_kind_chars: {value: 20, source: "仮置き(段階23)", provisional: true}
  max_kinds: {value: 12, source: "仮置き(段階23)", provisional: true}
  max_note_chars: {value: 80, source: "仮置き(段階23)。事実の短い要約(「冬桜 約600本」程度)", provisional: true}
  max_title_chars: {value: 60, source: "仮置き(段階23)", provisional: true}
  max_season_chars: {value: 40, source: "仮置き(段階23)", provisional: true}
  max_state_chars: {value: 20, source: "data/sources/policy.yaml の record.max_state_chars と同じ", provisional: true}

# 検索・取得の回数の上限(指示書の通信の承認。ユーザー承認 2026-10-25)。guide log-request が数え、上限で止める
budget:
  collect: {search: 140, fetch: 60}                      # search は 80 → 140(段階25 承認B、ユーザー 2026-10-30)。fetch は 60 のまま
  trial: {search: 60, fetch: 40}
  answer: {search: 8, fetch: 8}                          # 1 質問あたり(試験の質問も、これと試験の合計の両方に入る)
  places_requests: 100                                   # 市区町村の代表点(www.wikidata.org)

# 答えられなかった質問の記録(フェーズ5 の 4。IKIMONOBIYORI_DATA_DIR の下。コミットしない)
unanswered_file: unanswered.jsonl
max_question_chars: {value: 200, source: "仮置き(段階23)", provisional: true}

# 市区町村の代表点の座標の桁(小数 2 桁 ≒ 1 km。範囲の判定は 10 km 単位なので足りる)
places_decimals: {value: 2, source: "仮置き(段階23)。data/catalog/policy.yaml の area_1km と同じ桁", provisional: true}
# 地域の呼び名 → 市区町村(都道府県で絞れない地域だけ。data/regions.yaml の areas はガイドの名所に付けていないため)
region_municipalities:
  富士山周辺:
    source: "Claude Code が付けた(段階23)。山梨県の富士五湖の 6 市町村と、静岡県の富士山の麓の 5 市町(富士山を囲む市町村)"
    municipalities: [富士吉田市, 富士河口湖町, 山中湖村, 忍野村, 鳴沢村, 西桂町, 富士宮市, 御殿場市, 小山町, 裾野市, 富士市]

# 参照数の表示(段階24。ユーザーの決定 2026-10-30)。ガイド型の場所の行・現況型のおすすめの行の文末に「（参照数 N）」。N = その場所の独立した発行元の数
reference_count:
  suffix: "（参照数 {n}）"
  legend: "参照数は、その場所を紹介している独立した発行元の数です。"
  # 現況の対象 → ガイドのテーマ(現況型の場所をガイドのカタログの同じ場所と照らす)
  subject_theme: {autumn_leaves: 紅葉, birds: 野鳥, wintering_birds: 冬鳥, flowers: 花}
# 野鳥の現況の 1 行(段階27 フェーズC。ユーザー承認A 2026-10-30)。台帳 data/sources/birds.yaml の tokyo-port-birdpark-today を要約の道具(WebFetch)で読み、
# 最新の記事の題名の日付・確認種数・種名を書かれたとおりに渡すと、コードが 1 行にする(guide bird-status)。確認種数から「多い・少ない」を推測しない
bird_status:
  source_id: tokyo-port-birdpark-today
  site: yacho-0001
  label: 今日の野鳥公園
  title_re: '(\d{4})年(\d{1,2})月(\d{1,2})日の野鳥公園'      # 記事の題名の形(台帳 notation.note)。日付の形でなければ使わない
  max_age_days: {value: 7, source: "指示書 段階27 フェーズC(ユーザー承認 2026-10-30)。これより古い記事は「最新の記事は○月○日です」と書く", provisional: false}
  lines:
    fresh: "東京港野鳥公園の最新の観察記録: {m}月{d}日{count}{species}。（簡易な読み取り。取得日 {fm}月{fd}日）"
    old: "東京港野鳥公園の最新の記事は{m}月{d}日です{count}{species}。（簡易な読み取り。取得日 {fm}月{fd}日）"
    unconfirmed: "東京港野鳥公園の最新の観察記録は確かめられませんでした。（簡易な読み取り。取得日 {fm}月{fd}日）"
    unread: "東京港野鳥公園の最新の観察記録は読めませんでした。"
  parts: {count: "（{text}）", species: "。種名: {text}"}
  max_species: {value: 10, source: "指示書 段階58 第10部 4(承認済みの施設の条件と同じ)", provisional: false}
  # 段階58 第10部: 答えに書く行(作業の事情を書かない)。guide bird-status の出力はこちら
  answer_lines:
    fresh: "東京港野鳥公園の最新の観察記録: {m}月{d}日{count}{species}。"
    old: "東京港野鳥公園の最新の記事は{m}月{d}日です{count}{species}。"
    unconfirmed: "東京港野鳥公園の最新の観察記録は確かめられませんでした。"
    unread: "東京港野鳥公園の最新の観察記録は読めませんでした。"

# テーマごとの既定の時期(段階27 フェーズB。ユーザー承認 2026-10-30)。表示してよい例年の時期(独立した出どころ 2 件以上の窓)が無い名所に使う。ここにないテーマ(冬鳥・桜・花・ホタル・紅葉)には使わない
season_default_by_theme:
  野鳥: {window: year_round, source: "ユーザー承認 2026-10-30。野鳥プロファイル profiles/birds.yaml の season.months が 1〜12", provisional: false}
# ガイド型の答え(コードが組み立てる文。guide find --text)の文言。段階の表示は labels(確認済み / 定評 / 参考)。内部用語を出さない
answer:
  headings: {recommend: おすすめ, upcoming: これから, other_season: 例年の時期の外の名所, no_season: 例年の時期を確かめられていない名所, reference: 参考, out_of_range: 範囲の外, notes: 注意}
  # 注意の行(段階27 フェーズA)。プロファイルの care.manners を、テーマごとに先頭から max_manners 件、1 行にする(文はプロファイルの原文。括弧の出どころ注記は除く)。コードに文言を持たない
  # 既定の時期を使った名所の表示(段階27 フェーズB)。出どころが 1 件だけ時期を書いているときは、その文を括弧で併記する
  season_default: {plain: "通年が目安（出どころに時期の特記なし）", with_text: "通年が目安（出どころ1件の記載: {text}）"}
  notes: {profiles: {野鳥: birds, 冬鳥: wintering_birds}, max_manners: 2, line: "{theme}の観察では、{text}"}
  none_found: "おすすめにできる名所は見つかりませんでした。"
  # 段階39 B-3: 結論を先頭に、参考の欄は短く、「いつ頃から」は種類ごとの時期の順で答える
  conclusion:
    recommend: "{when}におすすめの名所は、{names}です。"
    upcoming: "{when}はまだ早い時期です。これから見ごろに入る名所は、{names}です。"
    none: "{when}におすすめできる名所は見つかりませんでした。"
    date: "{m}月{d}日"
    no_date: "いま"
    sep: "・"
    max_names: {value: 3, source: "仮置き(段階39)。結論の 1 文に並べる名所の数", provisional: true}
  timeline:
    heading: 時期の順
    line: "- {kind}: 例年の時期は{text}({names})"
    sep: "・"
    more: "ほか"
    strip_prefix: "例年"                                 # 「例年の時期は例年…」の重なりを避ける
    max_kinds: {value: 6, source: "仮置き(段階39)。時期の順に出す種類の数", provisional: true}
  reference_max: {value: 5, source: "仮置き(段階39 B-3)。参考の欄に出す名所の数。残りは「ほか N 件」", provisional: true}
  reference_more: "- ほか{n}件"
  avoid:
    heading: 避けたほうがよい場所
    out_of_season: "{names}などは、今日は例年の時期の外で、咲いていない見込みです。"
    instead: "代わりに、{alt}がよいです。"
    few: "今日おすすめにできる名所は{n}件でした。ほかの名所は、上の「時期の順」の時期が来てからが目安です。"
    sep: "・"
    names_max: {value: 3, source: "仮置き(段階39)。避ける場所に名前を挙げる数", provisional: true}
    alt_max: {value: 3, source: "仮置き(段階39)。代わりの目的に挙げる数", provisional: true}
    few_max: {value: 2, source: "仮置き(段階39)。おすすめがこの件数以下のとき、少ないと書く", provisional: true}
  state_note: "今年の咲き具合・色づきの日付つきの記録は読めていません。以下は例年の時期の目安です。"
  state_note_keep_themes: [花, 桜]
  # 段階58 第10部: 対象別の定型文(テーマが分かるとき)
  state_note_by_theme:
    花: "今年の咲き具合の日付つきの記録は読めていません。以下は例年の時期の目安です。"
    桜: "今年の咲き具合の日付つきの記録は読めていません。以下は例年の時期の目安です。"
    紅葉: "今年の色づきの日付つきの記録は読めていません。以下は例年の時期の目安です。"
    野鳥: "今年の飛来・観察の日付つきの記録は読めていません。以下は例年の時期の目安です。"
    冬鳥: "今年の飛来・観察の日付つきの記録は読めていません。以下は例年の時期の目安です。"
    野草: "今年の開花の日付つきの記録は読めていません。以下は例年の時期の目安です。"
    ホタル: "今年の発生や飛ぶ時期の日付つきの記録は読めていません。以下は例年の時期の目安です。"
  arrival:
    heading: "飛来状況: "
    none: 今年の飛来の記録は読めていません。
    first: "{name} 初飛来({md})"
    count: "{name} 飛来数 {text}({md})"
  # 段階58 第10部: 短い答え(guide find --brief)。一覧は最大 list_max 件、今回のおすすめは picks 件、残りは「ほか○件」
  brief:
    picks: 3
    list_max: 5
    picks_heading: 今回のおすすめ
    list_heading: ほかの候補
    more: "ほか{n}件"
    confidence: "公式の発信と紹介サイトの情報を合わせています。お出かけの前に公式ページで確認してください。"
    no_official: "紹介サイトの情報からまとめています(公式ではありません)。"
  sources: {heading: 出典, per_place: {value: 1, source: "仮置き(段階39)。名所ごとに出す出典 URL の数", provisional: true}, max: {value: 5, source: "仮置き(段階39)。出典 URL の全体の数", provisional: true}}
  place: "{i}. **{name}**({where})"
  bits: {season: "例年の時期: {text}", kinds: "種類: {text}", tier: "{label}", classes: "出どころの区分: {text}", distance: "{origin}から約{km} km", edge: "範囲の端", user: "あなたが行った場所", why_in_season: "対象の日は例年の時期に入っています"}
  reference_item: "- {name}({where})"
  forbidden_terms: [tier, independent_sources, auto-rule, reference, curated, verified, provisional, candidate]

# 既存の記録への追記(段階26。guide annotate)。同じ URL の記録は重複で足せないため、後から分かった事実(所在の市区町村・種名・時期)を「追記の記録」として別に残す。
# 出どころの URL・区分・発行元は変えられない。追記は記録の上書きではない(いつ・何を・どのページの記載かが残る)。独立した発行元の数え方・種名を出す下限は変えない
annotation:
  schema: ikimono-guide-annotation/1
  file: annotations.jsonl                                 # 書き込み先は IKIMONOBIYORI_DATA_DIR の下の guide/。見直して置いた写しは data/guide/annotations.jsonl
  input_fields: [scope, theme, name, prefecture, url, municipality, kinds, season, summary]
  fields: [municipality, kinds, season]                   # 追記できる項目
  max_summary_chars: {value: 80, source: "仮置き(段階26)。ページの記載の短い要約(本文を写さない)", provisional: true}

# 野鳥の案内ページの代表写真(段階29。ユーザー承認 2026-10-30 承認A・B・C。docs/stage29-decisions.md)。コードに値を持たない。
# 写真は「種の代表写真」で、その場所で撮られたものではない。写真・画像の URL・撮影者名はコミットしない(キャッシュは IKIMONOBIYORI_DATA_DIR の下)
photos:
  table_file: bird_taxa.yaml                              # 和名 → 学名 / iNaturalist の taxon id / 確認日(事実だけ。画像・写真の URL は含まない)。data/guide/ に置く
  table_schema: ikimono-bird-taxa/1
  review_file: photo_review.json                          # 目で見て写真を使わないと決めた種(手元の書き出し。コミットしない)
  multi_file: bird_taxa_multi.json                        # 「候補が 2 件以上」から種を採った和名の候補の一覧(報告用。手元の書き出し)
  check_file: photo_checks.json                           # 段階82 第4部: 写真を見て点検した記録 {taxon_id: {name, checked_on, verdict(ok/ng), reason, photo_page}}(手元の書き出し)
  commons_deny_file: photo_commons_denied.json            # 段階82 第4部: 点検で不可にした Commons のファイル名(次の候補を選ぶとき飛ばす)
  check_archive_dir: checked_ng                           # 段階82 第4部: 不可にした写真の控え(写真のキャッシュの下。消さずに残す)
  check_max_ng: 3                                         # 段階82 第4部 4.2: 1 つの種で不可がこの回数になったら写真なし(photo_review.json に入れ、取り直さない)
  skip_photo_file: photo_skip.json                        # 目で見て使わないと決めた iNaturalist の写真の id(種は残す。手元の書き出し。コミットしない)
  rejected_file: bird_taxa_rejected.json                  # 表に入らなかった和名と理由(IKIMONOBIYORI_DATA_DIR の下の guide/export/。同じ和名は取り直さない)
  cache_dir: photos                                       # IKIMONOBIYORI_DATA_DIR の下の guide/ からの相対(画像と撮影者などのメタデータ)
  page_dir: pages                                         # 同じく、出力した HTML の置き場所
  page_file: bird-guide.html                              # 出力する HTML のファイル名の既定(--out を渡さないとき)
  api_base: "https://api.inaturalist.org/v1"
  locale: ja
  search_per_page: {value: 30, source: "仮置き(段階29)。和名の完全一致を探すための 1 回の候補の数", provisional: true}
  max_requests_per_run: {value: 80, source: "ユーザー承認 2026-10-30(承認A。指示書 段階29 §2。1 回の実行の上限)", provisional: false}
  min_interval_s: {value: 1, source: "ユーザー承認 2026-10-30(指示書 段階29 §2。リクエストの間隔は 1 秒以上)", provisional: false}
  max_image_bytes: {value: 2000000, source: "ユーザー指示 2026-10-30(指示書 段階29 §3。1 枚 2MB を超えたら使わない)", provisional: false}
  # 段階39: 確認なしの自動取得(ユーザー承認B 2026-11-03)。キャッシュにない種だけ取りに行く。通信先・間隔・1 回の上限は上の承認のまま変えない
  auto_fetch_source: "ユーザー承認B 2026-11-03: 確認なしの自動取得(キャッシュにない種だけ。iNaturalist の API と画像の 2 ホスト、Wikimedia Commons。上限・間隔・通信先は承認A・段階30のまま)"
  none_file: photo_none.json                              # 写真が取れなかった種の負のキャッシュ(IKIMONOBIYORI_DATA_DIR の下の guide/export/。コミットしない)
  negative_cache_days: {value: 14, source: "仮置き(段階39 A-3)。写真が取れなかった種を探し直さない日数", provisional: true}
  prefetch_gap_s: {value: 5, source: "仮置き(段階39 A-4)。事前取得で実行と実行の間にあける秒数(承認の間隔 1 秒以上)", provisional: true}
  themes:                                                 # 写真の対象(段階39)。花・野草は植物(Plantae)。園芸種・雑種のランクも採る
    野鳥: {class_name: Aves, table_file: bird_taxa.yaml}
    花: {class_name: Plantae, table_file: flower_taxa.yaml, ranks: [species, hybrid, genus, variety, subspecies]}   # 段階51: 変種・亜種も採る（ツワブキ・リンドウ・ノコンギクなど）
