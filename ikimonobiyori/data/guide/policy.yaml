# テーマ(themes)。種類(kinds)の例は答えの材料ではなく、言い換えの表の目安
themes: [野鳥, 冬鳥, 桜, 花, ホタル, 紅葉]
# 質問の言葉 → テーマ・種類・答えられる現況の対象(フェーズ5 の 1)。現況の対象は data/sources/policy.yaml の topics と同じ考え方
words:
  野鳥: {themes: [野鳥, 冬鳥]}
  鳥: {themes: [野鳥, 冬鳥]}
  探鳥: {themes: [野鳥, 冬鳥]}
  渡り鳥: {themes: [冬鳥, 野鳥]}
  冬鳥: {themes: [冬鳥]}
  白鳥: {themes: [冬鳥], kinds: [ハクチョウ]}
  ハクチョウ: {themes: [冬鳥], kinds: [ハクチョウ]}
  カモ: {themes: [冬鳥], kinds: [カモ]}
  ツル: {themes: [冬鳥], kinds: [ツル]}
  カワセミ: {themes: [野鳥], kinds: [カワセミ]}
  ホタル: {themes: [ホタル]}
