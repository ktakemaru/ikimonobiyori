  - {suffix: kankyo.metro.tokyo.lg.jp, class: B, publisher: 東京都}
  - {suffix: kensetsu.metro.tokyo.lg.jp, class: B, publisher: 東京都}
  - {suffix: lg.jp, class: A}
  - {suffix: tokyo.jp, class: A}
