# 候補の記録(record-candidate)の項目。本文を写さないための長さの上限(仮置き。data/sources/policy.yaml の record と同じ考え方)
record:
  schema: ikimono-guide-candidate/1
  dir: guide                                             # 書き込み先の基準(IKIMONOBIYORI_DATA_DIR)からの相対
  fields: [schema, scope, theme, name, prefecture, municipality, kinds, season, url, title, note, copies_of, status, closure, access, origin, seed_id,
           read_at, read_at_note, read_by, host, publisher, class]
  input_fields: [scope, theme, name, prefecture, municipality, kinds, season, url, title, note, copies_of, status, closure, access, origin, seed_id]
  scopes: [place, kind]                                  # place = 名所、kind = 種類の説明(冬の渡り鳥の種類と時期、桜・ホタルの種類など。場所を持たない)
  origins: [search, fetch, seed, user]                   # search = 検索結果の抜粋、fetch = 要約の道具でページを読んだ、seed = 付録A、user = ユーザーが行って確認した
  read_by: summary                                       # 種名・数字はコードが原文で確かめられないので「要約で読んだ」(フェーズ3 の 2)
  access_values: [walk_from_station, bus, car_only, ropeway, cable_car]
  max_name_chars: {value: 40, source: "仮置き(段階23)。本文を写さないための上限", provisional: true}
  max_kind_chars: {value: 20, source: "仮置き(段階23)", provisional: true}
  max_kinds: {value: 12, source: "仮置き(段階23)", provisional: true}
  max_note_chars: {value: 80, source: "仮置き(段階23)。事実の短い要約(「冬桜 約600本」程度)", provisional: true}
  max_title_chars: {value: 60, source: "仮置き(段階23)", provisional: true}
  max_season_chars: {value: 40, source: "仮置き(段階23)", provisional: true}
  max_state_chars: {value: 20, source: "data/sources/policy.yaml の record.max_state_chars と同じ", provisional: true}

# 検索・取得の回数の上限(指示書の通信の承認。ユーザー承認 2026-10-25)。guide log-request が数え、上限で止める
budget:
  collect: {search: 140, fetch: 60}                      # search は 80 → 140(段階25 承認B、ユーザー 2026-10-30)。fetch は 60 のまま
  trial: {search: 60, fetch: 40}
  answer: {search: 8, fetch: 8}                          # 1 質問あたり(試験の質問も、これと試験の合計の両方に入る)
  places_requests: 100                                   # 市区町村の代表点(www.wikidata.org)

# 答えられなかった質問の記録(フェーズ5 の 4。IKIMONOBIYORI_DATA_DIR の下。コミットしない)
unanswered_file: unanswered.jsonl
max_question_chars: {value: 200, source: "仮置き(段階23)", provisional: true}

# 市区町村の代表点の座標の桁(小数 2 桁 ≒ 1 km。範囲の判定は 10 km 単位なので足りる)
places_decimals: {value: 2, source: "仮置き(段階23)。data/catalog/policy.yaml の area_1km と同じ桁", provisional: true}
# 地域の呼び名 → 市区町村(都道府県で絞れない地域だけ。data/regions.yaml の areas はガイドの名所に付けていないため)
region_municipalities:
  富士山周辺:
    source: "Claude Code が付けた(段階23)。山梨県の富士五湖の 6 市町村と、静岡県の富士山の麓の 5 市町(富士山を囲む市町村)"
    municipalities: [富士吉田市, 富士河口湖町, 山中湖村, 忍野村, 鳴沢村, 西桂町, 富士宮市, 御殿場市, 小山町, 裾野市, 富士市]

# 参照数の表示(段階24。ユーザーの決定 2026-10-30)。ガイド型の場所の行・現況型のおすすめの行の文末に「（参照数 N）」。N = その場所の独立した発行元の数
reference_count:
  suffix: "（参照数 {n}）"
  legend: "参照数は、その場所を紹介している独立した発行元の数です。"
  # 現況の対象 → ガイドのテーマ(現況型の場所をガイドのカタログの同じ場所と照らす)
  subject_theme: {autumn_leaves: 紅葉, birds: 野鳥, wintering_birds: 冬鳥, flowers: 花}
# ガイド型の答え(コードが組み立てる文。guide find --text)の文言。段階の表示は labels(確認済み / 定評 / 参考)。内部用語を出さない
answer:
  headings: {recommend: おすすめ, upcoming: これから, no_season: 例年の時期を確かめられていない名所, reference: 参考, notes: 注意}
  none_found: "おすすめにできる名所は見つかりませんでした。"
  place: "{i}. **{name}**({where})"
  bits: {season: "例年の時期: {text}", kinds: "種類: {text}", tier: "{label}", classes: "出どころの区分: {text}", distance: "{origin}から約{km} km", edge: "範囲の端"}
  reference_item: "- {name}({where})"
  forbidden_terms: [tier, independent_sources, auto-rule, reference, curated, verified, provisional, candidate]
