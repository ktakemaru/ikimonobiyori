    野鳥: [カワセミ, ジョウビタキ, ルリビタキ, シロハラ, アカハラ, ツグミ, ヒヨドリ, メジロ, シジュウカラ, ヤマガラ, エナガ, コゲラ, アオゲラ, アカゲラ, モズ, ホオジロ, アオジ, カシラダカ, ミヤマホオジロ, シメ, イカル, マヒワ, カワラヒワ, ベニマシコ, ウソ, アトリ, スズメ, ハクセキレイ, セグロセキレイ, キセキレイ, タヒバリ, ムクドリ, ハシボソガラス, ハシブトガラス, オナガ, カケス, キジバト, ドバト, キジ, カルガモ, マガモ, コガモ, ハシビロガモ, オナガガモ, ヒドリガモ, オカヨシガモ, ヨシガモ, トモエガモ, ホシハジロ, キンクロハジロ, スズガモ, ミコアイサ, オシドリ, カイツブリ, カンムリカイツブリ, ハジロカイツブリ, カワウ, ダイサギ, チュウサギ, コサギ, アオサギ, ゴイサギ, バン, オオバン, クイナ, ヒクイナ, タゲリ, ケリ, コチドリ, イカルチドリ, シロチドリ, ダイゼン, ハマシギ, ミユビシギ, イソシギ, タシギ, ユリカモメ, ウミネコ, セグロカモメ, オオセグロカモメ, カモメ, ミサゴ, トビ, ノスリ, ハイタカ, オオタカ, チョウゲンボウ, ハヤブサ, フクロウ, アオバズク, ヒレンジャク, キレンジャク, イソヒヨドリ, ノビタキ, キビタキ, オオルリ, ウグイス, コハクチョウ, オオハクチョウ, マナヅル, ナベヅル, オオジュリン, ハッカチョウ, ガビチョウ, マルガモ, サシバ, カワラヒワ]
    野草: [キクザキイチゲ, マメザクラ, コケリンドウ, エイザンスミレ, ツルキンバイ, ツルシロカネソウ, シロヤシオ, トウゴクミツバツツジ, ミツバツツジ, サラサドウダン, サンショウバラ, ヤマツツジ, ケイワタバコ, シモツケ, オオバイケイソウ, マルバダケブキ, ウスユキソウ, タンザワイケマ, ヤマユリ, イワギボウシ, タテヤマギク, ヤマホトトギス, フジアザミ, テンニンソウ, シロヨメナ, イワシャジン, ホソエノアザミ, ヤマトリカブト, ダイモンジソウ, リンドウ, センブリ, リュウノウギク, ヤマルリソウ, ヒトリシズカ, ミツマタ, ワチガイソウ, ギンリョウソウ, マムシグサ, ミミガタテンナンショウ, ヨゴレネコノメ, タニギキョウ, クワガタソウ, ヒメレンゲ, マルバスミレ, ノハナショウブ, セツブンソウ, フクジュソウ, ザゼンソウ, ミズバショウ, カタクリ, リュウキンカ, シラネアオイ, コマクサ, ハクサンイチゲ, チングルマ, ミヤマキンバイ, ミヤマクロユリ, クロユリ, シナノキンバイ, ヨツバシオガマ, ニッコウキスゲ, ヤマオダマキ, ミヤマキンポウゲ, ミヤマリンドウ, トウヤクリンドウ, エゾリンドウ, ミネズオウ, イワウメ, ミヤマダイコンソウ, コバイケイソウ, ミヤマアズマギク, ハクサンフウロ, イワカガミ, タカネバラ, サクラソウ, キレンゲツツジ, カキツバタ, クロユリ, ニッコウキスゲ, ヤマボウシ, クガイソウ, ヒメユリ, オカトラノオ, ヤマアジサイ, キキョウ, カワラナデシコ, レンゲショウマ, エゾリンドウ, ワレモコウ, サクラタデ, エンシュウハグマ, ヤマラッキョウ, ミズトラノオ, アカヤシオ, ニリンソウ, コアジサイ, キンバイソウ, コバイケイソウ, シャガ, タカオヒゴタイ, チゴユリ, フタリシズカ, ヤブデマリ, タカオスミレ, ジュウニヒトエ, イカリソウ, イチリンソウ, ミヤマエンレイソウ, アケボノスミレ, ナガバノスミレサイシン, ヤマネコノメソウ, ハナネコノメ, ミヤマカタバミ, ウグイスカグラ, フシグロセンノウ, ミズヒキ, キジョラン, ショウジョウバカマ, サクラスミレ, ズミ, スズラン, レンゲツツジ, アマドコロ, アヤメ, ウツボグサ, ミズチドリ, オオバギボウシ, ホタルブクロ, アカバナシモツケ, コオニユリ, コウリンカ, カラマツソウ, ツリガネニンジン, ヤナギラン, ウメバチソウ, マツムシソウ, ハバヤマボクチ, アキノキリンソウ, ススキ, ハクサンコザクラ, メイゲツソウ, タテヤマリンドウ]                  # 段階40（タテヤマリンドウは段階51で追加）: 野草・高山植物の花暦に出る種（保護が必要な種は除く。仮置き）
