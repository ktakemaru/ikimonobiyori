# 地域の呼び名 → 名所カタログの条件(段階16 B-4 の質問の型②「どこで」・⑤「範囲の外」)。ikimonobiyori/sources.py の region が読む。
# - match: 名所カタログの tags.prefecture(prefectures)か tags.area(areas)のどれかに一致する名所を、その地域の名所とする。
# - points: 範囲(東京・横浜から直線 250 km。data/catalog/policy.yaml の range_limit)の内外を言うための代表点。
#   座標は Claude Code の知識による推定(小数 2 桁、市役所・町役場や名所の付近)。県境・地方の端の正確な位置ではないので、
#   「代表点で見て」と言う。範囲の判定はコードが距離を計算する(この表に内外を書かない)。
schema: ikimono-regions/1
points_source: "Claude Code の知識による推定(小数 2 桁)。段階16"
regions:
  # ---- 範囲の中(名所カタログに名所がある地域) ----
  - {name: 都内, aliases: [東京都内, 東京, 都心, 東京都], match: {prefectures: [東京都]}}
  - {name: 箱根, aliases: [], match: {areas: [箱根]}}
  - {name: 富士山周辺, aliases: [富士山, 富士五湖, 河口湖, 富士山麓], match: {areas: [富士五湖, 富士山麓]},
     note: "静岡県側(富士宮市・御殿場市・小山町)も富士山周辺。カタログの area を 富士山麓 にする"}
  - {name: 日光, aliases: [奥日光, 鬼怒川, 日光市], match: {areas: [日光]}}
  - {name: 鎌倉, aliases: [], match: {areas: [鎌倉]}}
  - {name: 秩父・長瀞, aliases: [秩父, 長瀞], match: {areas: [秩父・長瀞]}}
  - {name: 軽井沢, aliases: [], match: {areas: [軽井沢]}}
  - {name: 谷川岳, aliases: [水上, みなかみ], match: {areas: [谷川岳]}}
  - {name: 白馬, aliases: [八方尾根, 白馬村], match: {areas: [白馬]}}
  - {name: 栃木県, aliases: [栃木], match: {prefectures: [栃木県]}}
  - {name: 群馬県, aliases: [群馬], match: {prefectures: [群馬県]}}
  - {name: 茨城県, aliases: [茨城], match: {prefectures: [茨城県]}}
  - {name: 埼玉県, aliases: [埼玉], match: {prefectures: [埼玉県]}}
  - {name: 千葉県, aliases: [千葉, 房総], match: {prefectures: [千葉県]}}
  - {name: 神奈川県, aliases: [神奈川], match: {prefectures: [神奈川県]}}
  - {name: 山梨県, aliases: [山梨], match: {prefectures: [山梨県]}}
  - {name: 静岡県, aliases: [静岡], match: {prefectures: [静岡県]}}
  - {name: 長野県, aliases: [長野, 信州], match: {prefectures: [長野県]},
     points: [{name: 軽井沢町, lat: 36.35, lon: 138.60}, {name: 長野市, lat: 36.65, lon: 138.18}, {name: 松本市, lat: 36.24, lon: 137.97},
              {name: 白馬村, lat: 36.70, lon: 137.86}, {name: 上高地, lat: 36.25, lon: 137.64}, {name: 飯田市, lat: 35.51, lon: 137.82}]}
  # ---- 範囲の一部だけ、または外(名所カタログ・情報源がまだない) ----
  - name: 東北
    aliases: [東北地方, 福島, 福島県, 宮城, 宮城県, 山形, 山形県, 岩手, 秋田, 青森]
