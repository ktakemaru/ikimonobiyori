      - {name: 丸森町, prefecture: 宮城県, lat: 37.91, lon: 140.77}
      - {name: 白石市, prefecture: 宮城県, lat: 38.00, lon: 140.62}
      - {name: 仙台市, prefecture: 宮城県, lat: 38.27, lon: 140.87}
      - {name: 米沢市, prefecture: 山形県, lat: 37.92, lon: 140.12}
      - {name: 山形市, prefecture: 山形県, lat: 38.24, lon: 140.36}
      - {name: 盛岡市, prefecture: 岩手県, lat: 39.70, lon: 141.15}
      - {name: 秋田市, prefecture: 秋田県, lat: 39.72, lon: 140.10}
      - {name: 青森市, prefecture: 青森県, lat: 40.82, lon: 140.74}
  - name: 新潟・北陸
    aliases: [新潟, 新潟県, 北陸, 富山, 石川, 金沢, 福井]
    match: {prefectures: [新潟県, 富山県, 石川県, 福井県]}
    points:
      - {name: 湯沢町, prefecture: 新潟県, lat: 36.93, lon: 138.81}
