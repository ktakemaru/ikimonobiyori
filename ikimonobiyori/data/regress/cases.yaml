# 回帰テストの代表的な質問（段階54 第9部。ikimonobiyori/regress.py が読む）。入力はすべて合成データ。実在のページの文章は使わない。
# expect: ok = 検査が全部通る答え。 expect_fail: [コード] = これまでの試用で見つかった崩れの再現（検査が見つけられること）。
# facts: 集めた事実の合成（subject・dates・region・candidates[name,state,date,typ,cls,url,festivals]）。
schema: ikimono-regress/1
# 先頭の結論の文の最小の長さ（これより短い先頭行は結論とみなさない）。仮置き（provisional）
min_lead_chars: 12
cases:
  # ---- 通る答え（質問の型ごと） ----
  - id: weekend-autumn-kanagawa
    question: 来週末ではなく今週末、神奈川で紅葉を見に行きたい
    expect: ok
    facts: &kana
      subject: autumn_leaves
      dates: ['2026-11-07', '2026-11-08']
      region: 神奈川
      candidates:
        - {name: 試験の湖, state: 色づき始め, date: '2026-11-05', typ: 11月上旬～11月下旬}
        - {name: 試験の峠, state: 色づき始め, date: '2026-11-05', typ: 10月中旬～11月下旬}
        - {name: 試験の温泉, state: 色づき始め, date: '2026-11-05', typ: 11月中旬～12月上旬}
    answer: |
      今週末(11/7・11/8)の試験県は、まだ色づき始めの名所が多く、紅葉の入り口を楽しむ週末になりそうです。
      試験サイトの11/5時点の情報では、多くの名所が「色づき始め」でした。
      今回のおすすめ
      ① 試験の峠: 紅葉は色づき始め(11/5時点、試験サイト)。例年の見頃は10月中旬～11月下旬で、今がいちばん近い場所です。
      ② 試験の湖: 色づき始め(11/5時点)。例年の見頃は11月上旬～11月下旬で、これから進みます。
      ③ 試験の温泉: 色づき始め。例年の見頃は11月中旬～12月上旬です。
      どちらを重視しますか?
      アクセスや混雑は出かける前に公式ページで確認してください。
      https://kouyou.example.com/k
