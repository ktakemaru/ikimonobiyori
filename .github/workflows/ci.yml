# 単体テスト(通信なし)。push と pull_request のときだけ。定期実行(schedule)は付けない。
# BIYORI_UNDER_TEST=1 なので、--live は環境変数に関わらず常に拒否される(ikimonobiyori/livegate.py)。ソケットは tests/nonet.py で禁止。
# このワークフローは実通信をしない(Open-Meteo・iNaturalist のどちらにも接続しない)。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest は Ubuntu 26 へ移行中なので、Linux 側は ubuntu-24.04 に固定する(biyori-hub と同じ)。
        os: [ubuntu-24.04, windows-latest]
    env:
      BIYORI_UNDER_TEST: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests -v
